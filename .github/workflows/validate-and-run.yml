name: Test Validation & Quality Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: true
        default: "https://github.com/DeviPrasad372002/flask-test-repo.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
      sonar_analysis:
        description: "Run SonarCloud analysis"
        required: false
        default: "true"
      bug_detection_level:
        description: "Bug detection thoroughness"
        required: false
        default: "comprehensive"
        type: choice
        options: [basic, standard, comprehensive]
  push:
    branches: [ test ]
defaults:
  run:
    shell: bash

# Prevent overlapping runs of this workflow name
concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      DATABASE_URL: "sqlite:///:memory:"
      DB_URL: "sqlite:///:memory:"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    outputs:
      coverage-percentage: ${{ steps.coverage.outputs.coverage-percentage }}
      tests-passed: ${{ steps.test-results.outputs.tests-passed }}
      tests-total: ${{ steps.test-results.outputs.tests-total }}
      tests-failed: ${{ steps.test-results.outputs.tests-failed }}
      pass-percentage: ${{ steps.test-results.outputs.pass-percentage }}
      bugs-found: ${{ steps.bug-analysis.outputs.bugs-found }}
      security-issues: ${{ steps.bug-analysis.outputs.security-issues }}
      quality-score: ${{ steps.bug-analysis.outputs.quality-score }}

    steps:
      - name: Checkout pipeline repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repository to ./target_repo
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/flask-test-repo.git' }}"
          echo "Cloning ${REPO}"
          git clone --depth 1 "$REPO" target_repo
          echo "TARGET_ROOT=$PWD/target_repo" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev default-libmysqlclient-dev \
            libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev curl

      - name: Install Python dependencies (target repo + tooling)
        run: |
          set -e
          python -m pip install --upgrade pip wheel setuptools

          # --- Test tooling FIRST (so pytest exists before checks) ---
          pip install pytest pytest-cov pytest-html pytest-json-report \
                     coverage bandit safety flake8 black isort mypy \
                     pytest-xdist pytest-timeout pytest-mock \
                     vulture radon prospector semgrep pylint \
                     WebTest

          # --- Prefer binary psycopg; avoid building old psycopg2 from source ---
          pip install "psycopg2-binary>=2.9,<3" --only-binary=:all: || true

          # Helper to rewrite pinned psycopg2 -> psycopg2-binary on the fly
          fix_reqs() {
            local IN="$1"
            sed -E 's/^[[:space:]]*psycopg2([[:space:]]*==[[:space:]]*[0-9.]+)?([[:space:]]*#.*)?$/psycopg2-binary>=2.9,<3/' "$IN" > /tmp/req.fixed
            pip install -r /tmp/req.fixed || true
          }

          # --- target repo regular deps ---
          if [ -f "target_repo/requirements.txt" ]; then fix_reqs target_repo/requirements.txt; fi
          if ls target_repo/requirements/*.txt >/dev/null 2>&1; then
            for f in target_repo/requirements/*.txt; do fix_reqs "$f"; done
          fi

          # Poetry (regular + dev)
          if [ -f "target_repo/pyproject.toml" ] && grep -q "\[tool.poetry\]" target_repo/pyproject.toml; then
            pip install poetry || true
            (cd target_repo && poetry export -f requirements.txt --without-hashes -o /tmp/poetry.req) || true
            [ -s /tmp/poetry.req ] && fix_reqs /tmp/poetry.req
            (cd target_repo && poetry export -f requirements.txt --with dev --without-hashes -o /tmp/poetry.dev.req) || true
            [ -s /tmp/poetry.dev.req ] && fix_reqs /tmp/poetry.dev.req
          fi

          # PDM (dev included)
          if [ -f "target_repo/pyproject.toml" ] && grep -q "\[tool.pdm\]" target_repo/pyproject.toml; then
            pip install pdm || true
            (cd target_repo && pdm export -o /tmp/pdm.req --without-hashes --dev) || true
            [ -s /tmp/pdm.req ] && fix_reqs /tmp/pdm.req
          fi

          # Pipenv
          if [ -f "target_repo/Pipfile" ] || [ -f "target_repo/Pipfile.lock" ]; then
            pip install pipenv || true
            (cd target_repo && pipenv requirements > /tmp/pipenv.req) || true
            [ -s /tmp/pipenv.req ] && fix_reqs /tmp/pipenv.req
          fi

          # Editable install only if the project is actually packageable
          if [ -f "target_repo/setup.py" ] || [ -f "target_repo/setup.cfg" ] || [ -f "target_repo/pyproject.toml" ]; then
            pip install -e "target_repo[dev,test]" || pip install -e target_repo || true
          fi

          # Common dev/test requirement files
          for f in requirements-dev.txt dev-requirements.txt test-requirements.txt requirements/tests.txt requirements/test.txt; do
            [ -f "target_repo/$f" ] && fix_reqs "target_repo/$f"
          done

          # ✅ Sanity check (non-fatal) — after installs
          python - <<'PY'
          import importlib, sys
          for m in ("pytest","webtest"):
              try:
                  importlib.import_module(m)
                  print(f"OK import: {m}")
              except Exception as e:
                  print(f"WARNING: {m} import failed: {e}", file=sys.stderr)
          PY

      - name: Locate tests and coverage sources
        id: discover
        run: |
          set -e
          cd "$TARGET_ROOT"

          TEST_DIRS=()
          [ -d "tests" ] && TEST_DIRS+=("tests")
          [ -d "test" ] && TEST_DIRS+=("test")
          [ -d "tests/generated" ] && TEST_DIRS+=("tests/generated")
          [ -d "src/tests" ] && TEST_DIRS+=("src/tests")

          echo "Searching for test files in the following directories:"
          for dir in "${TEST_DIRS[@]}"; do echo "  - $dir"; done

          if [ ${#TEST_DIRS[@]} -eq 0 ]; then
            echo "No standard test directories found, searching recursively..."
            TEST_FILES=$(find . -name "test_*.py" -type f | head -20)
            if [ -n "$TEST_FILES" ]; then
              echo "Found test files:"
              echo "$TEST_FILES"
              mapfile -t TEST_DIRS < <(find . -name "test_*.py" -type f -exec dirname {} \; | sort -u)
            fi
          fi

          if [ ${#TEST_DIRS[@]} -eq 0 ]; then
            echo "No test files found anywhere in the repository"
            find . -type f -name "*.py" | head -10
            exit 1
          fi

          TOTAL_TESTS=0
          for dir in "${TEST_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -type f -name "test_*.py" | wc -l | tr -d ' ')
              TOTAL_TESTS=$((TOTAL_TESTS + COUNT))
              echo "Found $COUNT test files in $dir"
            fi
          done

          UNIT_TESTS=0; INTEGRATION_TESTS=0; E2E_TESTS=0; GENERATED_TESTS=0
          for dir in "${TEST_DIRS[@]}"; do
            [ -d "$dir" ] || continue
            UNIT_TESTS=$((UNIT_TESTS + $(find "$dir" -name "test_unit_*.py" 2>/dev/null | wc -l | tr -d ' ')))
            INTEGRATION_TESTS=$((INTEGRATION_TESTS + $(find "$dir" -name "test_integ_*.py" 2>/dev/null | wc -l | tr -d ' ')))
            E2E_TESTS=$((E2E_TESTS + $(find "$dir" -name "test_e2e_*.py" 2>/dev/null | wc -l | tr -d ' ')))
            GENERATED_TESTS=$((GENERATED_TESTS + $(find "$dir" -path "*/generated/*" -name "test_*.py" 2>/dev/null | wc -l | tr -d ' ')))
          done

          echo "Test Discovery Results:"
          echo "  Total test files: $TOTAL_TESTS"
          echo "  Unit tests: $UNIT_TESTS"
          echo "  Integration tests: $INTEGRATION_TESTS"
          echo "  E2E tests: $E2E_TESTS"
          echo "  Generated tests: $GENERATED_TESTS"

          COV_ARGS=()
          [ -d "src" ] && COV_ARGS+=("--cov=src")
          for d in */ ; do
            [ -d "$d" ] || continue
            case "$d" in
              tests/|test/|venv/|.git/|__pycache__/) continue ;;
            esac
            [ -f "${d}__init__.py" ] && COV_ARGS+=("--cov=${d%/}")
          done
          if [ ${#COV_ARGS[@]} -eq 0 ]; then
            COV_ARGS+=("--cov=." "--cov-config=.coveragerc")
          fi

          TEST_DIR_ARGS=""
          for dir in "${TEST_DIRS[@]}"; do TEST_DIR_ARGS="$TEST_DIR_ARGS $dir"; done

          echo "Coverage arguments: ${COV_ARGS[*]}"
          echo "Test directories: $TEST_DIR_ARGS"
          echo "cov_args=${COV_ARGS[*]}" >> $GITHUB_OUTPUT
          echo "test_dirs=$TEST_DIR_ARGS" >> $GITHUB_OUTPUT
          echo "total_test_files=$TOTAL_TESTS" >> $GITHUB_OUTPUT

      - name: Create coverage configuration
        run: |
          cd "$TARGET_ROOT"
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit = 
              tests/*
              */tests/*
              */__pycache__/*
              */venv/*
              */env/*
              setup.py
              */site-packages/*
          
          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              raise AssertionError
              raise NotImplementedError
          EOF

      # --- Shim old libraries for Python 3.10+ (fixes collections.Container import in old Werkzeug) ---
      - name: Create runtime shims (sitecustomize.py)
        run: |
          cd "$TARGET_ROOT"
          cat > sitecustomize.py <<'PY'
          # Auto-imported by Python if present on sys.path.
          try:
              import collections as _collections, collections.abc as _abc
              for _n in ("Container","Iterable","Mapping","MutableMapping","Sequence","MutableSequence","Set","MutableSet","Callable"):
                  if not hasattr(_collections, _n) and hasattr(_abc, _n):
                      setattr(_collections, _n, getattr(_abc, _n))
          except Exception:
              pass
          PY
          echo "Created $TARGET_ROOT/sitecustomize.py to patch legacy collections ABCs"

      - name: Run tests with comprehensive coverage analysis
        id: test-results
        env:
          PYTHONPATH: ${{ env.TARGET_ROOT }}
        run: |
          echo "Running comprehensive test suite with coverage analysis..."
          mkdir -p reports/coverage reports/tests
          cd "$TARGET_ROOT"

          COV_ARGS="${{ steps.discover.outputs.cov_args }}"
          TEST_DIRS="${{ steps.discover.outputs.test_dirs }}"

          echo "Using test directories: $TEST_DIRS"
          echo "Using coverage args: $COV_ARGS"

          set +e
          python -m pytest $TEST_DIRS \
            ${COV_ARGS} \
            --cov-report=html:../reports/coverage/html \
            --cov-report=xml:../reports/coverage/coverage.xml \
            --cov-report=json:../reports/coverage/coverage.json \
            --cov-report=term-missing \
            --html=../reports/tests/test-report.html \
            --json-report --json-report-file=../reports/tests/test-results.json \
            --tb=short \
            --timeout=300 \
            --maxfail=50 \
            --verbose \
            --continue-on-collection-errors \
            --junitxml=../reports/tests/junit.xml
          set -e

          python - << 'EOF'
          import json, os
          from pathlib import Path

          results_file = Path('reports/tests/test-results.json')
          if not results_file.exists():
            data = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
            results_file.parent.mkdir(parents=True, exist_ok=True)
            results_file.write_text(json.dumps(data))
          else:
            data = json.loads(results_file.read_text())

          summary = data.get("summary", {})
          total = summary.get("total", 0)
          passed = summary.get("passed", 0)
          failed = summary.get("failed", 0)
          errors = summary.get("error", 0)
          skipped = summary.get("skipped", 0)
          pass_percentage = (passed / total * 100) if total > 0 else 0

          print(f"Test Execution Summary:")
          print(f"  Total: {total}")
          print(f"  Passed: {passed}")
          print(f"  Failed: {failed}")
          print(f"  Errors: {errors}")
          print(f"  Skipped: {skipped}")
          print(f"  Pass Rate: {pass_percentage:.2f}%")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"tests-total={total}\n")
            f.write(f"tests-passed={passed}\n")
            f.write(f"tests-failed={failed + errors}\n")
            f.write(f"pass-percentage={pass_percentage:.2f}\n")
          EOF

      - name: Generate detailed coverage metrics
        id: coverage
        run: |
          echo "Generating detailed coverage analysis..."
          python - << 'EOF'
          import os, json, sys
          from pathlib import Path

          coverage_file = Path('reports/coverage/coverage.json')
          if not coverage_file.exists():
            print("Coverage file not found")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("coverage-percentage=0\n")
            sys.exit(0)

          cov_data = json.loads(coverage_file.read_text())
          totals = cov_data.get("totals", {})
          coverage_pct = totals.get("percent_covered", 0)
          lines_covered = totals.get("covered_lines", 0)
          lines_missing = totals.get("missing_lines", 0)
          total_lines = lines_covered + lines_missing

          print(f"Coverage Analysis:")
          print(f"  Overall Coverage: {coverage_pct:.2f}%")
          print(f"  Lines Covered: {lines_covered}")
          print(f"  Lines Missing: {lines_missing}")
          print(f"  Total Lines: {total_lines}")

          files = cov_data.get("files", {})
          low_coverage_files = []
          for filepath, file_data in files.items():
            file_coverage = file_data.get("summary", {}).get("percent_covered", 0)
            if file_coverage < 70:
              low_coverage_files.append({"file": filepath, "coverage": file_coverage})

          coverage_analysis = {
            "overall_coverage": coverage_pct,
            "lines_covered": lines_covered,
            "lines_missing": lines_missing,
            "total_lines": total_lines,
            "low_coverage_files": low_coverage_files
          }

          Path('reports/coverage').mkdir(parents=True, exist_ok=True)
          Path('reports/coverage/coverage-analysis.json').write_text(json.dumps(coverage_analysis, indent=2))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"coverage-percentage={coverage_pct:.2f}\n")

          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "80"))
          if coverage_pct < threshold:
            print(f"Coverage {coverage_pct:.2f}% is below threshold {threshold}%")
          else:
            print(f"Coverage {coverage_pct:.2f}% meets threshold {threshold}%")
          EOF

      - name: Comprehensive bug detection analysis
        id: bug-analysis
        run: |
          echo "Running comprehensive bug detection..."
          cd "$TARGET_ROOT"

          REPORTS_DIR="../reports/bugs"
          mkdir -p "$REPORTS_DIR"

          BUG_LEVEL="${{ github.event.inputs.bug_detection_level || 'comprehensive' }}"
          echo "Bug detection level: $BUG_LEVEL"

          if [ -d "src" ]; then TARGET_DIR="src"; else TARGET_DIR="."; fi

          # Security
          bandit -r "$TARGET_DIR" -f json -o "$REPORTS_DIR/security-bandit.json" || true
          bandit -r "$TARGET_DIR" -ll > "$REPORTS_DIR/security-bandit.txt" || true

          # Safety: redirect output files (avoid --file which varies by version)
          safety check --output json > "$REPORTS_DIR/security-safety.json" || true
          safety check --output text > "$REPORTS_DIR/security-safety.txt" || true

          # Quality & complexity
          if [ "$BUG_LEVEL" != "basic" ]; then
            flake8 "$TARGET_DIR" --output-file="$REPORTS_DIR/quality-flake8.txt" --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s' || true
            mypy "$TARGET_DIR" --ignore-missing-imports --show-error-codes > "$REPORTS_DIR/quality-mypy.txt" || true
            vulture "$TARGET_DIR" --min-confidence 70 > "$REPORTS_DIR/quality-deadcode.txt" || true
            radon cc "$TARGET_DIR" -j > "$REPORTS_DIR/complexity-cyclomatic.json" || true
            radon mi "$TARGET_DIR" -j > "$REPORTS_DIR/complexity-maintainability.json" || true
          fi

          if [ "$BUG_LEVEL" = "comprehensive" ]; then
            prospector "$TARGET_DIR" -o json > "$REPORTS_DIR/comprehensive-prospector.json" || true
            pylint "$TARGET_DIR" --output-format=json > "$REPORTS_DIR/comprehensive-pylint.json" || true
            if command -v semgrep >/dev/null 2>&1; then
              semgrep --config=auto "$TARGET_DIR" --json --output="$REPORTS_DIR/comprehensive-semgrep.json" || true
            fi
          fi

          python - << 'EOF'
          import json, os
          from pathlib import Path

          reports_dir = Path('../reports/bugs')
          reports_dir.mkdir(parents=True, exist_ok=True)

          bug_summary = {
              "security_issues": 0,
              "quality_issues": 0,
              "complexity_issues": 0,
              "total_bugs": 0,
              "critical_bugs": 0,
              "quality_score": 100
          }

          # Bandit
          bandit_file = reports_dir / 'security-bandit.json'
          if bandit_file.exists():
              try:
                  bandit_data = json.loads(bandit_file.read_text())
                  results = bandit_data.get('results', [])
                  bug_summary["security_issues"] += len(results)
                  bug_summary["critical_bugs"] += sum(1 for r in results if r.get('issue_severity') == 'HIGH')
              except Exception:
                  pass

          # Safety (handle list or dict formats)
          safety_file = reports_dir / 'security-safety.json'
          if safety_file.exists():
              try:
                  data = json.loads(safety_file.read_text())
                  if isinstance(data, list):
                      bug_summary["security_issues"] += len(data)
                  elif isinstance(data, dict):
                      issues = data.get("vulnerabilities") or data.get("issues") or []
                      bug_summary["security_issues"] += len(issues)
              except Exception:
                  pass

          # flake8
          flake8_file = reports_dir / 'quality-flake8.txt'
          if flake8_file.exists():
              try:
                  lines = flake8_file.read_text().splitlines()
                  bug_summary["quality_issues"] += sum(1 for l in lines if ':' in l)
              except Exception:
                  pass

          # radon CC
          cyclo_file = reports_dir / 'complexity-cyclomatic.json'
          if cyclo_file.exists():
              try:
                  cyclo = json.loads(cyclo_file.read_text())
                  high = 0
                  for entry in cyclo:
                      if isinstance(entry, dict):
                          for funcs in entry.values():
                              if isinstance(funcs, list):
                                  high += sum(1 for f in funcs if isinstance(f, dict) and f.get('complexity', 0) > 10)
                  bug_summary["complexity_issues"] = high
              except Exception:
                  pass

          total = bug_summary["security_issues"] + bug_summary["quality_issues"] + bug_summary["complexity_issues"]
          bug_summary["total_bugs"] = total
          bug_summary["quality_score"] = max(0, 100 - min(80, total * 2) - bug_summary["critical_bugs"] * 10)

          print("Bug Analysis Summary:")
          for k, v in bug_summary.items():
              print(f"  {k.replace('_',' ').title()}: {v}")

          (reports_dir / 'bug-summary.json').write_text(json.dumps(bug_summary, indent=2))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"bugs-found={bug_summary['total_bugs']}\n")
              f.write(f"security-issues={bug_summary['security_issues']}\n")
              f.write(f"quality-score={bug_summary['quality_score']}\n")
          EOF

      - name: Upload comprehensive reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-analysis-reports
          path: reports/
          retention-days: 30

  deployment-readiness:
    runs-on: ubuntu-latest
    needs: [validate-tests]
    if: always()
    steps:
      - name: Evaluate deployment readiness
        id: deployment-check
        run: |
          echo "Evaluating deployment readiness..."

          TESTS_PASSED="${{ needs['validate-tests'].outputs['tests-passed'] }}"
          TESTS_TOTAL="${{ needs['validate-tests'].outputs['tests-total'] }}"
          PASS_PERCENTAGE='${{ needs['validate-tests'].outputs['pass-percentage'] }}'
          COVERAGE='${{ needs['validate-tests'].outputs['coverage-percentage'] }}'
          BUGS_FOUND="${{ needs['validate-tests'].outputs['bugs-found'] }}"
          SECURITY_ISSUES="${{ needs['validate-tests'].outputs['security-issues'] }}"
          QUALITY_SCORE="${{ needs['validate-tests'].outputs['quality-score'] }}"
          COVERAGE_THRESHOLD="${{ github.event.inputs.coverage_threshold || '80' }}"

          echo "Deployment Readiness Metrics:"
          echo "  Tests: $TESTS_PASSED/$TESTS_TOTAL passed ($PASS_PERCENTAGE%)"
          echo "  Coverage: $COVERAGE%"
          echo "  Bugs Found: $BUGS_FOUND"
          echo "  Security Issues: $SECURITY_ISSUES"
          echo "  Quality Score: $QUALITY_SCORE/100"
          echo "  Coverage Threshold: $COVERAGE_THRESHOLD%"

          READY="true"
          if [ -n "$SECURITY_ISSUES" ] && [ "$SECURITY_ISSUES" -gt "0" ]; then READY="false"; fi
          if [ -n "$PASS_PERCENTAGE" ] && [ "${PASS_PERCENTAGE%.*}" -lt "90" ]; then READY="false"; fi
          if [ -n "$COVERAGE" ] && [ "${COVERAGE%.*}" -lt "$COVERAGE_THRESHOLD" ]; then READY="false"; fi

          echo "ready=$READY" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        if: always()
        run: |
          TESTS_TOTAL='${{ needs['validate-tests'].outputs['tests-total'] }}'
          TESTS_PASSED='${{ needs['validate-tests'].outputs['tests-passed'] }}'
          PASS_PERCENTAGE='${{ needs['validate-tests'].outputs['pass-percentage'] }}'
          COVERAGE='${{ needs['validate-tests'].outputs['coverage-percentage'] }}'
          BUGS_FOUND='${{ needs['validate-tests'].outputs['bugs-found'] }}'
          SECURITY_ISSUES='${{ needs['validate-tests'].outputs['security-issues'] }}'
          QUALITY_SCORE='${{ needs['validate-tests'].outputs['quality-score'] }}'
          COVERAGE_THRESHOLD="${{ github.event.inputs.coverage_threshold || '80' }}"
          READY="${{ steps.deployment-check.outputs.ready }}"

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🚀 Deployment Readiness Report

          ## 📊 Test Execution Results
          | Metric | Value |
          |--------|-------|
          | Tests Executed | ${TESTS_TOTAL} |
          | Tests Passed | ${TESTS_PASSED} |
          | Pass Rate | ${PASS_PERCENTAGE}% |
          | Code Coverage | ${COVERAGE}% (threshold ${COVERAGE_THRESHOLD}%) |
          | Bugs Found | ${BUGS_FOUND} |
          | Security Issues | ${SECURITY_ISSUES} |
          | Quality Score | ${QUALITY_SCORE}/100 |

          ## 🎯 Decision
          **Deployment Ready:** ${READY:-false}
          EOF

      - name: Fail workflow on critical issues
        if: steps.deployment-check.outputs.ready != 'true'
        run: |
          echo "::error::Deployment readiness check failed"
          exit 1

  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs: validate-tests
    if: ${{ github.event.inputs.sonar_analysis != 'false' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      COVERAGE_XML: ${{ github.workspace }}/reports/coverage/coverage.xml
      JUNIT_XML: ${{ github.workspace }}/reports/tests/junit.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repository
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/test-calculator.git' }}"
          git clone --depth 1 "$REPO" target_repo

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-analysis-reports
          path: reports/
        continue-on-error: true

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          projectBaseDir: target_repo/
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=${{ env.COVERAGE_XML }}
            -Dsonar.python.xunit.reportPath=${{ env.JUNIT_XML }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Skip Sonar (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: 'echo "Sonar analysis skipped: SONAR_TOKEN not configured."'

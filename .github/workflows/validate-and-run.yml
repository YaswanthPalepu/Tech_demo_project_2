name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: [test2]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://github.com/DeviPrasad372002/django-test-app.git"
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Using repo: $REPO_URL"

      - name: Set compatibility constraints
        shell: bash
        run: |
          cat > /tmp/compat-constraints.txt <<'EOF'
          Django>=3.2,<4.3
          djangorestframework>=3.12,<3.15
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" \
            pytest pytest-cov pytest-timeout \
            pytest-django pytest-flask pytest-xdist \
            coverage httpx requests

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO_URL='${{ steps.target.outputs.repo_url }}'
          CLEAN_URL="$REPO_URL"
          [[ "$CLEAN_URL" == git@* ]] && CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          [[ "$CLEAN_URL" != https://* ]] && CLEAN_URL="https://github.com/$CLEAN_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          rm -rf target
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ Cloned into ./target"

      - name: Copy tests from this repo into target (if present)
        shell: bash
        run: |
          if [ -d tests/generated ]; then
            mkdir -p target/tests/generated
            rsync -a tests/generated/ target/tests/generated/
            echo "✅ Copied $(find target/tests/generated -type f -name '*test*.py' | wc -l) tests into target/"
          else
            echo "ℹ️ No tests/generated in this repo; relying on tests inside target repo."
          fi

      - name: Write pytest.ini (broad discovery; CLI will still pass dirs)
        working-directory: target
        shell: bash
        run: |
          cat > pytest.ini <<'INI'
          [pytest]
          python_files = test_*.py *_test.py *test*.py
          python_classes = Test* *Tests
          python_functions = test_* *_test test*
          addopts =
          INI
          cat pytest.ini

      - name: Write .coveragerc (omit venv/vendor)
        working-directory: target
        shell: bash
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          omit =
              */.venv/*
              */venv/*
              */env/*
              */site-packages/*
              */.tox/*
              */.pytest_cache/*
              */__pycache__/*
          EOF
          cat .coveragerc

      - name: Auto Django conftest (if Django project)
        working-directory: target
        shell: bash
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            python - <<'PY'
          import os, sys, pathlib
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))

          def setup_django():
              try:
                  import django
                  from django.conf import settings
                  if not settings.configured:
                      for s in ROOT.rglob('settings.py'):
                          if 'migration' not in str(s):
                              rel = s.relative_to(ROOT).with_suffix('')
                              os.environ['DJANGO_SETTINGS_MODULE'] = '.'.join(rel.parts)
                              break
                      django.setup()
              except Exception as e:
                  print(f"⚠️ Django setup warning: {e}")

          setup_django()
          PY
            echo "✅ Wrote Django conftest.py"
          fi

      - name: Find test roots (path-agnostic; exclude vendor/venv)
        id: discover
        working-directory: target
        shell: bash
        run: |
          set -e
          # Prefer dirs named tests/test anywhere (handles .../tests/generated)
          mapfile -t PREFERRED < <( \
            find . \
              \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
              -type d \( -iname "tests" -o -iname "test" \) -print | sort -u \
          )
          if [ ${#PREFERRED[@]} -eq 0 ]; then
            # Fallback: any dirs that contain *test*.py (still excluding vendor/venv)
            mapfile -t PREFERRED < <( \
              find . \
                \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
                -type f \( -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" \) \
                -printf '%h\n' | sort -u \
            )
          fi
          if [ ${#PREFERRED[@]} -eq 0 ]; then
            echo "❌ No repo test files found (outside vendor/venv)."
            find . -maxdepth 3 -type d | sed 's/^/ - /'
            exit 1
          fi
          printf '%s\n' "${PREFERRED[@]}" > /tmp/test_dirs.txt
          echo "✅ Found test roots:"; sed 's/^/ - /' /tmp/test_dirs.txt

      - name: Run tests with coverage (CI gate)
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          set -e
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if find . -name "settings.py" -type f | grep -q .; then
            PLUGINS="$PLUGINS -p pytest_django"
          fi
          mapfile -t TEST_DIRS < /tmp/test_dirs.txt
          echo "✅ Running pytest in:"; printf ' - %s\n' "${TEST_DIRS[@]}"
          set +e
          pytest -v --tb=short --maxfail=50 \
            $PLUGINS \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --timeout=300 \
            "${TEST_DIRS[@]}"
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parse coverage & set gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          p = pathlib.Path("reports/tests/coverage.json")
          cov = 0.0
          if p.exists():
              try:
                  cov = float(json.load(open(p)).get("totals", {}).get("percent_covered", 0.0))
              except Exception:
                  cov = 0.0
          thr = float(os.environ.get("COVERAGE_THRESHOLD", "70"))
          tests_ok = ('${{ steps.run.outcome }}' == 'success')
          ok = (cov >= thr) and tests_ok
          print(f"Coverage: {cov:.2f}% (threshold {thr}%), tests_ok={tests_ok} => {'OK' if ok else 'NOT OK'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"ready={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        shell: bash
        run: |
          {
            echo "## CI Result"
            if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
              echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold."
            else
              echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

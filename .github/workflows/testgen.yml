# .github/workflows/testgen.yml
name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Repo to analyze'
        required: true
        default: 'https://github.com/DeviPrasad372002/django-test-app.git'
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}


      OAI_MAX_TOKENS: "700"            # reduce output size
      OAI_MAX_RETRIES: "8"
      OAI_BASE_BACKOFF: "4"
      OAI_PAUSE_BETWEEN_CALLS: "5"     # small pause between unit/integ/e2e
      OAI_REQ_INTERVAL: "65"            # ensure at most 1 request per ~minute (helps hard TPM caps)
      ANALYSIS_MAX_FUNCTIONS: "30"      # shrink analysis payload
      ANALYSIS_MAX_CLASSES: "20"
      ANALYSIS_MAX_ROUTES: "20"
      TESTGEN_KINDS: "unit"             # start with unit only; later "unit,integ" or "unit,integ,e2e"
      TESTGEN_MAX_TESTS: "4"
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Clone target repository
        run: |
          git clone "${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}" target
          rsync -a target/ ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          # Ensure OpenAI SDK is present for AzureOpenAI()
          pip install "openai>=1.0.0"

      - name: Generate tests
        run: |
          python -m src.analyzer > /tmp/analysis.json
          python - <<'PY'
          import json, src.generator as g
          analysis = json.load(open('/tmp/analysis.json'))
          g.generate_all(analysis, outdir='tests/generated')
          PY

      - name: Quick validation run
        run: python -m src.validator

      - name: Commit generated tests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tests/generated || true
          git commit -m "chore: auto-generate tests [skip ci]" || echo "no changes"
          git push

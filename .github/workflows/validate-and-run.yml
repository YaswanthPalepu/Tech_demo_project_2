
name: Validate Python Project

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Git repo to validate (https://github.com/owner/repo)"
        required: true
        type: string
      ref:
        description: "Branch/tag/SHA"
        required: false
        type: string
        default: "main"
      subdir:
        description: "Optional project subdir"
        required: false
        type: string
        default: ""
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.10"
      pass_threshold:
        description: "Min pass % (0-100)"
        required: false
        type: string
        default: "80"
      coverage_threshold:
        description: "Min coverage % (0-100). Set 0 to ignore coverage gate."
        required: false
        type: string
        default: "0"
  push:
    branches:
      - test2

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    env:
      PASS_THRESHOLD: ${{ inputs.pass_threshold }}
      COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}

    steps:
      - name: Prep
        run: mkdir -p target_repo

      - name: Clone target repo
        env:
          TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -e
          REPO="${{ inputs.repo_url }}"
          REF="${{ inputs.ref }}"
          URL="$REPO"
          if [ -n "$TOKEN" ]; then
            URL="$(echo "$REPO" | sed -E 's#^https://#https://x-access-token:'"$TOKEN"'@#')"
          fi
          git clone --depth 1 --no-tags --branch "$REF" "$URL" target_repo

      - name: Select project directory
        id: proj
        run: |
          if [ -n "${{ inputs.subdir }}" ]; then DIR="target_repo/${{ inputs.subdir }}"; else DIR="target_repo"; fi
          test -d "$DIR" || { echo "missing dir: $DIR"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Minimal system libs (safe defaults)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential python3-dev

      - name: Install core test tooling
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          # Always have pytest + coverage available regardless of project
          pip install pytest pytest-cov pytest-timeout junitparser

      - name: Install project dependencies (manager-agnostic)
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -e
          # 1) requirements*.txt (dev first if present)
          found=0
          for f in requirements-dev.txt requirements_test.txt requirements-tests.txt requirements.txt; do
            if [ -f "$f" ]; then
              echo "pip install -r $f"
              pip install -r "$f" || true
              found=1
            fi
          done

          # 2) extras if defined
          pip install ".[test]" ".[tests]" ".[dev]" 2>/dev/null || true

          # 3) pyproject builds (PEP 517). Works for Poetry/PDM/Hatch projects without the managers.
          if [ -f pyproject.toml ]; then
            echo "pip install .  (pyproject)"
            pip install . || true
            found=1
          fi

          # 4) legacy setup.*
          if [ -f setup.cfg ] || [ -f setup.py ]; then
            echo "pip install -e .  (setuptools)"
            pip install -e . || true
            found=1
          fi

          # 5) fallback: try any extra requirement files in repo
          if [ $found -eq 0 ]; then
            mapfile -t RQS < <(ls -1 requirements*.txt 2>/dev/null || true)
            for f in "${RQS[@]}"; do
              echo "pip install -r $f"
              pip install -r "$f" || true
            done
          fi

          # Optional: common db/image libs that often fail compilation
          pip install psycopg2-binary mysqlclient pillow lxml 2>/dev/null || true

      - name: Write default pytest.ini (non-intrusive)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f pytest.ini ] && [ ! -f tox.ini ] && [ ! -f pyproject.toml ]; then
            cat > pytest.ini <<'INI'
            [pytest]
            python_files = test_*.py *_test.py *test*.py
            python_classes = Test* *Tests
            python_functions = test_* *_test test*
            addopts =
            INI
          fi

      - name: Write coverage config (omit venv/vendor)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f .coveragerc ]; then
            cat > .coveragerc <<'EOF'
            [run]
            omit =
                */.venv/*
                */venv/*
                */env/*
                */site-packages/*
                */.tox/*
                */.pytest_cache/*
                */__pycache__/*
            EOF
          fi

      - name: Discover test roots
        id: discover
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -e
          mapfile -t ROOTS < <( \
            find . \
              \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
              -type d \( -iname "tests" -o -iname "test" \) -print | sort -u \
          )
          if [ ${#ROOTS[@]} -eq 0 ]; then
            mapfile -t ROOTS < <( \
              find . \
                \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
                -type f \( -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" \) \
                -printf '%h\n' | sort -u \
            )
          fi
          if [ ${#ROOTS[@]} -eq 0 ]; then
            echo "No tests found."
            exit 1
          fi
          printf '%s\n' "${ROOTS[@]}" > /tmp/test_dirs.txt
          echo "Test roots:"; sed 's/^/ - /' /tmp/test_dirs.txt

      - name: Run tests with coverage (pytest)
        id: run
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: |
          set -e
          mkdir -p reports/tests
          mapfile -t TEST_DIRS < /tmp/test_dirs.txt
          set +e
          pytest -v --tb=short --maxfail=50 \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --junitxml=reports/tests/report.junit.xml \
            --timeout=300 \
            "${TEST_DIRS[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Compute pass% and coverage gates
        id: gate
        if: always()
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python - <<'PY'
          import os, json, xml.etree.ElementTree as ET, pathlib, sys
          thr_pass = float(os.environ.get("PASS_THRESHOLD","80"))
          thr_cov  = float(os.environ.get("COVERAGE_THRESHOLD","0"))

          xmlp = pathlib.Path("reports/tests/report.junit.xml")
          tot=sk=fl=er=0
          if xmlp.exists():
              root = ET.parse(xmlp).getroot()
              suites = [root] if root.tag=="testsuite" else root.findall("testsuite")
              for s in suites:
                  tot += int(s.attrib.get("tests",0))
                  sk  += int(s.attrib.get("skipped",0))
                  fl  += int(s.attrib.get("failures",0))
                  er  += int(s.attrib.get("errors",0))
          eff = max(tot - sk, 0)
          passed = max(eff - fl - er, 0)
          pct = (passed/eff*100.0) if eff>0 else 0.0

          cov = 0.0
          covj = pathlib.Path("reports/tests/coverage.json")
          if covj.exists():
              try:
                  cov = float(json.load(open(covj)).get("totals", {}).get("percent_covered", 0.0))
              except Exception:
                  cov = 0.0

          cov_ok  = (cov >= thr_cov)
          pass_ok = (pct >= thr_pass) and (fl==0 and er==0)
          ready = pass_ok and (thr_cov==0 or cov_ok)

          print(f"Total={tot} Skipped={sk} Failures={fl} Errors={er}")
          print(f"Pass%={pct:.2f} (thr {thr_pass}%)  Coverage={cov:.2f}% (thr {thr_cov}%)")
          print("READY TO DEPLOY" if ready else "NOT READY TO DEPLOY")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pass_pct={pct:.2f}\n")
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"status={'READY TO DEPLOY' if ready else 'NOT READY TO DEPLOY'}\n")

          sys.exit(0 if ready else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ steps.proj.outputs.dir }}/reports/tests/coverage.xml
            ${{ steps.proj.outputs.dir }}/reports/tests/coverage.json
            ${{ steps.proj.outputs.dir }}/reports/tests/report.junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## Validation"
            echo "**Status:** ${{ steps.gate.outputs.status }}"
            echo "**Pass %:** ${{ steps.gate.outputs.pass_pct }}% (thr ${{ inputs.pass_threshold }}%)"
            echo "**Coverage:** ${{ steps.gate.outputs.coverage }}% (thr ${{ inputs.coverage_threshold }}%)"
          } >> "$GITHUB_STEP_SUMMARY"

name: Validate Tests and SonarQube

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo to validate"
        required: true
        default: "DeviPrasad372002/django-test-app"
      ref:
        description: "Branch or SHA"
        default: "main"
      python_version:
        description: "Python version"
        default: "3.12"

permissions:
  contents: read

env:
  SONAR_HOST_URL: "http://localhost:9000"         # local SonarQube on your self-hosted runner
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}         # create in local SonarQube > My Account > Security

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          path: target

      - name: Show tree
        run: |
          ls -la target | sed -n '1,120p'
          echo "generated tests count:"
          find target/tests/generated -maxdepth 1 -type f -name 'test_*.py' 2>/dev/null | wc -l

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}

      - name: Create venv and install project deps
        working-directory: target
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          # test deps
          pip install pytest pytest-cov

      - name: Run generated tests with coverage
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/target
        run: |
          . .venv/bin/activate
          if [ ! -d tests/generated ]; then
            echo "No generated tests found at tests/generated"; exit 1
          fi
          pytest -q tests/generated \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: target/coverage.xml
          if-no-files-found: error

      - name: SonarQube Scan (local server)
        uses: SonarSource/sonarqube-scan-action@v2.3
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.inputs.target_repo }}
            -Dsonar.projectName=${{ github.event.inputs.target_repo }}
            -Dsonar.sources=target
            -Dsonar.exclusions=**/tests/**,**/tests_generated/**,**/tests/generated/**
            -Dsonar.python.coverage.reportPaths=target/coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: Sonar summary link
        run: echo "SONAR_HOST_URL"

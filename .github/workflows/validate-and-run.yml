# .github/workflows/validate-and-run.yml
name: Test Validation & Quality Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
  push:
    branches: [ test ]

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write
    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repository to ./target_repo
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          echo "Cloning ${REPO}"
          git clone --depth 1 "$REPO" target_repo
          echo "TARGET_ROOT=$PWD/target_repo" >> $GITHUB_ENV
          # Ensure the repo root (with sitecustomize.py) is on sys.path globally
          echo "PYTHONPATH=$PWD/target_repo:$PYTHONPATH" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bootstrap Python constraints (optional, safe if file missing)
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          python ci/py_stack_guard.py | tee /tmp/stack_env || true
          grep -E '^(PIP_CONSTRAINT|TESTGEN_PIP_CONSTRAINTS)=' /tmp/stack_env >> $GITHUB_ENV || true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev default-libmysqlclient-dev \
            libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev curl

      - name: Install base Python testing tools
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install \
            pytest pytest-cov pytest-html pytest-json-report \
            coverage pytest-xdist pytest-timeout pytest-mock \
            typing-extensions || true

      - name: Install target requirements (if present; repo-agnostic)
        run: |
          install_requirements_file() {
            local req_file="$1"
            if [ -f "$req_file" ]; then
              echo "Installing from $req_file ..."
              # avoid building psycopg2 from source on CI
              sed -i 's/^psycopg2\(\([^a-zA-Z0-9]\|$\)\)/psycopg2-binary\1/' "$req_file" || true
              pip install -r "$req_file" || echo "Some packages from $req_file failed to install"
            fi
          }
          install_requirements_file "target_repo/requirements.txt"
          if [ -d "target_repo/requirements" ]; then
            for f in target_repo/requirements/*.txt; do
              [ -f "$f" ] && install_requirements_file "$f"
            done
          fi
          if [ -f "target_repo/pyproject.toml" ] && grep -q "\[tool.poetry\]" target_repo/pyproject.toml; then
            pip install poetry || true
            (cd target_repo && poetry export -f requirements.txt --without-hashes -o /tmp/poetry.req) || true
            [ -s /tmp/poetry.req ] && pip install -r /tmp/poetry.req || true
          fi

      # ---- Generic shims + OPTIONAL Django auto-bootstrap (repo-agnostic) ----
      - name: Write sitecustomize.py (generic shims + optional Django setup)
        run: |
          cd "$TARGET_ROOT"
          cat > sitecustomize.py << 'EOF'
          # Auto-loaded when this directory is on sys.path.

          # -- collections.* ABCs compatibility for Python 3.10+ (fixes old libs importing from `collections`) --
          try:
              import collections, collections.abc as _abc
              _aliases = (
                  'Mapping','MutableMapping','Sequence','MutableSequence','Set','MutableSet',
                  'Iterable','Iterator','Generator','Container','Callable','Hashable'
              )
              for _name in _aliases:
                  if not hasattr(collections, _name) and hasattr(_abc, _name):
                      setattr(collections, _name, getattr(_abc, _name))
          except Exception:
              pass

          # -- pytest-django ↔ old Django compat: swallow unknown 'debug' kwarg if present --
          # (No-op if Django isn't installed or already supports 'debug'.)
          try:
              import importlib, inspect
              dtu = importlib.import_module('django.test.utils')
              try:
                  sig = inspect.signature(dtu.setup_test_environment)
              except (ValueError, TypeError):
                  sig = None
              if not sig or 'debug' not in sig.parameters:
                  _orig = dtu.setup_test_environment
                  def _shim_setup_test_environment(*args, **kwargs):
                      kwargs.pop('debug', None)
                      return _orig(*args, **kwargs)
                  dtu.setup_test_environment = _shim_setup_test_environment
          except Exception:
              pass

          # -- OPTIONAL: if Django is installed but SETTINGS aren't configured,
          #    auto-discover <pkg>.settings or create a minimal in-memory config.
          #    This keeps the workflow repo-agnostic (no hard-coded framework),
          #    yet lets Django-based repos actually run tests.
          try:
              import os
              from pathlib import Path
              import importlib
              root = Path(__file__).resolve().parent

              # If Django isn't importable, this block is a no-op.
              import django
              from django.conf import settings

              if not settings.configured:
                  # 1) Try to detect a real settings module like "<pkg>.settings"
                  settings_mod = ""
                  for p in root.iterdir():
                      if p.is_dir() and (p / "__init__.py").exists():
                          if (p / "settings.py").exists() or (p / "settings" / "__init__.py").exists():
                              settings_mod = f"{p.name}.settings"
                              break
                  if settings_mod:
                      os.environ.setdefault("DJANGO_SETTINGS_MODULE", settings_mod)
                  else:
                      # 2) Fallback: write a tiny settings module compatible with old Django (1.10+)
                      #    Include both MIDDLEWARE and MIDDLEWARE_CLASSES to satisfy older/newer code.
                      apps = []
                      # Heuristic: include top-level packages that look like Django apps (have models.py or migrations/)
                      for p in root.iterdir():
                          if p.is_dir() and (p / "__init__.py").exists():
                              if (p / "models.py").exists() or (p / "migrations").exists() or (p / "apps").exists():
                                  apps.append(p.name)
                      minimal = f'''
          SECRET_KEY = "test-secret"
          DEBUG = True
          ALLOWED_HOSTS = ["*"]
          INSTALLED_APPS = [
              "django.contrib.auth",
              "django.contrib.contenttypes",
              "django.contrib.sessions",
              "django.contrib.messages",
              "django.contrib.admin",
              {",".join(repr(a) for a in apps)}
          ]
          DATABASES = {{
              "default": {{"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}}
          }}
          # Support old/new middleware styles
          MIDDLEWARE = []
          MIDDLEWARE_CLASSES = []
          TEMPLATES = [{{
              "BACKEND": "django.template.backends.django.DjangoTemplates",
              "DIRS": [],
              "APP_DIRS": True,
              "OPTIONS": {{"context_processors": []}}
          }}]
          USE_TZ = True
          TIME_ZONE = "UTC"
          DEFAULT_AUTO_FIELD = "django.db.models.AutoField"
                      '''
                      (root / "test_settings.py").write_text(minimal, encoding="utf-8")
                      os.environ.setdefault("DJANGO_SETTINGS_MODULE", "test_settings")

                  # Finally initialize Django; ignore if it still can't set up.
                  try:
                      django.setup()
                  except Exception as _e:
                      # Leave a breadcrumb for debugging without crashing collection.
                      print("NOTE: django.setup() failed in sitecustomize:", _e)
          except Exception:
              # No Django or some other import-time issue — ignore.
              pass
          EOF

      - name: Create coverage configuration
        run: |
          cd "$TARGET_ROOT"
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit =
              tests/*
              */tests/*
              */__pycache__/*
              */venv/*
              */env/*
              setup.py
              */site-packages/*
              sitecustomize.py
          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              raise AssertionError
              raise NotImplementedError
              if __name__ == .__main__.:
          EOF

      - name: Discover tests (repo-agnostic)
        id: discover
        run: |
          set -e
          cd "$TARGET_ROOT"

          TEST_DIRS=()
          [ -d "tests" ] && TEST_DIRS+=("tests")
          [ -d "test" ] && TEST_DIRS+=("test")
          [ -d "tests/generated" ] && TEST_DIRS+=("tests/generated")
          [ -d "src/tests" ] && TEST_DIRS+=("src/tests")
          [ ${#TEST_DIRS[@]} -eq 0 ] && TEST_DIRS=(".")

          echo "test_dirs=${TEST_DIRS[*]}" >> $GITHUB_OUTPUT

          COV_ARGS=()
          # Try common code roots; fallback to project root
          for p in src app core backend package conduit; do
            [ -d "$p" ] && COV_ARGS+=("--cov=$p")
          done
          [ ${#COV_ARGS[@]} -eq 0 ] && COV_ARGS+=(--cov=.)
          [ -f ".coveragerc" ] && COV_ARGS+=("--cov-config=.coveragerc")
          echo "cov_args=${COV_ARGS[*]}" >> $GITHUB_OUTPUT

          # If literally no tests found, create a smoke test
          FOUND=$(find "${TEST_DIRS[@]}" -type f -name "test_*.py" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$FOUND" = "0" ]; then
            mkdir -p tests
            cat > tests/test_smoke.py <<'PY'
          def test_smoke():
              assert True
          PY
            echo "Created smoke test to validate runner/tooling."
          fi

      - name: Run tests (repo-agnostic, show skip reasons)
        id: run_tests
        env:
          PYTHONPATH: ${{ env.TARGET_ROOT }}
        run: |
          set -e
          cd "$TARGET_ROOT"
          mkdir -p ../reports/coverage ../reports/tests

          TEST_DIRS="${{ steps.discover.outputs.test_dirs }}"
          COV_ARGS="${{ steps.discover.outputs.cov_args }}"

          set +e
          python -m pytest $TEST_DIRS \
            ${COV_ARGS} \
            --cov-report=html:../reports/coverage/html \
            --cov-report=xml:../reports/coverage/coverage.xml \
            --cov-report=json:../reports/coverage/coverage.json \
            --cov-report=term-missing \
            --html=../reports/tests/test-report.html \
            --json-report --json-report-file=../reports/tests/test-results.json \
            --tb=short --timeout=300 --maxfail=50 \
            -vv -rA --continue-on-collection-errors
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT

      - name: Parse results & coverage
        id: summarize
        run: |
          python - << 'PY'
          import json, os, pathlib, re
          rep = pathlib.Path('reports/tests/test-results.json')
          data = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}, "tests":[]}
          if rep.exists():
              try: data = json.loads(rep.read_text())
              except Exception: pass
          s = data.get("summary", {})
          total  = int(s.get("total", 0) or 0)
          passed = int(s.get("passed", 0) or 0)
          failed = int(s.get("failed", 0) or 0)
          errors = int(s.get("error", 0) or 0)
          pass_pct = (passed/total*100) if total else 0.0

          covp = 0.0
          cp = pathlib.Path('reports/coverage/coverage.json')
          if cp.exists():
              try:
                  cov = json.loads(cp.read_text())
                  covp = float(cov.get("totals", {}).get("percent_covered", 0.0))
              except Exception:
                  pass

          # summarize skip reasons (purely informational)
          reasons = {}
          for t in data.get("tests", []):
              if t.get("outcome") == "skipped":
                  msg = t.get("longrepr", "") or t.get("setup", "")
                  m = re.search(r"Skipped:\s*(.+)", str(msg))
                  reason = (m.group(1).strip() if m else str(msg).splitlines()[:1][0] if msg else "unknown")[:160]
                  reasons[reason] = reasons.get(reason, 0) + 1
          if reasons:
              print("Skip reasons:")
              for k,v in sorted(reasons.items(), key=lambda x: -x[1]): print(f"  {v} × {k}")

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"tests-total={total}\n")
              f.write(f"tests-passed={passed}\n")
              f.write(f"tests-failed={failed+errors}\n")
              f.write(f"pass-percentage={pass_pct:.2f}\n")
              f.write(f"coverage-percentage={covp:.2f}\n")

          print(f"Summary: total={total}, passed={passed}, failed={failed}, errors={errors}, pass%={pass_pct:.2f}, coverage={covp:.2f}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-analysis-reports
          path: reports/
          retention-days: 30

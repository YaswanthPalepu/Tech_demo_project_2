name: Generate AI Tests for External Repo

on:
  push:
    branches:
      - local
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository to generate tests for (e.g., user/repo)"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      target_branch:
        description: "Branch to base the PR on"
        default: "local"
      python_version:
        description: "Python version"
        default: "3.12"

permissions:
  contents: write
  pull-requests: write

env:
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  GH_PAT: ${{ secrets.GH_PAT3 }} 

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - name: Checkout ai-testgen repo (this)
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.GH_PAT }}
          path: target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}

      - name: Install deps for generator
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # harden: ensure test deps present
          pip install pytest pytest-cov

      - name: Run analyzer + generator against target
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          PYTHONPATH: ${{ github.workspace }}/target
          TESTGEN_FORCE: "true"
        run: |
          python -m src.gen --target "$TARGET_ROOT" --outdir "$TARGET_ROOT/tests/generated"

      - name: Show generated tests
        run: |
          ls -al target/tests/generated || true

      - name: Commit changes to same branch
        working-directory: target
        env:
          GIT_AUTHOR_NAME: ai-testgen-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: ai-testgen-bot
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add tests/generated || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(tests): AI-generated tests [skip ci]"
          git push origin HEAD:${{ github.event.inputs.target_branch }}


     
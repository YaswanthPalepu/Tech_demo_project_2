name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Repo to analyze'
        required: true
        default: 'https://github.com/DeviPrasad372002/django-test-app.git'
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Azure OpenAI creds (names must match your repo secrets)
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

      # Generation knobs
      TESTGEN_KINDS: "unit,integ,e2e"
      TESTGEN_MAX_TESTS: "5"
      TESTGEN_FILES_PER_KIND: "5"     # <— generate more files per type
      OAI_MAX_TOKENS: "700"
      OAI_MAX_RETRIES: "8"
      OAI_BASE_BACKOFF: "4"
      OAI_PAUSE_BETWEEN_CALLS: "5"
      OAI_REQ_INTERVAL: "65"
      ANALYSIS_MAX_FUNCTIONS: "50"
      ANALYSIS_MAX_CLASSES: "30"
      ANALYSIS_MAX_ROUTES: "30"

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone target repository (without .git)
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          git clone --depth 1 "$REPO" target
          rsync -a --exclude ".git" target/ ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install "openai>=1.51.0" pytest pytest-cov httpx

      - name: Generate tests
        run: |
          python -m src.analyzer > /tmp/analysis.json
          python - <<'PY'
          import json, src.generator as g
          analysis = json.load(open('/tmp/analysis.json'))
          g.generate_all(analysis, outdir='tests/generated')
          PY

      - name: List generated tests
        run: ls -lah tests/generated || true

      - name: Quick validation run
        run: python -m src.validator

      - name: Package generated tests as zip
        run: |
          mkdir -p dist
          zip -r "dist/generated-tests-${{ github.run_id }}.zip" tests/generated /tmp/analysis.json || true

      - name: Upload generated tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-${{ github.run_id }}
          path: |
            tests/generated/**
            dist/generated-tests-${{ github.run_id }}.zip

      - name: Commit generated tests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tests/generated || true
          git commit -m "chore: auto-generate tests [skip ci]" || echo "no changes"
          git push

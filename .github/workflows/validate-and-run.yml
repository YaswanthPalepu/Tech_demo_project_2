# .github/workflows/validate-and-run.yml
name: Test Validation & Quality Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
  push:
    branches: [ test ]

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install \
            pytest pytest-cov pytest-html pytest-json-report \
            coverage pytest-xdist pytest-timeout pytest-mock \
            typing-extensions || true

      - name: Install repo requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' requirements.txt || true
            pip install -r requirements.txt || true
          fi
          if [ -d requirements ]; then
            for f in requirements/*.txt; do
              sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' "$f" || true
              pip install -r "$f" || true
            done
          fi

      - name: Write sitecustomize.py (fix collection errors generically)
        run: |
          cat > sitecustomize.py << 'EOF'
          """
          Auto-loaded before tests. Provides compatibility shims to prevent collection errors.
          """

          # Fix collections.* re-exports
          try:
              import collections, collections.abc as _abc
              for _name in ('Mapping','MutableMapping','Sequence','MutableSequence','Set',
                            'MutableSet','Iterable','Iterator','Generator','Container',
                            'Callable','Hashable'):
                  if not hasattr(collections, _name) and hasattr(_abc, _name):
                      setattr(collections, _name, getattr(_abc, _name))
          except Exception:
              pass

          # Flask / Jinja2 shims
          try:
              import flask
              if not hasattr(flask, "escape"):
                  from markupsafe import escape
                  flask.escape = escape
          except Exception:
              pass
          try:
              import jinja2
              if not hasattr(jinja2, "Markup"):
                  from markupsafe import Markup, escape
                  jinja2.Markup = Markup
                  jinja2.escape = escape
          except Exception:
              pass

          # Marshmallow shim
          try:
              import marshmallow as _mm
              if not hasattr(_mm, "__version__"):
                  _mm.__version__ = "4"
          except Exception:
              pass

          # Django auto-bootstrap
          try:
              import os, django
              from django.conf import settings
              if not settings.configured:
                  os.environ.setdefault("DJANGO_SETTINGS_MODULE", "test_settings")
                  if not os.path.exists("test_settings.py"):
                      with open("test_settings.py","w") as f:
                          f.write("SECRET_KEY='x'\nDEBUG=True\nINSTALLED_APPS=[]\n"
                                  "DATABASES={'default':{'ENGINE':'django.db.backends.sqlite3','NAME':':memory:'}}\n")
                  django.setup()
          except Exception:
              pass

          # pytest-django shim for debug kwarg
          try:
              import importlib, inspect
              dtu = importlib.import_module("django.test.utils")
              sig = inspect.signature(dtu.setup_test_environment)
              if "debug" not in sig.parameters:
                  _orig = dtu.setup_test_environment
                  def _shim(*a, **kw):
                      kw.pop("debug", None)
                      return _orig(*a, **kw)
                  dtu.setup_test_environment = _shim
          except Exception:
              pass
          EOF

      - name: Create coverage config
        run: |
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit =
              tests/*
              */tests/*
              */__pycache__/*
              */venv/*
              */env/*
              setup.py
              */site-packages/*
              sitecustomize.py
          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              raise AssertionError
              raise NotImplementedError
              if __name__ == .__main__.:
          EOF

      - name: Run pytest
        run: |
          mkdir -p reports/coverage reports/tests
          set +e
          pytest tests tests/generated \
            --cov=. --cov-config=.coveragerc \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=json:reports/coverage/coverage.json \
            --cov-report=term-missing \
            --html=reports/tests/test-report.html \
            --json-report --json-report-file=reports/tests/test-results.json \
            --tb=short --timeout=300 --maxfail=50 \
            -vv -rA
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT

      - name: Summarize results
        run: |
          python - <<'PY'
          import json, pathlib
          rep = pathlib.Path("reports/tests/test-results.json")
          cov = pathlib.Path("reports/coverage/coverage.json")

          results = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
          if rep.exists():
              try: results = json.loads(rep.read_text())
              except: pass
          s = results.get("summary", {})
          total  = s.get("total", 0)
          passed = s.get("passed", 0)
          failed = s.get("failed", 0) + s.get("error", 0)
          skipped = s.get("skipped", 0)
          pct = (passed/total*100) if total else 0.0

          covp = 0.0
          if cov.exists():
              try:
                  covp = json.loads(cov.read_text()).get("totals", {}).get("percent_covered", 0.0)
              except: pass

          print(f"Summary: total={total}, passed={passed}, failed={failed}, skipped={skipped}, pass%={pct:.2f}, coverage={covp:.2f}%")

          # enforce coverage threshold
          import sys, os
          threshold = float(os.environ.get("COVERAGE_THRESHOLD","80"))
          if covp < threshold:
              print(f"❌ Coverage {covp:.2f}% is below threshold {threshold}%")
              sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-analysis-reports
          path: reports/
          retention-days: 30

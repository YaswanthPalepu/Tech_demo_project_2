name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: [test2]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate (fallback: current repo)"
        required: false
        default: ""

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          set -e
          REPO_URL="${{ github.event.inputs.repo_url }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved repo_url: $REPO_URL"

      - name: Set compatibility constraints
        shell: bash
        run: |
          printf "Django>=3.2,<4.3\ndjangorestframework>=3.12,<3.15\n" > /tmp/compat-constraints.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install runner tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" pytest pytest-cov pytest-timeout pytest-xdist coverage

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          CLEAN_URL='${{ steps.target.outputs.repo_url }}'
          [[ "$CLEAN_URL" == git@* ]] && CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          [[ "$CLEAN_URL" != https://* ]] && CLEAN_URL="https://github.com/$CLEAN_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"; fi
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"

      - name: Install project dependencies (safe/agnostic)
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          if compgen -G "requirements*.txt" >/dev/null; then
            grep -vE '(^-e|^git\+|^hg\+|^svn\+|^bzr\+|^file:)' requirements*.txt \
              | sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' \
              > /tmp/req.clean.txt
            [ -s /tmp/req.clean.txt ] && pip install -r /tmp/req.clean.txt || true
          fi

      - name: Detect framework (Django?) and settings module
        id: detect
        working-directory: target
        shell: bash
        run: |
          python - <<PYCODE
          import os, pathlib
          exclude={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}
          cands=[]
          for root, dirs, files in os.walk('.', topdown=True):
              dirs[:]=[d for d in dirs if d not in exclude and 'site-packages' not in d]
              if 'settings.py' in files and 'migrations' not in root:
                  p=pathlib.Path(root,'settings.py').resolve()
                  rel=pathlib.Path(os.path.relpath(p,'.')).with_suffix('')
                  cands.append((len(rel.parts),'.'.join(rel.parts)))
          is_django=bool(cands)
          ds_module=sorted(cands,key=lambda x:x[0])[0][1] if cands else ""
          print(f"is_django={is_django}, ds={ds_module or '-'}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"is_django={'true' if is_django else 'false'}\n")
              f.write(f"ds_module={ds_module}\n")
          PYCODE

      - name: Add pytest-django only if Django project
        if: steps.detect.outputs.is_django == 'true'
        working-directory: target
        shell: bash
        run: |
          pip install -c "$PIP_CONSTRAINT" pytest-django

      - name: Write pytest.ini (repo-agnostic)
        working-directory: target
        shell: bash
        run: |
          printf "[pytest]\naddopts = -v --tb=short\npython_files = test_*.py *_test.py *.test.py\npython_functions = test_*\npython_classes = Test*\nnorecursedirs = .git .tox .env .venv venv env __pycache__ .pytest_cache build dist node_modules */site-packages/*\n" > pytest.ini
          echo "✅ Wrote pytest.ini"

      - name: Write .coveragerc (omit venv/vendor)
        working-directory: target
        shell: bash
        run: |
          printf "[run]\nomit = */.venv/* */venv/* */env/* */site-packages/* */.tox/* */.pytest_cache/* */__pycache__/* */migrations/*\n" > .coveragerc
          echo "✅ Wrote .coveragerc"

      - name: Discover test files
        id: discover
        working-directory: target
        shell: bash
        run: |
          python - <<PYCODE
          import os, sys
          exclude={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}
          tests=[]
          for root, dirs, files in os.walk('.', topdown=True):
              dirs[:]=[d for d in dirs if d not in exclude and 'site-packages' not in d]
              for f in files:
                  if f.endswith('.py') and (f.startswith('test_') or f.endswith('_test.py') or f.endswith('.test.py')):
                      tests.append(os.path.join(root,f))
          if not tests:
              print("❌ No test files found"); sys.exit(1)
          with open('/tmp/test_files.txt','w') as fh: fh.write('\n'.join(tests))
          print(f"✅ Found {len(tests)} test files")
          PYCODE
          echo "test_files=/tmp/test_files.txt" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          DS_OPT=""
          if [ "${{ steps.detect.outputs.is_django }}" = "true" ]; then
            PLUGINS="$PLUGINS -p pytest_django"
            [ -n "${{ steps.detect.outputs.ds_module }}" ] && DS_OPT="--ds=${{ steps.detect.outputs.ds_module }}"
          fi
          mapfile -t FILES < "${{ steps.discover.outputs.test_files }}"
          pytest -v --tb=short $PLUGINS $DS_OPT \
            --cov=. --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --timeout=300 \
            "${FILES[@]}"

      - name: Parse coverage & gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<PYCODE
          import json, pathlib, os, sys
          cov=0.0
          p=pathlib.Path('reports/tests/coverage.json')
          if p.exists():
              try: cov=float(json.load(open(p)).get('totals',{}).get('percent_covered',0.0))
              except: pass
          thr=float(os.environ.get('COVERAGE_THRESHOLD','70'))
          tests_ok=('${{ steps.run.outcome }}'=='success')
          ok=(cov>=thr) and tests_ok
          print(f"Coverage={cov:.2f}%, Thr={thr}, TestsOk={tests_ok}, Gate={'OK' if ok else 'FAIL'}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"coverage={cov:.2f}\nready={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PYCODE

name: Validate Tests and SonarQube


on:
 workflow_dispatch:
   inputs:
     target_repo:
       description: "owner/repo of the codebase to validate"
       required: true
       default: "DeviPrasad372002/flask-test-repo"
     ref:
       description: "Branch or SHA to test"
       default: "main"
     python_version:
       description: "Python version"
       default: "3.12"


permissions:
 contents: read


env:
 SONAR_HOST_URL: "http://localhost:9000"
 SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


jobs:
 validate:
   runs-on: self-hosted
   steps:
     - name: Checkout target repo
       uses: actions/checkout@v4
       with:
         repository: ${{ github.event.inputs.target_repo }}
         ref: ${{ github.event.inputs.ref }}
         token: ${{ secrets.GH_PAT3 }}
         path: target


     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ github.event.inputs.python_version }}


     - name: Install project deps
       working-directory: target
       run: |
         python -m pip install -U pip
         if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
         pip install pytest pytest-cov httpx


     - name: Run generated tests with coverage
       working-directory: target
       run: |
         pytest tests/generated \
           --cov=. \
           --cov-report=term-missing:skip-covered \
           --cov-report=html || true


    


     - name: Upload coverage artifact
       uses: actions/upload-artifact@v4
       with:
         name: coverage-xml
         path: target/coverage.xml
         if-no-files-found: warn


     - name: SonarQube Scan
       if: env.SONAR_HOST_URL && env.SONAR_TOKEN
       uses: SonarSource/sonarqube-scan-action@v2.3
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
       with:
         args: >
           -Dsonar.projectKey=${{ github.event.inputs.target_repo }}
           -Dsonar.projectName=${{ github.event.inputs.target_repo }}
           -Dsonar.sources=target
           -Dsonar.exclusions=**/tests/**,**/tests_generated/**,**/tests/generated/**
           -Dsonar.python.coverage.reportPaths=target/coverage.xml
           -Dsonar.qualitygate.wait=true


     - name: Sonar summary link
       if: env.SONAR_HOST_URL
       run: |
         echo "See dashboard: $SONAR_HOST_URL"

name: Test Validation & Quality Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: Repository to validate
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      coverage_threshold:
        description: Minimum coverage threshold (%)
        required: false
        default: "80"
  push:
    branches: ["test"]

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    runs-on: self-hosted
    permissions: {contents: read, actions: read, checks: write}
    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Clone target repository to ./target_repo
        timeout-minutes: 5
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url || format('https://github.com/{0}.git', github.repository) }}
        run: |
          set -euo pipefail
          REPO_URL="$INPUT_REPO_URL"
          case "$REPO_URL" in
            git://github.com/*)        REPO_URL="${REPO_URL/git:\/\//https://}";;
            git@github.com:*)          REPO_URL="https://github.com/${REPO_URL#git@github.com:}";;
            ssh://git@github.com/*)    REPO_URL="https://github.com/${REPO_URL#ssh://git@github.com/}";;
          esac
          [[ "$REPO_URL" != https://* ]] && REPO_URL="https://github.com/${REPO_URL#*/}"
          [[ "$REPO_URL" != *.git ]] && REPO_URL="${REPO_URL%.git}.git"
          [ -n "$GH_PAT3" ] && REPO_URL="${REPO_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"

          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
              clone --depth=1 "$REPO_URL" target_repo || {
            echo "git clone failed, tarball fallback"
            ORG_REPO="$(echo "$REPO_URL" | sed -E 's#^https://(?:x-access-token:[^@]+@)?github.com/([^/]+/[^/.]+)(\.git)?$#\1#')"
            AUTH=(); [ -n "$GH_PAT3" ] && AUTH=(-H "Authorization: Bearer $GH_PAT3")
            mkdir -p target_repo
            curl -sS --fail --retry 5 --retry-all-errors --max-time 300 \
                 "${AUTH[@]}" -L -o /tmp/repo.tgz \
                 "https://api.github.com/repos/${ORG_REPO}/tarball"
            tar -xzf /tmp/repo.tgz --strip-components=1 -C target_repo
          }

      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip}

      - name: Install base test tooling
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install pytest pytest-cov coverage pytest-json-report pytest-html pytest-timeout pytest-django

      - name: Install system build tools (best-effort)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              build-essential python3-dev libpq-dev default-libmysqlclient-dev \
              libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
              libxml2-dev libxslt1-dev curl || true
          fi

      - name: Install project dependencies (respect repo pins)
        timeout-minutes: 15
        working-directory: target_repo
        env:
          PIP_DEFAULT_TIMEOUT: "120"
          PIP_NO_INPUT: "1"
          PIP_PROGRESS_BAR: "off"
        run: |
          set -e
          if [ -f requirements.txt ]; then
            sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' requirements.txt || true
            pip install -r requirements.txt || true
          fi
          if [ -d requirements ]; then
            for f in requirements/*.txt; do
              sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' "$f" || true
              pip install -r "$f" || true
            done
          fi
          if [ -f "pyproject.toml" ]; then
            if grep -q "\[tool.poetry\]" pyproject.toml; then
              pip install poetry || true
              poetry export -f requirements.txt --without-hashes -o /tmp/poetry.lock.req || true
              [ -s /tmp/poetry.lock.req ] && pip install -r /tmp/poetry.lock.req || true
            fi
            if grep -q "\[tool.pdm\]" pyproject.toml; then
              pip install pdm || true
              pdm export -o /tmp/pdm.lock.req --without-hashes --dev || true
              [ -s /tmp/pdm.lock.req ] && pip install -r /tmp/pdm.lock.req || true
            fi
          fi
          pip check || true

      - name: Auto-install missing Python imports
        timeout-minutes: 10
        env:
          PIP_DEFAULT_TIMEOUT: "120"
          PIP_NO_INPUT: "1"
          PIP_PROGRESS_BAR: "off"
        run: |
          python - <<'PY'
          import ast, pathlib, sys, subprocess, importlib.util
          ROOT = pathlib.Path("target_repo")
          paths = [p for p in ROOT.rglob("*.py")
                   if "/venv/" not in p.as_posix() and p.stat().st_size < 800_000]
          std = set(getattr(sys, "stdlib_module_names", set())) or {
            "os","sys","re","json","pathlib","math","itertools","functools","typing","subprocess","datetime",
            "time","collections","dataclasses","ast","logging","unittest","argparse","asyncio","sqlite3",
            "email","http","urllib","hashlib","hmac","base64","statistics","random","fractions","decimal",
            "csv","shutil","tempfile","glob","inspect","traceback","textwrap","string","pprint","enum","types"
          }
          deny = {"models","model","views","view","urls","settings","config","configs","tests","test",
                  "schemas","schema","forms","admin","migrations","apps","serializers","permissions","filters",
                  "routers","services","repository","repositories","managers","helpers","utils",
                  "renderers","relations"}  # known bad PyPI names
          alias = {
            "bs4":"beautifulsoup4","cv2":"opencv-python","yaml":"PyYAML","sklearn":"scikit-learn","PIL":"Pillow",
            "Crypto":"pycryptodome","MySQLdb":"mysqlclient","psycopg2":"psycopg2-binary","jwt":"PyJWT",
            "rest_framework":"djangorestframework","jinja2":"Jinja2","flask":"Flask","werkzeug":"Werkzeug",
            "sqlalchemy":"SQLAlchemy","fastapi":"fastapi","starlette":"starlette","pydantic":"pydantic",
            "uvicorn":"uvicorn","marshmallow":"marshmallow","pymongo":"pymongo","redis":"redis","httpx":"httpx",
            "requests":"requests","numpy":"numpy","pandas":"pandas","scipy":"scipy","matplotlib":"matplotlib",
            "seaborn":"seaborn","faker":"Faker","cryptography":"cryptography","boto3":"boto3",
            "googleapiclient":"google-api-python-client","google_cloud_storage":"google-cloud-storage",
            "tensorflow":"tensorflow","torch":"torch","torchvision":"torchvision",
            "snowflake":"snowflake-connector-python","django":"Django"
          }
          # do NOT auto-add DRF unless explicitly imported
          extras = {"fastapi":["starlette","pydantic"]}

          def is_local(t): return (ROOT / f"{t}.py").exists() or (ROOT / t).is_dir()
          def installed(t): return importlib.util.find_spec(t) is not None

          tops=set()
          for p in paths:
              try: tree=ast.parse(p.read_text(encoding="utf-8",errors="ignore"))
              except Exception: continue
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      for a in n.names: tops.add((a.name.split(".")[0] or "").strip())
                  elif isinstance(n, ast.ImportFrom):
                      tops.add(((n.module or "").split(".")[0] or "").strip())

          cands=[]
          for t in sorted(x for x in tops if x):
              if t in std or t in deny or t.startswith("_") or is_local(t) or installed(t): continue
              pkgs=[alias.get(t,t)]
              d=t.replace("_","-")
              if d!=t: pkgs.append(d)
              if t=="google": pkgs += ["google-api-python-client","google-auth","google-auth-oauthlib"]
              pkgs += extras.get(t,[])
              for p in pkgs:
                  if p not in cands: cands.append(p)

          if cands:
              try:
                  subprocess.check_call([sys.executable,"-m","pip","install","--disable-pip-version-check",*cands])
              except subprocess.CalledProcessError as e:
                  print("batch pip failed", e.returncode)
                  for pkg in cands:
                      try: subprocess.check_call([sys.executable,"-m","pip","install","--disable-pip-version-check",pkg])
                      except subprocess.CalledProcessError as e2:
                          print(f"pip failed for {pkg} ({e2.returncode})")

          unresolved=[t for t in sorted(tops)
                      if t and t not in std and t not in deny and not is_local(t) and not installed(t)]
          print("Unresolved after install:", unresolved)
          PY

      - name: Inject repo-level conftest that boots Django if present
        working-directory: target_repo
        run: |
          python - <<'PY'
          import os, sys, pathlib
          root = pathlib.Path(".")
          ctf = root / "conftest.py"
          snippet = '''
          import os, sys, pathlib
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          try:
              import django
          except Exception:
              django = None
          # Only configure if project has a settings.py with INSTALLED_APPS
          if django is not None and not os.environ.get("DJANGO_SETTINGS_MODULE"):
              for p in ROOT.rglob("settings.py"):
                  try:
                      txt = p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  if "INSTALLED_APPS" in txt:
                      os.environ["DJANGO_SETTINGS_MODULE"] = ".".join(p.relative_to(ROOT).with_suffix("").parts)
                      break
          if django is not None:
              try:
                  from django.apps import apps
                  if not apps.ready:
                      django.setup()
              except Exception:
                  pass
          '''
          if ctf.exists():
              txt = ctf.read_text(encoding="utf-8")
              if "django.setup" not in txt:
                  ctf.write_text(txt + "\n" + snippet, encoding="utf-8")
          else:
              ctf.write_text(snippet, encoding="utf-8")
          print("conftest.py ensured")
          PY

      - name: Discover tests and run
        working-directory: target_repo
        run: |
          set -euo pipefail
          unset PYTEST_ADDOPTS
          TEST_ARGS="$(python - <<'PY'
          import pathlib
          root=pathlib.Path(".").resolve()
          deny={'venv','.venv','site-packages','node_modules','dist','build','.git','__pycache__'}
          patterns=['test_*.py','*_test.py','tests']
          cands=set()
          # collect files
          for pat in patterns[:2]:
              for p in root.rglob(pat):
                  if set(p.parts)&deny: continue
                  cands.add(p.parent)
          # collect common test dirs
          td = root / "tests"
          if td.exists(): cands.add(td)
          # compress to unique top-level dirs
          dirs=set()
          for d in sorted(cands):
              try: rel=d.resolve().relative_to(root)
              except Exception: continue
              s=str(rel)
              if not any(s!=x and s.startswith(x+'/') for x in dirs):
                  dirs.add(s)
          print(" ".join(sorted(dirs)))
          PY
                    )"
          if [ -z "$TEST_ARGS" ]; then
            echo "No tests discovered. Failing."; exit 1
          fi
          echo "Pytest targets: $TEST_ARGS"
          mkdir -p reports/tests
          pytest -q -r a --maxfail=1 $TEST_ARGS \
            --json-report --json-report-file=reports/tests/test-results.json \
            --cov=. --cov-report=json:reports/tests/coverage.json || true

      - name: Summarize & enforce coverage threshold
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          rep = pathlib.Path("target_repo/reports/tests/test-results.json")
          cov = pathlib.Path("target_repo/reports/tests/coverage.json")
          results = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
          if rep.exists():
              try: results = json.loads(rep.read_text())
              except Exception: pass
          s = results.get("summary", {})
          total   = int(s.get("total", 0) or 0)
          passed  = int(s.get("passed", 0) or 0)
          failed  = int(s.get("failed", 0) or 0) + int(s.get("error", 0) or 0)
          skipped = int(s.get("skipped", 0) or 0)
          covp = 0.0
          if cov.exists():
              try: covp = float(json.loads(cov.read_text()).get("totals", {}).get("percent_covered", 0.0))
              except Exception: pass
          print(f"Summary: total={total}, passed={passed}, failed={failed}, skipped={skipped}, coverage={covp:.2f}%")
          if total == 0:
              print("❌ No tests collected. Failing."); sys.exit(1)
          if failed > 0:
              print(f"❌ {failed} test(s) failed. Failing."); sys.exit(1)
          threshold = float(os.environ.get("COVERAGE_THRESHOLD","80"))
          if covp < threshold:
              print(f"❌ Coverage {covp:.2f}% is below threshold {threshold}%"); sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-analysis-reports
          path: target_repo/reports/tests
          retention-days: 30

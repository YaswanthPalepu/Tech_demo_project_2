name: Azure OpenAI Generated Code Test Validation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Azure OpenAI Generated Repository URL'
        required: true
        type: string
      coverage_threshold:
        description: 'Minimum coverage threshold (%)'
        required: false
        default: '70'
        type: string
      test_framework:
        description: 'Expected test framework'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pytest
          - unittest
          - django
          - flask
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: azure-openai-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-azure-openai-tests:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      actions: read
      checks: write
      pull-requests: write

    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '70' }}
      TEST_FRAMEWORK: ${{ github.event.inputs.test_framework || 'auto' }}

    outputs:
      test-summary: ${{ steps.test-summary.outputs.summary }}
      test-status: ${{ steps.test-summary.outputs.status }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Clone Azure OpenAI Generated Repository
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.event.inputs.repo_url || github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          echo "🔍 Cloning Azure OpenAI generated repository..."
          
          # Clean and validate URL
          CLEAN_URL="$REPO_URL"
          if [[ "$CLEAN_URL" == git@* ]]; then
            CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          fi
          if [[ "$CLEAN_URL" != https://* ]]; then
            CLEAN_URL="https://github.com/$CLEAN_URL"
          fi
          if [[ "$CLEAN_URL" != *.git ]]; then
            CLEAN_URL="${CLEAN_URL}.git"
          fi
          
          echo "📂 Repository URL: $CLEAN_URL"
          
          # Clone with authentication if needed
          if [ -n "$GH_TOKEN" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_TOKEN}@}"
          fi
          
          git clone --depth=1 "$CLEAN_URL" azure_openai_repo || {
            echo "❌ Git clone failed, trying alternative method..."
            # Extract org/repo from URL for API fallback
            ORG_REPO=$(echo "$REPO_URL" | sed -E 's#^https://github.com/([^/]+/[^/.]+)(\.git)?/?$#\1#')
            echo "📦 Downloading as archive: $ORG_REPO"
            mkdir -p azure_openai_repo
            curl -H "Authorization: Bearer $GH_TOKEN" \
                 -L -o repo.tar.gz \
                 "https://api.github.com/repos/$ORG_REPO/tarball" || exit 1
            tar -xzf repo.tar.gz --strip-components=1 -C azure_openai_repo
          }
          
          echo "✅ Repository cloned successfully"
          ls -la azure_openai_repo/

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Testing Dependencies
        run: |
          echo "🔧 Installing testing dependencies..."
          python -m pip install --upgrade pip wheel setuptools
          
          # Core testing tools
          pip install \
            pytest \
            pytest-cov \
            pytest-html \
            pytest-json-report \
            pytest-timeout \
            pytest-mock \
            coverage \
            unittest-xml-reporting
          
          # Framework-specific tools
          pip install \
            pytest-django \
            pytest-flask \
            requests \
            httpx
          
          echo "✅ Testing dependencies installed"

      - name: Install Project Dependencies
        working-directory: azure_openai_repo
        timeout-minutes: 15
        run: |
          echo "📦 Installing project dependencies..."
          
          # Handle different dependency files
          if [ -f "requirements.txt" ]; then
            echo "📄 Found requirements.txt"
            # Replace psycopg2 with binary version to avoid compilation issues
            sed -i 's/^psycopg2==/psycopg2-binary==/' requirements.txt || true
            sed -i 's/^psycopg2$/psycopg2-binary/' requirements.txt || true
            pip install -r requirements.txt || echo "⚠️ Some requirements failed to install"
          fi
          
          # Check for requirements directory
          if [ -d "requirements" ]; then
            echo "📁 Found requirements directory"
            for req_file in requirements/*.txt; do
              if [ -f "$req_file" ]; then
                echo "Installing from $req_file"
                sed -i 's/^psycopg2==/psycopg2-binary==/' "$req_file" || true
                pip install -r "$req_file" || echo "⚠️ Some requirements in $req_file failed"
              fi
            done
          fi
          
          # Handle Poetry projects
          if [ -f "pyproject.toml" ] && grep -q "tool.poetry" pyproject.toml; then
            echo "🎭 Poetry project detected"
            pip install poetry || true
            poetry export -f requirements.txt --output poetry-requirements.txt --without-hashes || true
            if [ -f "poetry-requirements.txt" ]; then
              pip install -r poetry-requirements.txt || true
            fi
          fi
          
          # Handle setup.py
          if [ -f "setup.py" ]; then
            echo "⚙️ setup.py detected"
            pip install -e . || echo "⚠️ Failed to install package in development mode"
          fi
          
          echo "✅ Dependencies installation completed"

      - name: Auto-detect and Install Missing Dependencies
        working-directory: azure_openai_repo
        timeout-minutes: 10
        run: |
          echo "🔍 Auto-detecting missing dependencies..."
          
          python << 'EOF'
          import ast
          import pathlib
          import subprocess
          import sys
          import importlib.util
          
          # Standard library modules (Python 3.10)
          STDLIB_MODULES = {
              'os', 'sys', 're', 'json', 'pathlib', 'math', 'itertools', 'functools',
              'typing', 'subprocess', 'datetime', 'time', 'collections', 'dataclasses',
              'ast', 'logging', 'unittest', 'argparse', 'asyncio', 'sqlite3', 'urllib',
              'http', 'email', 'hashlib', 'hmac', 'base64', 'random', 'string', 'csv'
          }
          
          # Common package mappings
          PACKAGE_MAPPINGS = {
              'cv2': 'opencv-python',
              'PIL': 'Pillow', 
              'bs4': 'beautifulsoup4',
              'yaml': 'PyYAML',
              'jwt': 'PyJWT',
              'Crypto': 'pycryptodome',
              'psycopg2': 'psycopg2-binary',
              'MySQLdb': 'mysqlclient',
              'rest_framework': 'djangorestframework',
              'sklearn': 'scikit-learn',
              'flask': 'Flask',
              'django': 'Django',
              'fastapi': 'fastapi',
              'sqlalchemy': 'SQLAlchemy',
              'numpy': 'numpy',
              'pandas': 'pandas',
              'requests': 'requests',
              'httpx': 'httpx'
          }
          
          # Find all Python files
          python_files = list(pathlib.Path('.').rglob('*.py'))
          python_files = [f for f in python_files if 'venv' not in str(f) and '.git' not in str(f)]
          
          imports = set()
          
          # Extract imports from all Python files
          for py_file in python_files:
              try:
                  content = py_file.read_text(encoding='utf-8', errors='ignore')
                  tree = ast.parse(content)
                  
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          for alias in node.names:
                              imports.add(alias.name.split('.')[0])
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          imports.add(node.module.split('.')[0])
              except Exception as e:
                  print(f"⚠️ Could not parse {py_file}: {e}")
          
          # Filter out standard library and already installed packages
          missing_packages = []
          for imp in imports:
              if imp in STDLIB_MODULES:
                  continue
              
              # Check if already installed
              if importlib.util.find_spec(imp):
                  continue
                  
              # Check if it's a local module
              if pathlib.Path(f"{imp}.py").exists() or pathlib.Path(imp).is_dir():
                  continue
              
              # Map to actual package name
              package_name = PACKAGE_MAPPINGS.get(imp, imp)
              if package_name not in missing_packages:
                  missing_packages.append(package_name)
          
          print(f"🔍 Found {len(imports)} unique imports")
          print(f"📦 Missing packages to install: {missing_packages}")
          
          # Install missing packages
          if missing_packages:
              for package in missing_packages:
                  try:
                      subprocess.check_call([
                          sys.executable, '-m', 'pip', 'install', 
                          '--disable-pip-version-check', package
                      ])
                      print(f"✅ Installed {package}")
                  except subprocess.CalledProcessError:
                      print(f"❌ Failed to install {package}")
          else:
              print("✅ No additional packages needed")
          EOF

      - name: Setup Django Configuration (if applicable)
        working-directory: azure_openai_repo
        run: |
          echo "🔧 Setting up Django configuration if needed..."
          
          # Check if this is a Django project
          if find . -name "settings.py" -type f | head -1 | read settings_file; then
            echo "🎯 Django project detected: $settings_file"
            
            # Extract settings module path
            settings_dir=$(dirname "$settings_file")
            settings_module=$(echo "$settings_file" | sed 's|^\./||' | sed 's|/|.|g' | sed 's|\.py$||')
            
            echo "📝 Django settings module: $settings_module"
            export DJANGO_SETTINGS_MODULE="$settings_module"
            
            # Create or update conftest.py for Django
            cat > conftest.py << 'EOF'
          import os
          import sys
          import pathlib
          import django
          from django.conf import settings
          from django.test.utils import get_runner
          
          # Add project root to Python path
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          
          # Configure Django settings
          if not settings.configured:
              try:
                  django.setup()
                  print("✅ Django configured successfully")
              except Exception as e:
                  print(f"⚠️ Django setup warning: {e}")
          EOF
            
            echo "✅ Django configuration completed"
          else
            echo "ℹ️ No Django project detected"
          fi

      - name: Discover and Run Tests
        working-directory: azure_openai_repo
        run: |
          echo "🧪 Discovering and running tests..."
          
          # Create reports directory
          mkdir -p reports/tests
          
          # Discover test files and directories
          echo "🔍 Looking for test files..."
          
          # Find test patterns
          test_files=$(find . -name "test_*.py" -o -name "*_test.py" | head -20)
          test_dirs=$(find . -type d -name "tests" -o -name "test" | head -10)
          
          echo "📁 Found test files:"
          echo "$test_files" | while read file; do [ -n "$file" ] && echo "  - $file"; done
          
          echo "📁 Found test directories:"
          echo "$test_dirs" | while read dir; do [ -n "$dir" ] && echo "  - $dir"; done
          
          # Determine test targets
          test_targets=""
          if [ -n "$test_files" ]; then
            test_targets="$test_files"
          fi
          if [ -n "$test_dirs" ]; then
            test_targets="$test_targets $test_dirs"
          fi
          
          # If no specific test files found, try current directory
          if [ -z "$test_targets" ]; then
            echo "🔄 No specific test files found, scanning current directory..."
            test_targets="."
          fi
          
          echo "🎯 Test targets: $test_targets"
          
          # Run tests with coverage
          echo "🚀 Running tests..."
          
          pytest_cmd="pytest -v --tb=short --maxfail=10 \
            --json-report --json-report-file=reports/tests/test-results.json \
            --html=reports/tests/test-report.html --self-contained-html \
            --cov=. --cov-report=json:reports/tests/coverage.json \
            --cov-report=html:reports/tests/coverage-html \
            --cov-report=term-missing \
            $test_targets"
          
          echo "📋 Running command: $pytest_cmd"
          
          # Run tests and capture exit code
          set +e
          eval $pytest_cmd
          test_exit_code=$?
          set -e
          
          echo "📊 Test execution completed with exit code: $test_exit_code"
          
          # Always show what was generated
          echo "📄 Generated reports:"
          ls -la reports/tests/ || echo "No reports directory found"

      - name: Generate Test Summary
        id: test-summary
        if: always()
        working-directory: azure_openai_repo
        run: |
          echo "📈 Generating test summary..."
          
          python << 'EOF'
          import json
          import pathlib
          import os
          import sys
          
          # Default values
          summary_data = {
              "total": 0,
              "passed": 0, 
              "failed": 0,
              "errors": 0,
              "skipped": 0,
              "coverage": 0.0
          }
          
          status = "❌ FAILED"
          
          # Read test results
          results_file = pathlib.Path("reports/tests/test-results.json")
          if results_file.exists():
              try:
                  with open(results_file) as f:
                      results = json.load(f)
                  
                  summary = results.get("summary", {})
                  summary_data.update({
                      "total": int(summary.get("total", 0)),
                      "passed": int(summary.get("passed", 0)),
                      "failed": int(summary.get("failed", 0)),
                      "errors": int(summary.get("error", 0)),
                      "skipped": int(summary.get("skipped", 0))
                  })
                  
                  print(f"✅ Parsed test results: {summary_data}")
              except Exception as e:
                  print(f"⚠️ Failed to parse test results: {e}")
          else:
              print("⚠️ No test results file found")
          
          # Read coverage results  
          coverage_file = pathlib.Path("reports/tests/coverage.json")
          if coverage_file.exists():
              try:
                  with open(coverage_file) as f:
                      coverage_data = json.load(f)
                  
                  coverage_percent = coverage_data.get("totals", {}).get("percent_covered", 0.0)
                  summary_data["coverage"] = float(coverage_percent)
                  
                  print(f"✅ Parsed coverage: {coverage_percent}%")
              except Exception as e:
                  print(f"⚠️ Failed to parse coverage: {e}")
          
          # Determine overall status
          total_tests = summary_data["total"]
          failed_tests = summary_data["failed"] + summary_data["errors"]
          coverage = summary_data["coverage"]
          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "70"))
          
          if total_tests == 0:
              status = "⚠️ NO TESTS FOUND"
              print("❌ No tests were discovered or executed")
          elif failed_tests == 0:
              if coverage >= threshold:
                  status = "✅ ALL TESTS PASSED"
                  print("🎉 All tests passed and coverage meets threshold!")
              else:
                  status = "⚠️ TESTS PASSED, LOW COVERAGE"
                  print(f"⚠️ Tests passed but coverage {coverage:.1f}% < {threshold}%")
          else:
              status = "❌ TESTS FAILED"
              print(f"❌ {failed_tests} test(s) failed out of {total_tests}")
          
          # Create summary output
          summary_text = f"""
          ## 🧪 Azure OpenAI Code Test Results
          
          **Status:** {status}
          
          ### 📊 Test Statistics
          - **Total Tests:** {summary_data['total']}
          - **✅ Passed:** {summary_data['passed']}
          - **❌ Failed:** {summary_data['failed']}
          - **⚠️ Errors:** {summary_data['errors']}
          - **⏭️ Skipped:** {summary_data['skipped']}
          
          ### 📈 Coverage Report
          - **Coverage:** {summary_data['coverage']:.2f}%
          - **Threshold:** {threshold}%
          - **Status:** {"✅ MEETS THRESHOLD" if coverage >= threshold else "❌ BELOW THRESHOLD"}
          
          ### 🎯 Summary
          {status}
          """
          
          # Set GitHub Actions outputs
          print(f"::set-output name=summary::{summary_text}")
          print(f"::set-output name=status::{status}")
          print(f"::set-output name=total::{summary_data['total']}")
          print(f"::set-output name=passed::{summary_data['passed']}")
          print(f"::set-output name=failed::{summary_data['failed']}")
          print(f"::set-output name=errors::{summary_data['errors']}")
          print(f"::set-output name=skipped::{summary_data['skipped']}")
          print(f"::set-output name=coverage::{summary_data['coverage']:.2f}")
          
          # Print summary to console
          print("\n" + "="*60)
          print(summary_text)
          print("="*60)
          
          # Exit with failure if tests failed or no tests found
          if total_tests == 0 or failed_tests > 0:
              sys.exit(1)
              
          # Exit with warning code if coverage is below threshold
          if coverage < threshold:
              print(f"⚠️ Coverage warning: {coverage:.2f}% < {threshold}%")
              # Don't fail on coverage for now, just warn
          
          EOF

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-openai-test-reports
          path: azure_openai_repo/reports/tests/
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.test-summary.outputs.summary }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Final Status Check
        if: always()
        run: |
          echo "🏁 Pipeline completed"
          echo "📊 Final Status: ${{ steps.test-summary.outputs.status }}"
          echo "📈 Total Tests: ${{ steps.test-summary.outputs.total }}"
          echo "✅ Passed: ${{ steps.test-summary.outputs.passed }}"
          echo "❌ Failed: ${{ steps.test-summary.outputs.failed }}"
          echo "📊 Coverage: ${{ steps.test-summary.outputs.coverage }}%"
name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: [test2]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate (fallback: current repo)"
        required: false
        default: ""

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          set -e
          REPO_URL="${{ github.event.inputs.repo_url }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://github.com/DeviPrasad372002/django-test-app.git"
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved repo_url: $REPO_URL"

      - name: Set compatibility constraints
        shell: bash
        run: |
          printf "%s\n%s\n" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15" > /tmp/compat-constraints.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" \
            pytest pytest-cov pytest-timeout \
            pytest-django pytest-xdist \
            coverage httpx requests

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          REPO_URL='${{ steps.target.outputs.repo_url }}'
          echo "Cloning: $REPO_URL"
          CLEAN_URL="$REPO_URL"
          [[ "$CLEAN_URL" == git@* ]] && CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          [[ "$CLEAN_URL" != https://* ]] && CLEAN_URL="https://github.com/$CLEAN_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"
          echo "Top-level tree:"
          (cd target && find . -maxdepth 2 -type d -print | sed 's/^/ - /')

      - name: Safe, repo-agnostic dependency install
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          # Minimal helpful libs; ignore failures
          pip install -c "$PIP_CONSTRAINT" "typing-extensions>=4.8" "uvicorn>=0.23" "pydantic>=2" "starlette>=0.37" || true
          # Project deps
          if [ -f requirements.txt ]; then
            # Replace psycopg2 with binary if present; keep Django/DRF pinned by constraints
            sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' requirements.txt \
            | grep -viE '^[[:space:]]*(django|djangorestframework)\b' \
            > /tmp/req.clean.txt
            pip install -c "$PIP_CONSTRAINT" -r /tmp/req.clean.txt || true
          fi
          # Django/DRF if it’s a Django project
          if find . -name "settings.py" -type f | grep -q .; then
            pip install -c "$PIP_CONSTRAINT" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15"
          fi

      - name: Ensure pytest.ini (focus on repo tests; prune venv/vendor)
        working-directory: target
        shell: bash
        run: |
          cat > pytest.ini <<'EOF'
          [pytest]
          addopts = -v --tb=short
          python_files = test_*.py *_test.py *.test.py
          python_functions = test_*
          python_classes = Test*
          norecursedirs =
              .git
              .tox
              .env
              .venv
              venv
              env
              __pycache__
              .pytest_cache
              build
              dist
              node_modules
              */site-packages/*
          EOF
          echo "✅ Wrote pytest.ini"

      - name: Auto Django conftest (if Django project)
        working-directory: target
        shell: bash
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            cat > conftest.py <<'EOF'
          import os, sys, pathlib, pytest
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))

          def setup_django():
              try:
                  import django
                  from django.conf import settings
                  if not settings.configured:
                      # Prefer explicit known settings module for your repo
                      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'conduit.settings')
                      django.setup()
                      print("✅ Django setup with conduit.settings")
              except Exception as e:
                  print(f"⚠️ Django setup warning: {e}")

          setup_django()

          def pytest_configure(config):
              config.addinivalue_line("markers", "generated: AI-generated tests")
          EOF
            echo "✅ Wrote Django conftest.py"
          fi

      - name: Write .coveragerc (omit venv/vendor)
        working-directory: target
        shell: bash
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          omit =
              */.venv/*
              */venv/*
              */env/*
              */site-packages/*
              */.tox/*
              */.pytest_cache/*
              */__pycache__/*
              */migrations/*
          EOF
          echo "✅ Wrote .coveragerc"

      - name: Discover test files anywhere (exclude venv/vendor)
        id: discover
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, json, sys
          EXCLUDE = {'.git','.venv','venv','env','.tox','.pytest_cache','site-packages','__pycache__','node_modules'}
          tests=[]
          for root, dirs, files in os.walk('.', topdown=True):
              # prune excluded dirs at any level
              dirs[:] = [d for d in dirs if d not in EXCLUDE and not d.endswith('site-packages')]
              for f in files:
                  if f.endswith('.py') and (f.startswith('test_') or f.endswith('_test.py') or f.endswith('.test.py')):
                      tests.append(os.path.join(root, f))
          if not tests:
              print("❌ No test files found anywhere under the repository.")
              sys.exit(1)
          tests = sorted(set(tests))
          print(f"✅ Discovered {len(tests)} test files")
          print(json.dumps(tests[:25], indent=2))
          open('/tmp/test_files.txt','w').write('\n'.join(tests))
          PY
          echo "test_files=/tmp/test_files.txt" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage (CI gate)
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DJANGO_SETTINGS_MODULE: "conduit.settings"
        shell: bash
        run: |
          set -e
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if find . -name "settings.py" -type f | grep -q .; then
            PLUGINS="$PLUGINS -p pytest_django"
          fi
          mapfile -t FILES < "${{ steps.discover.outputs.test_files }}"
          echo "✅ Running pytest on ${#FILES[@]} files"
          set +e
          pytest -v --tb=short --maxfail=50 \
            $PLUGINS \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --timeout=300 \
            "${FILES[@]}"
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parse coverage & set gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          p = pathlib.Path('reports/tests/coverage.json')
          cov = 0.0
          if p.exists():
              try:
                  cov = float(json.load(open(p)).get('totals',{}).get('percent_covered',0.0))
              except Exception:
                  cov = 0.0
          thr = float(os.environ.get('COVERAGE_THRESHOLD','70'))
          tests_ok = ('${{ steps.run.outcome }}'=='success')
          ok = (cov >= thr) and tests_ok
          print(f"Coverage: {cov:.2f}% (threshold {thr}%), tests_ok={tests_ok} => {'OK' if ok else 'NOT OK'}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"ready={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        shell: bash
        run: |
          echo "## CI Result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
            echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold. **Ready to deploy.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**). **Do NOT deploy.**" >> "$GITHUB_STEP_SUMMARY"

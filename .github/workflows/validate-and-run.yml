# .github/workflows/validate-and-run.yml
name: Test Validation & Quality Analysis

on:
  workflow_run:
    workflows: ["First Workflow Name"]  # Replace with your prior workflow’s name *exactly*
    types:
      - completed

  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
  push:
    branches: [ test ]

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write
    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repository to ./target_repo
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          rm -rf target_repo
          git clone --depth=1 "$REPO_URL" target_repo
          echo "Cloned $REPO_URL into ./target_repo"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install \
            pytest pytest-cov pytest-html pytest-json-report \
            coverage pytest-xdist pytest-timeout pytest-mock \
            pytest-django typing-extensions

      - name: Install target requirements (if present)
        working-directory: target_repo
        run: |
          if [ -f requirements.txt ]; then
            # Prefer prebuilt wheel for psycopg2 to avoid build issues
            sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' requirements.txt || true
            pip install -r requirements.txt
          fi
          if [ -d requirements ]; then
            for f in requirements/*.txt; do
              sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' "$f" || true
              pip install -r "$f" || true   # extras best-effort
            done
          fi
          # Try to install the project as a package (best-effort)
          pip install -e . || true
          pip check || true

      - name: Write sitecustomize.py (generic shims + ensure repo on sys.path)
        working-directory: target_repo
        run: |
          cat > sitecustomize.py << 'EOF'
          """
          Auto-loaded before tests. Compatibility shims + ensure package importability.
          """
          # --- Ensure repo root and common source dirs are importable ---
          try:
              import sys, pathlib, os
              _root = pathlib.Path(__file__).resolve().parent
              for _p in (_root, _root / "src", _root / "app"):
                  _ps = str(_p)
                  if _p.exists() and _ps not in sys.path:
                      sys.path.insert(0, _ps)
          except Exception:
              pass

          # collections.abc re-exports for old code
          try:
              import collections, collections.abc as _abc
              for _name in ('Mapping','MutableMapping','Sequence','MutableSequence','Set',
                            'MutableSet','Iterable','Iterator','Generator','Container',
                            'Callable','Hashable'):
                  if not hasattr(collections, _name) and hasattr(_abc, _name):
                      setattr(collections, _name, getattr(_abc, _name))
          except Exception:
              pass

          # Flask / Jinja2 shims
          try:
              import flask
              if not hasattr(flask, "escape"):
                  from markupsafe import escape
                  flask.escape = escape
          except Exception:
              pass
          try:
              import jinja2
              if not hasattr(jinja2, "Markup"):
                  from markupsafe import Markup, escape
                  jinja2.Markup = Markup
                  jinja2.escape = escape
          except Exception:
              pass

          # Marshmallow shim
          try:
              import marshmallow as _mm
              if not hasattr(_mm, "__version__"):
                  _mm.__version__ = "4"
          except Exception:
              pass

          # Minimal Django bootstrap if project uses Django without settings wired
          try:
              import os, django
              from django.conf import settings
              if not settings.configured:
                  os.environ.setdefault("DJANGO_SETTINGS_MODULE", "test_settings")
                  if not os.path.exists("test_settings.py"):
                      with open("test_settings.py","w") as f:
                          f.write("SECRET_KEY='x'\nDEBUG=True\nINSTALLED_APPS=[]\n"
                                  "DATABASES={'default':{'ENGINE':'django.db.backends.sqlite3','NAME':':memory:'}}\n")
                  django.setup()
          except Exception:
              pass

          # pytest-django shim for older signatures
          try:
              import importlib, inspect
              dtu = importlib.import_module("django.test.utils")
              sig = inspect.signature(dtu.setup_test_environment)
              if "debug" not in sig.parameters:
                  _orig = dtu.setup_test_environment
                  def _shim(*a, **kw):
                      kw.pop("debug", None)
                      return _orig(*a, **kw)
                  dtu.setup_test_environment = _shim
          except Exception:
              pass
          EOF

      - name: Create coverage config
        working-directory: target_repo
        run: |
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit =
              tests/*
              */tests/*
              */__pycache__/*
              */venv/*
              */env/*
              setup.py
              */site-packages/*
              sitecustomize.py
          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              raise AssertionError
              raise NotImplementedError
              if __name__ == .__main__.:
          EOF

      - name: Probe collection (no plugins) to pinpoint collection issues
        working-directory: target_repo
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/target_repo
        run: |
          mkdir -p ../reports/tests
          echo "== Collect-only probe (no plugins) =="
          set +e
          pytest --collect-only -q --maxfail=1 --full-trace > ../reports/tests/collect-only.txt 2>&1
          CODE=$?
          set -e
          echo "collect_exit_code=$CODE"
          tail -n 120 ../reports/tests/collect-only.txt || true

      - name: Run tests (existing + generated) with coverage and reports
        working-directory: target_repo
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"          # disable autoload; enable only detected plugins
          PYTHONPATH: ${{ github.workspace }}/target_repo
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          mkdir -p ../reports/coverage ../reports/tests

          # Build test target list only if they exist; otherwise use auto-discovery
          TEST_DIRS=()
          [[ -d tests ]] && TEST_DIRS+=(tests)
          [[ -d tests/generated ]] && TEST_DIRS+=(tests/generated)
          if (( ${#TEST_DIRS[@]} == 0 )); then
            echo "::warning::No tests/ directories found; using auto-discovery"
            PYTEST_TARGETS=(".")
          else
            PYTEST_TARGETS=("${TEST_DIRS[@]}")
          fi

          # Compute source directories for --cov (exclude common non-source dirs)
          SRC_DIRS=$(python - <<'PY'
          import os
          skip={'tests','tests_generated','tests-generated','.git','.github','venv','.venv','env',
                'node_modules','dist','build','__pycache__','.mypy_cache','.idea','.vscode'}
          c=[]
          for d in os.listdir('.'):
              if d in skip or not os.path.isdir(d): continue
              for _,_,files in os.walk(d):
                  if any(f.endswith('.py') for f in files):
                      c.append(d); break
          print(' '.join(sorted(set(c))))
          PY
          )

          echo "Running pytest on: ${PYTEST_TARGETS[*]}"
          echo "Coverage on source dirs: ${SRC_DIRS:-<none detected>}"
          python - <<'PY' || true
          import sys, importlib.util, pathlib
          print("DEBUG PYTHONPATH:", sys.path[:3])
          spec = importlib.util.find_spec("conduit")
          print("DEBUG conduit importable:", bool(spec))
          if spec: print("DEBUG conduit origin:", getattr(spec, "origin", None))
          PY

          # Detect optional plugins by module presence
          ENABLED_PLUGINS=(-p pytest_cov -p pytest_jsonreport)
          python - <<'PY'
          import importlib.util, pathlib
          if importlib.util.find_spec("pytest_html"): pathlib.Path("HAS_HTML").write_text("1")
          if importlib.util.find_spec("pytest_timeout"): pathlib.Path("HAS_TIMEOUT").write_text("1")
          if importlib.util.find_spec("django"): pathlib.Path("HAS_DJANGO").write_text("1")
          PY
          [[ -f HAS_HTML ]] && ENABLED_PLUGINS+=(-p pytest_html)
          [[ -f HAS_TIMEOUT ]] && ENABLED_PLUGINS+=(-p pytest_timeout)
          if [[ -f HAS_DJANGO ]]; then
            ENABLED_PLUGINS+=(-p pytest_django)
            echo "Enabling pytest-django plugin (Django detected)."
          fi

          # Build args only if options exist with the chosen plugins
          HELP_OUT=$(pytest -h "${ENABLED_PLUGINS[@]}" 2>/dev/null || true)
          HTML_ARGS=""
          JSON_ARGS="--json-report --json-report-file=../reports/tests/test-results.json"
          TIMEOUT_ARGS=""
          echo "$HELP_OUT" | grep -q -- '--html='      && HTML_ARGS="--html=../reports/tests/test-report.html --self-contained-html"
          echo "$HELP_OUT" | grep -q -- '--timeout='   && TIMEOUT_ARGS="--timeout=300"

          set +e
          pytest "${PYTEST_TARGETS[@]}" \
            "${ENABLED_PLUGINS[@]}" \
            -rA --tb=short --full-trace \
            $TIMEOUT_ARGS \
            $JSON_ARGS \
            $HTML_ARGS \
            ${SRC_DIRS:+--cov=${SRC_DIRS}} \
            --cov-config=.coveragerc \
            --cov-report=xml:../reports/coverage/coverage.xml \
            --cov-report=json:../reports/coverage/coverage.json \
            --cov-report=term-missing \
            --junitxml=../reports/tests/junit.xml
          CODE=$?
          set -e

          # 2: INTERNALERROR, 4: usage/arg error (plugin/options mismatch)
          if [ "$CODE" -eq 2 ] || [ "$CODE" -eq 4 ]; then
            echo "❌ Pytest crashed or had usage error (exit $CODE). See reports."
            exit 1
          fi

          echo "pytest_exit_code=$CODE"
          ls -l ../reports/tests || true
          ls -l ../reports/coverage || true

      - name: Summarize, fail on skipped-only, test errors, & enforce coverage threshold
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          rep = pathlib.Path("reports/tests/test-results.json")
          cov = pathlib.Path("reports/coverage/coverage.json")

          results = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
          if rep.exists():
              try: results = json.loads(rep.read_text())
              except Exception: pass
          s = results.get("summary", {})
          total   = int(s.get("total", 0) or 0)
          passed  = int(s.get("passed", 0) or 0)
          failed  = int(s.get("failed", 0) or 0) + int(s.get("error", 0) or 0)
          skipped = int(s.get("skipped", 0) or 0)
          pct = (passed/total*100) if total else 0.0

          covp = 0.0
          if cov.exists():
              try: covp = float(json.loads(cov.read_text()).get("totals", {}).get("percent_covered", 0.0))
              except Exception: pass

          print(f"Summary: total={total}, passed={passed}, failed={failed}, skipped={skipped}, pass%={pct:.2f}, coverage={covp:.2f}%")

          # Fail on 'all skipped' (import path not set, missing deps, etc.)
          if total > 0 and passed == 0 and failed == 0:
              print('❌ All tests were skipped. This usually means modules were not importable or environment not ready.')
              sys.exit(1)

          if total == 0:
              print("❌ No tests collected. Failing the job.")
              sys.exit(1)

          if failed > 0:
              print(f"❌ {failed} test(s) failed. Failing the job.")
              sys.exit(1)

          threshold = float(os.environ.get("COVERAGE_THRESHOLD","80"))
          if covp < threshold:
              print(f"❌ Coverage {covp:.2f}% is below threshold {threshold}%")
              sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-analysis-reports
          path: reports/
          retention-days: 30

name: Test Validation & Quality Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
  push:
    branches: ["test"]

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Clone target repository to ./target_repo
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          rm -rf target_repo
          git clone --depth=1 "$REPO_URL" target_repo

      - name: Create compatibility constraints
        run: |
          cat > /tmp/compat-constraints.txt << 'EOF'
          Django>=3.2,<4.3
          djangorestframework>=3.12,<3.15
          EOF
          echo "PIP_CONSTRAINT=/tmp/compat-constraints.txt" >> "$GITHUB_ENV"

      - name: Download latest successful generated-tests artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: .github/workflows/testgen.yml
          workflow_conclusion: success
          branch: test
          name: generated-tests
          path: _gen_art
          repo: ${{ github.repository }}
          check_artifacts: true
          search_artifacts: true

      - name: Copy generated tests into cloned repo (not committed)
        run: |
          mkdir -p target_repo/tests/generated
          if compgen -G "_gen_art/**/test_*.py" > /dev/null; then
            find _gen_art -type f -name 'test_*.py' -exec cp -v {} target_repo/tests/generated/ \;
          fi
          if [ -d "_gen_art/gen_artifact" ]; then
            rsync -a _gen_art/gen_artifact/ target_repo/tests/generated/ || true
          fi
          echo "Discovered tests:"
          find target_repo/tests -type f -name 'test_*.py' | sed 's/^/ - /' || true

      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip}

      - name: Install base runner deps
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" pytest pytest-cov coverage pytest-json-report pytest-html pytest-timeout pytest-django

      - name: Install target requirements (repo-agnostic, strip conflicting pins)
        working-directory: target_repo
        run: |
          filter_req() { grep -viE '^[[:space:]]*(django|djangorestframework)\b' "$1" > /tmp/req.filtered.txt || true; }
          if [ -f requirements.txt ]; then
            sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' requirements.txt || true
            filter_req requirements.txt
            pip install -c "$PIP_CONSTRAINT" -r /tmp/req.filtered.txt || true
          fi
          if [ -d requirements ]; then
            for f in requirements/*.txt; do
              sed -i 's/^psycopg2\([^a-zA-Z0-9]\|$\)/psycopg2-binary\1/' "$f" || true
              filter_req "$f"
              pip install -c "$PIP_CONSTRAINT" -r /tmp/req.filtered.txt || true
            done
          fi
          if [ -f "pyproject.toml" ]; then
            if grep -q "\[tool.poetry\]" pyproject.toml; then
              pip install -c "$PIP_CONSTRAINT" poetry || true
              poetry export -f requirements.txt --without-hashes -o /tmp/poetry.lock.req || true
              [ -s /tmp/poetry.lock.req ] && grep -viE '^[[:space:]]*(django|djangorestframework)\b' /tmp/poetry.lock.req > /tmp/poetry.lock.filtered
              [ -s /tmp/poetry.lock.filtered ] && pip install -c "$PIP_CONSTRAINT" -r /tmp/poetry.lock.filtered || true
            fi
            if grep -q "\[tool.pdm\]" pyproject.toml; then
              pip install -c "$PIP_CONSTRAINT" pdm || true
              pdm export -o /tmp/pdm.lock.req --without-hashes --dev || true
              [ -s /tmp/pdm.lock.req ] && grep -viE '^[[:space:]]*(django|djangorestframework)\b' /tmp/pdm.lock.req > /tmp/pdm.lock.filtered
              [ -s /tmp/pdm.lock.filtered ] && pip install -c "$PIP_CONSTRAINT" -r /tmp/pdm.lock.filtered || true
            fi
          fi
          pip check || true

      - name: Auto-detect and install missing Python dependencies
        env:
          PIP_CONSTRAINT: /tmp/compat-constraints.txt
        run: |
          python - <<'PY'
          import ast, pathlib, sys, os, subprocess, importlib.util
          ROOT = pathlib.Path("target_repo")
          GEN  = ROOT / "tests" / "generated"
          files = []
          for base in (ROOT, GEN):
            if base.exists():
              files += list(base.rglob("*.py"))

          def top_imports(paths):
            tops=set()
            for p in paths:
              try:
                tree=ast.parse(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception:
                continue
              for n in ast.walk(tree):
                if isinstance(n, ast.Import):
                  for a in n.names:
                    t=(a.name.split(".")[0] or "").strip()
                    if t: tops.add(t)
                elif isinstance(n, ast.ImportFrom):
                  m=(n.module or "").split(".")[0]
                  if m: tops.add(m)
            return tops

          tops = top_imports(files)
          std = set(getattr(sys, "stdlib_module_names", set())) or {
            "os","sys","re","json","pathlib","math","itertools","functools","typing","subprocess","datetime",
            "time","collections","dataclasses","ast","logging","unittest","argparse","asyncio","sqlite3",
            "email","http","urllib","hashlib","hmac","base64","statistics","random","fractions","decimal",
            "csv","shutil","tempfile","glob","inspect","traceback","textwrap","string","pprint","enum","types"
          }
          deny = {
            "models","model","views","view","urls","settings","config","configs","tests","test",
            "schemas","schema","forms","admin","migrations","apps","serializers","permissions","filters",
            "routers","services","repository","repositories","managers","helpers","utils","renderers","relations"
          }
          def is_local(t): return (ROOT / f"{t}.py").exists() or (ROOT / t).is_dir()

          aliases = {
            "bs4":"beautifulsoup4", "cv2":"opencv-python", "yaml":"PyYAML", "sklearn":"scikit-learn",
            "PIL":"Pillow", "Crypto":"pycryptodome", "MySQLdb":"mysqlclient", "psycopg2":"psycopg2-binary",
            "jwt":"PyJWT", "rest_framework":"djangorestframework", "jinja2":"Jinja2",
            "fastapi":"fastapi", "starlette":"starlette", "pydantic":"pydantic",
            "uvicorn":"uvicorn", "flask":"Flask", "werkzeug":"Werkzeug", "sqlalchemy":"SQLAlchemy",
            "marshmallow":"marshmallow", "pymongo":"pymongo", "redis":"redis", "httpx":"httpx",
            "requests":"requests", "numpy":"numpy", "pandas":"pandas", "scipy":"scipy", "matplotlib":"matplotlib",
            "seaborn":"seaborn", "pytest_django":"pytest-django", "faker":"Faker", "cryptography":"cryptography",
            "boto3":"boto3", "googleapiclient":"google-api-python-client", "google_cloud_storage":"google-cloud-storage",
            "tensorflow":"tensorflow", "torch":"torch", "torchvision":"torchvision", "snowflake":"snowflake-connector-python",
            "django":"Django"
          }
          extras = {"fastapi":["starlette","pydantic"], "django":["djangorestframework"]}

          def installed(top): return importlib.util.find_spec(top) is not None

          candidates=[]
          for t in sorted(tops):
            if not t or t.startswith("_") or t in std or t in deny or is_local(t) or installed(t): continue
            c=[aliases.get(t,t)]
            dash=t.replace("_","-")
            if dash!=t: c.append(dash)
            if t=="google": c += ["google-api-python-client","google-auth","google-auth-oauthlib"]
            c += extras.get(t,[])
            for pkg in c:
              if pkg not in candidates: candidates.append(pkg)

          cons = os.environ.get("PIP_CONSTRAINT")
          def pip_install(pkg):
            cmd=[sys.executable,"-m","pip","install","--disable-pip-version-check"]
            if cons and os.path.exists(cons): cmd += ["-c", cons]
            cmd.append(pkg)
            try: subprocess.check_call(cmd)
            except subprocess.CalledProcessError as e: print(f"pip failed for {pkg} ({e.returncode})")

          for pkg in candidates: pip_install(pkg)

          unresolved=[t for t in sorted(tops) if t not in std and t not in deny and not is_local(t) and not installed(t)]
          print("Unresolved after install:", unresolved)
          PY

      - name: Generate minimal Django settings for tests
        working-directory: target_repo
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path(".")
          apps = set()
          # Prefer apps.py, else any package with models.py or migrations
          for p in root.rglob("apps.py"):
              rel = p.relative_to(root).with_suffix("")
              pkg = ".".join(rel.parts[:-1])
              if pkg: apps.add(pkg)
          for p in root.rglob("models.py"):
              pkg = ".".join(p.relative_to(root).parent.parts)
              if pkg and "tests" not in pkg and "venv" not in pkg: apps.add(pkg)
          for p in root.rglob("migrations"):
              if (p / "__init__.py").exists():
                  pkg = ".".join(p.relative_to(root).parent.parts)
                  if pkg and "tests" not in pkg and "venv" not in pkg: apps.add(pkg)
          base = [
            "django.contrib.auth","django.contrib.contenttypes",
            "django.contrib.sessions","django.contrib.messages","django.contrib.admin"
          ]
          content = f"""
          SECRET_KEY='autotest'
          DEBUG=True
          USE_TZ=True
          TIME_ZONE='UTC'
          ALLOWED_HOSTS=['*']
          DATABASES={{'default':{{'ENGINE':'django.db.backends.sqlite3','NAME':':memory:'}}}}
          INSTALLED_APPS={base + sorted(apps)}
          MIDDLEWARE=['django.middleware.security.SecurityMiddleware',
                      'django.contrib.sessions.middleware.SessionMiddleware',
                      'django.middleware.common.CommonMiddleware',
                      'django.middleware.csrf.CsrfViewMiddleware',
                      'django.contrib.auth.middleware.AuthenticationMiddleware',
                      'django.contrib.messages.middleware.MessageMiddleware']
          ROOT_URLCONF='__autourls__'
          DEFAULT_AUTO_FIELD='django.db.models.AutoField'
          EMAIL_BACKEND='django.core.mail.backends.locmem.EmailBackend'
          """
          (root / "_autotest_settings.py").write_text(content, encoding="utf-8")
          (root / "__autourls__.py").write_text("from django.urls import path\nurlpatterns=[]\n", encoding="utf-8")
          print("Wrote _autotest_settings.py with apps:", sorted(apps))
          PY

      - name: Run tests repo-agnostic (no files added to target repo)
        env:
          PYTHONPATH: ${{ github.workspace }}/target_repo
          DJANGO_SETTINGS_MODULE: _autotest_settings
          TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "0"
          PYTEST_ADDOPTS: "-p pytest_django"
        run: |
          chmod +x ci/run_tests.sh
          ci/run_tests.sh "$GITHUB_WORKSPACE/target_repo" || echo "pytest exit code captured"

      - name: Summarize & enforce coverage threshold
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          rep = pathlib.Path("target_repo/reports/tests/test-results.json")
          cov = pathlib.Path("target_repo/reports/tests/coverage.json")
          results = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
          if rep.exists():
              try: results = json.loads(rep.read_text())
              except Exception: pass
          s = results.get("summary", {})
          total   = int(s.get("total", 0) or 0)
          passed  = int(s.get("passed", 0) or 0)
          failed  = int(s.get("failed", 0) or 0) + int(s.get("error", 0) or 0)
          skipped = int(s.get("skipped", 0) or 0)
          covp = 0.0
          if cov.exists():
              try: covp = float(json.loads(cov.read_text()).get("totals", {}).get("percent_covered", 0.0))
              except Exception: pass
          print(f"Summary: total={total}, passed={passed}, failed={failed}, skipped={skipped}, coverage={covp:.2f}%")
          if total == 0:
              print("❌ No tests collected. Failing.")
              sys.exit(1)
          if failed > 0:
              print(f"❌ {failed} test(s) failed. Failing.")
              sys.exit(1)
          threshold = float(os.environ.get("COVERAGE_THRESHOLD","80"))
          if covp < threshold:
              print(f"❌ Coverage {covp:.2f}% is below threshold {threshold}%")
              sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-analysis-reports
          path: target_repo/reports/tests
          retention-days: 30

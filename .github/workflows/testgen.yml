name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to analyze"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      force_gen:
        required: false
        default: "false"
        description: "Force regeneration of all tests (overwrites existing)"
      prompt_style:
        required: false
        default: "ultra_bare"
        description: "Prompt style to use (ultra_bare, bare, normal, detailed, ultra_detailed)"
      coverage_threshold:
        required: false
        default: "0"
        description: "Minimum coverage threshold (%)"
  # push:
  #   branches: ["test2"]

concurrency:
  group: test-gen-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      AZURE_OPENAI_KEY:         ${{ secrets.AZURE_OPENAI_KEY         || secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT:    ${{ secrets.AZURE_OPENAI_ENDPOINT    || secrets.AZURE_OPENAI_API_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION || secrets.OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT:  ${{ secrets.AZURE_OPENAI_DEPLOYMENT  || secrets.OPENAI_DEPLOYMENT }}
      TESTGEN_PROMPT_STYLE: ${{ github.event.inputs.prompt_style || 'ultra_bare' }}
      TESTGEN_STRICT_FAIL: "1"
      DATABASE_URL: "sqlite:///:memory:"
      DB_URL: "sqlite:///:memory:"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight – verify required secrets
        run: |
          : "${AZURE_OPENAI_KEY:?Missing AZURE_OPENAI_KEY or AZURE_OPENAI_API_KEY}"
          : "${AZURE_OPENAI_ENDPOINT:?Missing AZURE_OPENAI_ENDPOINT or AZURE_OPENAI_API_ENDPOINT}"
          : "${AZURE_OPENAI_API_VERSION:?Missing AZURE_OPENAI_API_VERSION or OPENAI_API_VERSION}"
          : "${AZURE_OPENAI_DEPLOYMENT:?Missing AZURE_OPENAI_DEPLOYMENT or OPENAI_DEPLOYMENT}"

      - name: Clone target repository
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
          git clone --depth 1 "$REPO_URL" target

      - name: Derive OUTDIR, TARGET_ROOT and repo metadata
        id: meta
        run: |
          echo "TARGET_ROOT=target" >> $GITHUB_ENV
          REPO_SLUG="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s#[^A-Za-z0-9._-]#_#g')"
          REPO_PATH="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s/\.git$//')"
          OUTDIR="tests/generated/${REPO_SLUG}/current"
          mkdir -p "$OUTDIR"
          DEFAULT_BRANCH="$(git -C target remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"
          {
            echo "REPO_SLUG=$REPO_SLUG"
            echo "OUTDIR=$OUTDIR"
            echo "REPO_PATH=$REPO_PATH"
            echo "DEFAULT_BRANCH=$DEFAULT_BRANCH"
          } >> "$GITHUB_ENV"
          echo "repo_slug=$REPO_SLUG"            >> "$GITHUB_OUTPUT"
          echo "outdir=$OUTDIR"                  >> "$GITHUB_OUTPUT"
          echo "repo_path=$REPO_PATH"            >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH"  >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Create repo-agnostic compatibility constraints
        run: |
          cat > /tmp/compat-constraints.txt << 'EOF'
          Django>=3.2,<4.3
          djangorestframework>=3.12,<3.15
          EOF
          echo "PIP_CONSTRAINT=/tmp/compat-constraints.txt" >> "$GITHUB_ENV"

      - name: Bootstrap Python constraints (repo-agnostic)
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          python ci/py_stack_guard.py | tee /tmp/stack_env || true
          if grep -qE '^(PIP_CONSTRAINT|TESTGEN_PIP_CONSTRAINTS)=' /tmp/stack_env; then
            grep -E '^(PIP_CONSTRAINT|TESTGEN_PIP_CONSTRAINTS)=' /tmp/stack_env >> "$GITHUB_ENV"
          fi
          MODE="$(cat .stack_mode.txt 2>/dev/null || echo modern)"
          echo "Resolved stack mode: $MODE"
          if [ "$MODE" = "legacy_flask" ] && [ -f ".constraints.txt" ]; then
            python -m pip install -U -c "$PIP_CONSTRAINT" -c .constraints.txt \
              "Flask<2.3" "Werkzeug<2.3" "Flask-SQLAlchemy<3" "SQLAlchemy<2.0" \
              "Jinja2<3.1" "itsdangerous<2.1" "click<8.1"
          fi

      - name: Install system build tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              build-essential python3-dev libpq-dev default-libmysqlclient-dev \
              libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
              libxml2-dev libxslt1-dev curl
          else
            echo "Skipping apt-get setup on this self-hosted runner."
          fi

      - name: Install Python deps (tooling + target libs, constrained)
        run: ci/install_deps.sh

      - name: Force compatible Django & DRF
        run: |
          python -m pip install --upgrade -c "$PIP_CONSTRAINT" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15"

      - name: Print core versions (debug)
        run: |
          python - <<'PY'
          import importlib
          for n in ("flask","werkzeug","flask_sqlalchemy","sqlalchemy","jinja2","itsdangerous","click","marshmallow","django","djangorestframework"):
              try:
                  m=importlib.import_module(n); print(f"{n}: {getattr(m,'__version__','?')}")
              except Exception as e:
                  print(f"{n}: not installed ({e})")
          PY

      - name: Analyze target codebase
        run: python -m src.analyzer --root target > /tmp/analysis.json

      - name: Generate tests
        env:
          TARGET_ROOT: target
          TESTGEN_FORCE: ${{ github.event.inputs.force_gen || 'false' }}
          TESTGEN_STRICT_FAIL: "1"
          TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "0"
          TESTGEN_FIX_FLASK: "0"
          TESTGEN_AUTO_PIP: "0"     
        run: |
          python - <<'PY'
          import os, json
          import src.gen.generate as g
          analysis = json.load(open('/tmp/analysis.json'))
          outdir = os.environ['OUTDIR']
          force = os.environ.get('TESTGEN_FORCE', 'false').lower() == 'true'
          if force:
              print('Force flag ON (TESTGEN_FORCE) — generating regardless of change detection')
              os.environ['TESTGEN_FORCE'] = 'true'
          g.generate_all(analysis, outdir=outdir, focus_files=None)
          PY

      - name: List generated tests
        run: |
          echo "Listing ${OUTDIR}"
          ls -lah "${OUTDIR}" || true
          echo "Preview .py files:"
          find "${OUTDIR}" -type f -name 'test_*.py' | sed 's/^/ - /' || true

      - name: Copy generated tests into target repo
        run: |
          mkdir -p target/tests/generated
          cp -r "${OUTDIR}"/* target/tests/generated/ || true
          echo "Final tests copied into target repo:"
          find target/tests/generated -name "test_*.py" | head -20

      - name: Quarantine syntactically invalid generated tests
        working-directory: target
        run: |
          python - <<'PY'
          import ast, pathlib
          import_text = "import pytest as _pytest\n_pytest.skip('quarantined invalid generated test', allow_module_level=True)\n"
          base = pathlib.Path("tests/generated")
          if base.exists():
              for p in base.rglob("test_*.py"):
                  try:
                      ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
                  except SyntaxError:
                      p.write_text(import_text + "\n\"\"\"\n" + p.read_text(encoding="utf-8") + "\n\"\"\"\n", encoding="utf-8")
                      print(f"Quarantined: {p}")
          PY

      - name: Package artifact (always produce something)
        run: |
          mkdir -p gen_artifact
          if [ -d target/tests/generated ]; then rsync -a target/tests/generated/ gen_artifact/; fi
          if [ -d "${OUTDIR}" ]; then rsync -a "${OUTDIR}"/ gen_artifact/; fi
          find gen_artifact -type f -name 'test_*.py' | wc -l > gen_artifact/_count.txt
          [ -s gen_artifact/_count.txt ] || echo "0" > gen_artifact/_count.txt
          [ -f gen_artifact/README.txt ] || echo "Generated tests artifact bundle" > gen_artifact/README.txt
          echo "Bundled files:"; find gen_artifact | sed 's/^/ - /'

      - name: Upload generated tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: gen_artifact
          retention-days: 7

      - name: Sanity check generated tests (collect-only)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"   # enable minimal Django settings for import/collect
        run: |
          cd target
          pytest -q --collect-only tests/generated || true

      - name: Commit & push generated tests (best-effort)
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 }}
        run: |
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$GH_PAT3" ]; then
            git remote set-url origin "https://x-access-token:${GH_PAT3}@github.com/${{ steps.meta.outputs.repo_path }}.git"
          fi
          git add tests/generated || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(testgen): update generated tests [skip ci]" || true
          git pull --rebase origin "${DEFAULT_BRANCH}" || true
          git push origin HEAD:"${DEFAULT_BRANCH}" || true

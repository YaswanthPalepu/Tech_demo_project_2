<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI TestGen Dashboard</title>
    <link rel="preconnect" href="https://unpkg.com">
    <style>
      body { font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #0b1020; color: #e8eefc; }
      header { padding: 20px 24px; border-bottom: 1px solid #1b2340; background: #0f1530; position: sticky; top: 0; }
      .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card { background: #12193a; border: 1px solid #21305f; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
      .muted { opacity: .7; font-size: 14px; }
      .value { font-size: 40px; font-weight: 800; margin-top: 6px; }
      .row { display: flex; gap: 10px; align-items: center; }
      button { background: #2a72ff; border: none; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; }
      button:disabled { opacity: .6; cursor: not-allowed; }
      a { color: #9ec1ff; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap row" style="justify-content: space-between;">
        <div class="row" style="gap:14px">
          <div style="width:12px;height:12px;border-radius:50%;background:#2a72ff;"></div>
          <strong>AI TestGen Dashboard</strong>
        </div>
        <div class="row" style="gap:8px">
          <button id="refresh">Refresh Metrics</button>
          <a href="/dashboard" title="Dashboard Home">/dashboard</a>
        </div>
      </div>
    </header>
    <div class="wrap">
      <div id="root"></div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const e = React.createElement;

      function Card({title, value}) {
        return e('div', {className: 'card'},
          e('div', {className:'muted'}, title),
          e('div', {className:'value'}, value)
        );
      }

      function App() {
        const [data, setData] = React.useState(null);
        const [loading, setLoading] = React.useState(false);

        const load = (refresh=false) => {
          setLoading(true);
          fetch('/api/metrics' + (refresh ? '?refresh=1' : ''))
            .then(r => r.json())
            .then(d => setData(d))
            .finally(() => setLoading(false));
        };

        React.useEffect(() => { load(false); }, []);

        return e(React.Fragment, null,
          e('div', {className: 'row', style:{marginBottom:16}},
            e('button', {id:'btn', onClick: ()=>load(true), disabled: loading}, loading ? 'Refreshing…' : 'Refresh'),
            e('div', {className:'muted'}, 'Tip: run tests with coverage first so coverage.xml exists')
          ),
          data ? e('div', {className:'grid'},
            e(Card, {title:'Coverage', value: (data.coverage ?? 0) + '%'}),
            e(Card, {title:'Total Tests', value: data.tests ?? 0}),
            e(Card, {title:'Failures', value: data.failures ?? 0})
          ) : e('div', null, 'Loading…')
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>

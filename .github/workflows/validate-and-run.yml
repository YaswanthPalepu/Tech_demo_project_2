name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: [test2]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate (fallback: current repo)"
        required: false
        default: ""

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          set -e
          REPO_URL="${{ github.event.inputs.repo_url }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved repo_url: $REPO_URL"

      - name: Set compatibility constraints
        shell: bash
        run: |
          printf "%s\n%s\n" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15" > /tmp/compat-constraints.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" \
            pytest pytest-cov pytest-timeout \
            pytest-django pytest-flask pytest-xdist \
            coverage httpx requests

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          REPO_URL='${{ steps.target.outputs.repo_url }}'
          echo "Cloning: $REPO_URL"
          CLEAN_URL="$REPO_URL"
          [[ "$CLEAN_URL" == git@* ]] && CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          [[ "$CLEAN_URL" != https://* ]] && CLEAN_URL="https://github.com/$CLEAN_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"

      - name: Copy tests from this repo into target (if present)
        shell: bash
        run: |
          mkdir -p target/tests/generated
          if [ -d tests/generated ]; then
            rsync -a tests/generated/ target/tests/generated/
            echo "✅ Copied $(find target/tests/generated -type f -name 'test_*.py' | wc -l) tests into target/"
          else
            echo "ℹ️ No local tests/generated folder, checking target repo itself."
            if [ -d target/tests/generated ]; then
              echo "✅ Found tests/generated already in target repo."
            fi
          fi

      - name: Safe, repo-agnostic dependency install
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" "typing-extensions>=4.8" "uvicorn>=0.23" "pydantic>=2" "starlette>=0.37" || true

          sanitize_and_install() {
            local req_file="$1"
            [ -f "$req_file" ] || return 0
            echo "Sanitizing $req_file"
            sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' "$req_file" \
              | grep -viE '^[[:space:]]*(django|djangorestframework)\b' \
              > /tmp/req.candidate.txt
            awk '
              /^[[:space:]]*$/ {next}
              /^[[:space:]]*#/ {next}
              /^[[:space:]]*-/ {next}
              /^[[:space:]]*--/ {next}
              /^\-e[[:space:]]/ {next}
              /^git\+|^hg\+|^svn\+|^bzr\+/ {next}
              /^file:/ {next}
              {print}
            ' /tmp/req.candidate.txt > /tmp/req.clean.txt
            : > /tmp/req.final.txt
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              if python -m pip index versions "$pkg" >/dev/null 2>&1; then
                echo "$pkg" >> /tmp/req.final.txt
              else
                echo "⏭️  Skip non-resolvable: $pkg"
              fi
            done < /tmp/req.clean.txt
            if [ -s /tmp/req.final.txt ]; then
              pip install -c "$PIP_CONSTRAINT" -r /tmp/req.final.txt || true
            fi
          }

          sanitize_and_install "requirements.txt"
          if compgen -G "requirements/*.txt" >/dev/null; then
            for f in requirements/*.txt; do sanitize_and_install "$f"; done
          fi

          if [ -f pyproject.toml ] && grep -q "\[tool.poetry\]" pyproject.toml; then
            pip install -c "$PIP_CONSTRAINT" poetry || true
            poetry export -f requirements.txt --without-hashes -o /tmp/poetry.lock.req || true
            [ -s /tmp/poetry.lock.req ] && sanitize_and_install /tmp/poetry.lock.req
          fi

          if [ -f pyproject.toml ] && grep -q "\[tool.pdm\]" pyproject.toml; then
            pip install -c "$PIP_CONSTRAINT" pdm || true
            pdm export -o /tmp/pdm.lock.req --without-hashes --dev || true
            [ -s /tmp/pdm.lock.req ] && sanitize_and_install /tmp/pdm.lock.req
          fi

          if find . -name "settings.py" -type f | grep -q .; then
            pip install -c "$PIP_CONSTRAINT" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15"
          fi

      - name: Ensure __init__.py files in test directories
        working-directory: target
        shell: bash
        run: |
          for dir in tests tests/generated test; do
            if [ -d "$dir" ] && [ ! -f "$dir/__init__.py" ]; then
              touch "$dir/__init__.py"
              echo "✅ Created $dir/__init__.py"
            fi
          done

      - name: Ensure pytest.ini (exclude venv and focus on tests)
        working-directory: target
        shell: bash
        run: |
          # Create comprehensive pytest.ini that excludes virtual environments
          cat > pytest.ini << 'EOF'
            [pytest]
            testpaths = tests tests/generated
            addopts = -v --tb=short
            python_files = test_*.py *_test.py
            python_functions = test_*
            python_classes = Test*
            norecursedirs = 
                .git
                .tox
                .env
                .venv
                venv
                env
                __pycache__
                .pytest_cache
                build
                dist
                *.egg
                node_modules
                src/.venv
                */site-packages/*
            collect_ignore = 
                setup.py
                conftest.py
                */migrations/*
                */.venv/*
                */venv/*
                */env/*
                */site-packages/*
            EOF
          echo "✅ Wrote comprehensive pytest.ini"
          cat pytest.ini

      - name: Auto Django conftest (if Django project)
        working-directory: target
        shell: bash
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            cat > conftest.py << 'EOF'
            import os
            import sys
            import pathlib
            import pytest
            import django
            from django.conf import settings
            from django.core.management import execute_from_command_line

            # Add project root to Python path
            ROOT = pathlib.Path(__file__).resolve().parent
            if str(ROOT) not in sys.path:
                sys.path.insert(0, str(ROOT))

            def setup_django():
                """Setup Django for testing"""
                try:
                    if not settings.configured:
                        # Look for settings.py in the project
                        settings_module = None
                        for settings_file in ROOT.rglob('settings.py'):
                            if 'migration' not in str(settings_file):
                                rel_path = settings_file.relative_to(ROOT).with_suffix('')
                                settings_module = '.'.join(rel_path.parts)
                                break
                        
                        if settings_module:
                            os.environ.setdefault('DJANGO_SETTINGS_MODULE', settings_module)
                            django.setup()
                            print(f"✅ Django setup complete with {settings_module}")
                        else:
                            print("❌ No settings.py found")
                except Exception as e:
                    print(f'⚠️ Django setup warning: {e}')

            # Setup Django immediately
            setup_django()

            def pytest_configure(config):
                """Configure pytest with Django-specific settings"""
                config.addinivalue_line('markers', 'generated: AI-generated tests')

            @pytest.fixture(scope='session', autouse=True)
            def django_db_setup():
                """Setup test database"""
                try:
                    from django.core.management import call_command
                    from django.test.utils import setup_test_environment, teardown_test_environment
                    
                    setup_test_environment()
                    # Create test database
                    call_command('migrate', verbosity=0, interactive=False)
                    yield
                    teardown_test_environment()
                except Exception as e:
                    print(f"Database setup warning: {e}")
                    yield
            EOF
                        echo "✅ Wrote comprehensive Django conftest.py"
                      fi

      - name: Write .coveragerc (omit venv/vendor)
        working-directory: target
        shell: bash
        run: |
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit = 
              */.venv/*
              */venv/*
              */env/*
              */site-packages/*
              */.tox/*
              */.pytest_cache/*
              */__pycache__/*
              */migrations/*
              */tests/*
              conftest.py
              setup.py
              manage.py

          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              if self.debug:
              if settings.DEBUG
              raise AssertionError
              raise NotImplementedError
              if 0:
              if __name__ .__main__.:
              class .*\bProtocol\):
              @(abc\.)?abstractmethod
          EOF
                    echo "✅ Wrote comprehensive .coveragerc"

      - name: Analyze test files for issues
        working-directory: target
        shell: bash
        run: |
          echo "=== Analyzing test files for syntax and import issues ==="
          
          test_count=0
          valid_tests=0
          invalid_tests=0
          
          for testfile in $(find tests/generated -name "test_*.py" 2>/dev/null | head -10); do
            test_count=$((test_count + 1))
            echo "--- Analyzing $testfile ---"
            
            # Check file size
            if [ ! -s "$testfile" ]; then
              echo "❌ Empty file"
              invalid_tests=$((invalid_tests + 1))
              continue
            fi
            
            # Check for test functions
            test_func_count=$(grep -c "^def test_" "$testfile" || echo "0")
            if [ "$test_func_count" -eq 0 ]; then
              echo "❌ No test functions found (should start with 'def test_')"
              echo "First 10 lines:"
              head -10 "$testfile"
              invalid_tests=$((invalid_tests + 1))
              continue
            fi
            
            # Check Python syntax
            if python -m py_compile "$testfile" 2>/dev/null; then
              echo "✅ Valid Python syntax, $test_func_count test functions"
              valid_tests=$((valid_tests + 1))
            else
              echo "❌ Python syntax errors:"
              python -m py_compile "$testfile" 2>&1 | head -5
              invalid_tests=$((invalid_tests + 1))
            fi
          done
          
          echo "=== Summary ==="
          echo "Total test files: $test_count"
          echo "Valid test files: $valid_tests"
          echo "Invalid test files: $invalid_tests"
          
          if [ "$valid_tests" -eq 0 ]; then
            echo "❌ No valid test files found!"
            exit 1
          fi

      - name: Run tests with coverage (CI gate)
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DJANGO_SETTINGS_MODULE: "conduit.settings"
        shell: bash
        run: |
          set -e
          mkdir -p reports/tests
          
          # Setup Django environment
          export DJANGO_SETTINGS_MODULE="conduit.settings"
          
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if find . -name "settings.py" -type f | grep -q .; then
            PLUGINS="$PLUGINS -p pytest_django"
          fi

          # Specific test targets that we know exist
          TARGETS="tests/generated"
          
          echo "✅ Running pytest on: $TARGETS"
          echo "Current working directory: $(pwd)"
          echo "Python path: $PYTHONPATH"
          
          # Run with specific targeting to avoid virtual env collection
          set +e
          pytest -v --tb=short --maxfail=10 \
            $PLUGINS \
            --cov=conduit \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --timeout=300 \
            --ignore=src \
            --ignore=.venv \
            --ignore=venv \
            --ignore=env \
            $TARGETS
          code=$?
          set -e
          
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          
          # Show results summary
          if [ $code -eq 0 ]; then
            echo "✅ All tests passed!"
          elif [ $code -eq 5 ]; then
            echo "❌ No tests were collected (exit code 5)"
            echo "Re-checking test collection..."
            pytest --collect-only -v $TARGETS || true
          else
            echo "❌ Tests failed with exit code $code"
          fi
          
          exit $code

      - name: Parse coverage & set gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          
          coverage_file = pathlib.Path('reports/tests/coverage.json')
          cov = 0.0
          
          if coverage_file.exists():
              try:
                  with open(coverage_file) as f:
                      data = json.load(f)
                      cov = float(data.get('totals', {}).get('percent_covered', 0.0))
                  print(f"✅ Coverage data found: {cov:.2f}%")
              except Exception as e:
                  print(f"❌ Error reading coverage: {e}")
                  cov = 0.0
          else:
              print("❌ No coverage data file found")
          
          threshold = float(os.environ.get('COVERAGE_THRESHOLD', '70'))
          tests_ok = ('${{ steps.run.outcome }}' == 'success')
          gate_passed = (cov >= threshold) and tests_ok
          
          print(f"Coverage: {cov:.2f}% (threshold {threshold}%)")
          print(f"Tests OK: {tests_ok}")
          print(f"Gate status: {'PASS' if gate_passed else 'FAIL'}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"ready={'true' if gate_passed else 'false'}\n")
          
          sys.exit(0 if gate_passed else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        shell: bash
        run: |
          echo "## CI Result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
            echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold. **Ready to deploy.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**). **Do NOT deploy.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Debug Info" >> "$GITHUB_STEP_SUMMARY"
            echo "- Coverage: ${{ steps.gate.outputs.coverage }}%" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tests passed: ${{ steps.run.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          fi
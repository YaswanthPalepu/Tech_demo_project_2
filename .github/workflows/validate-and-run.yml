name: External Repository CI Pipeline

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository URL to test"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      branch:
        description: "Branch to test"
        required: false
        default: "main"
  push:
    branches: [ "test2" ]

jobs:
  test-external-repo:
    runs-on: self-hosted
    env:
      COVERAGE_THRESHOLD: "70"

    steps:
      - name: Checkout CI pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Clone target repository
        run: |
          echo "Cloning target repository: ${{ github.event.inputs.target_repo }}"
          git clone --depth 1 --branch "${{ github.event.inputs.branch || 'main' }}" \
            "${{ github.event.inputs.target_repo }}" target-repo
          echo "✅ Successfully cloned target repository"

      - name: Install dependencies for target repo
        working-directory: target-repo
        run: |
          python -m pip install --upgrade pip
          
          # Install dependencies from various possible requirement files
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi
          if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi
          
          # Install testing tools
          pip install pytest pytest-cov coverage

      - name: Discover test structure
        working-directory: target-repo
        run: |
          echo "🔍 Searching for test files and directories..."
          
          # Find all test directories (any depth)
          echo "Test directories found:"
          find . -type d \( -name "tests" -o -name "test" \) -not -path "*/.*" | head -10
          
          # Find test files in any directory
          echo "Test files found:"
          find . -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" | grep -v "/\." | head -15
          
          # Count total test files
          TEST_FILE_COUNT=$(find . -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" | grep -v "/\." | wc -l)
          echo "Total test files found: $TEST_FILE_COUNT"

      - name: Run tests with coverage
        id: run_tests
        working-directory: target-repo
        run: |
          mkdir -p reports
          
          # Find all test directories recursively
          TEST_DIRS=()
          while IFS= read -r dir; do
            TEST_DIRS+=("$dir")
          done < <(find . -type d \( -name "tests" -o -name "test" \) -not -path "*/.*" 2>/dev/null || true)
          
          # If no test directories found, find directories containing test files
          if [ ${#TEST_DIRS[@]} -eq 0 ]; then
            while IFS= read -r dir; do
              TEST_DIRS+=("$dir")
            done < <(find . -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" | grep -v "/\." | xargs -n1 dirname 2>/dev/null | sort -u || true)
          fi
          
          # If still no test directories, use current directory
          if [ ${#TEST_DIRS[@]} -eq 0 ]; then
            TEST_DIRS=(".")
            echo "⚠️  No specific test directories found, running tests from root directory"
          fi
          
          echo "📁 Test directories to run:"
          printf '  - %s\n' "${TEST_DIRS[@]}"
          
          # Run pytest on all discovered test directories
          python -m pytest "${TEST_DIRS[@]}" -v --tb=short \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --cov-report=term-missing \
            --junitxml=reports/test-results.xml

      - name: Check coverage
        id: coverage_check
        working-directory: target-repo
        run: |
          # Extract coverage percentage from the XML report
          coverage_percent=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('reports/coverage.xml')
              root = tree.getroot()
              coverage_rate = float(root.get('line-rate', '0'))
              print(f'{coverage_rate * 100:.2f}')
          except Exception as e:
              print('0.00')
          ")
          
          echo "Coverage: $coverage_percent%"
          echo "coverage_percent=$coverage_percent" >> $GITHUB_OUTPUT
          
          # Check if coverage meets threshold
          if (( $(echo "$coverage_percent >= $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "✅ Coverage meets threshold of $COVERAGE_THRESHOLD%"
            echo "coverage_met=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Coverage below threshold of $COVERAGE_THRESHOLD%"
            echo "coverage_met=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.event.inputs.target_repo}}-${{ github.run_number }}
          path: target-repo/reports/
          retention-days: 7

      - name: Project ready for deployment
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 EXTERNAL REPOSITORY CI COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo ""
          echo "📦 Target Repository: ${{ github.event.inputs.target_repo }}"
          echo "🌿 Branch: ${{ github.event.inputs.branch || 'main' }}"
          echo "✅ All tests passed"
          echo "📊 Code coverage: ${{ steps.coverage_check.outputs.coverage_percent }}%"
          echo "🎯 Coverage threshold: $COVERAGE_THRESHOLD% met"
          echo "🚀 PROJECT IS READY FOR DEPLOYMENT"
          echo ""
          echo "📋 Tested at: $(date)"
          echo "🔗 Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=========================================="

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ External Repository CI Pipeline Failed!"
          echo "Target Repository: ${{ github.event.inputs.target_repo }}"
          echo "Coverage: ${{ steps.coverage_check.outputs.coverage_percent || '0' }}% (required: $COVERAGE_THRESHOLD%)"
          echo "Please check the test results and fix the issues."
          echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
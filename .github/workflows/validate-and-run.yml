name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: [test2]
  workflow_dispatch:

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt
      FIXED_REPO_URL: "https://github.com/DeviPrasad372002/django-test-app.git"

    steps:
      - uses: actions/checkout@v4

      - name: Set compatibility constraints
        run: |
          cat > /tmp/compat-constraints.txt <<'EOF'
          Django>=3.2,<4.3
          djangorestframework>=3.12,<3.15
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" \
            pytest pytest-cov pytest-timeout \
            pytest-django pytest-flask pytest-xdist \
            coverage httpx requests

      - name: Clone fixed target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_URL="$FIXED_REPO_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          echo "Cloning: $CLEAN_URL"
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"

      - name: Copy tests from this repo into target (if present)
        run: |
          if [ -d tests/generated ]; then
            mkdir -p target/tests/generated
            rsync -a tests/generated/ target/tests/generated/
            echo "✅ Copied $(find target/tests/generated -type f -name '*test*.py' | wc -l) tests into target/"
          else
            echo "ℹ️ No tests/generated in this repo; relying on tests inside target repo."
          fi

      - name: Write pytest.ini
        working-directory: target
        run: |
          cat > pytest.ini <<'INI'
          [pytest]
          python_files = test_*.py *_test.py *test*.py
          python_classes = Test* *Tests
          python_functions = test_* *_test test*
          addopts =
          INI

      - name: Write .coveragerc
        working-directory: target
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          omit =
              */.venv/*
              */venv/*
              */env/*
              */site-packages/*
              */.tox/*
              */.pytest_cache/*
              */__pycache__/*
          EOF

      - name: Find test roots
        id: discover
        working-directory: target
        run: |
          set -e
          mapfile -t DIRS < <( \
            find . \
              \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
              -type f -name "*test*.py" -printf '%h\n' | sort -u \
          )
          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "❌ No repo test files found."
            find . -maxdepth 3 -type d | sed 's/^/ - /'
            exit 1
          fi
          printf '%s\n' "${DIRS[@]}" > /tmp/test_dirs.txt
          echo "✅ Found test roots:"; sed 's/^/ - /' /tmp/test_dirs.txt

      - name: Auto Django conftest (if Django project)
        working-directory: target
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            python - <<'PY'
            import os, sys, pathlib
            p = pathlib.Path("conftest.py")
            p.write_text(
                "import os, sys, pathlib\n"
                "ROOT = pathlib.Path(__file__).resolve().parent\n"
                "if str(ROOT) not in sys.path: sys.path.insert(0, str(ROOT))\n"
                "def setup_django():\n"
                "    try:\n"
                "        import django\n"
                "        from django.conf import settings\n"
                "        if not settings.configured:\n"
                "            for s in ROOT.rglob('settings.py'):\n"
                "                if 'migration' not in str(s):\n"
                "                    rel = s.relative_to(ROOT).with_suffix('')\n"
                "                    os.environ['DJANGO_SETTINGS_MODULE']='.'.join(rel.parts)\n"
                "                    break\n"
                "            django.setup()\n"
                "    except Exception as e:\n"
                "        print(f'⚠️ Django setup warning: {e}')\n"
                "setup_django()\n",
                encoding="utf-8"
            )
            print("✅ Wrote Django conftest.py")
            PY
          fi

      - name: Run tests with coverage
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -e
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if find . -name "settings.py" -type f | grep -q .; then
            PLUGINS="$PLUGINS -p pytest_django"
          fi
          mapfile -t TEST_DIRS < /tmp/test_dirs.txt
          echo "✅ Running pytest in:"; printf ' - %s\n' "${TEST_DIRS[@]}"
          set +e
          pytest -v --tb=short --maxfail=50 \
            $PLUGINS \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --timeout=300 \
            "${TEST_DIRS[@]}"
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parse coverage & set gate
        id: gate
        if: always()
        working-directory: target
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          covp = pathlib.Path("reports/tests/coverage.json")
          coverage = 0.0
          if covp.exists():
              try:
                  coverage = float(json.load(open(covp)).get("totals",{}).get("percent_covered",0.0))
              except Exception:
                  coverage = 0.0
          thr = float(os.environ.get("COVERAGE_THRESHOLD","70"))
          tests_ok=('${{ steps.run.outcome }}'=='success')
          ok=(coverage >= thr) and tests_ok
          print(f"Coverage: {coverage:.2f}% (threshold {thr}%), tests_ok={tests_ok} => {'OK' if ok else 'NOT OK'}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"coverage={coverage:.2f}\n")
              f.write(f"ready={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness
        if: always()
        run: |
          {
            echo "## CI Result"
            if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
              echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold."
            else
              echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

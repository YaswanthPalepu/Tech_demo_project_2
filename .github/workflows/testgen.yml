name: Generate AI Tests for External Repo

on:
  push:
    branches: [local]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Full HTTPS URL of the target repo"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      target_branch:
        description: "Branch to write to"
        default: main
      python_version:
        description: "Python version"
        default: "3.12"

permissions:
  contents: write

env:
  REPO_URL_DEFAULT: "https://github.com/DeviPrasad372002/django-test-app.git"
  BRANCH_DEFAULT: "local"
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - name: Checkout ai-testgen repo (this)
        uses: actions/checkout@v4

      - name: Clone target repo → ./target
        id: clone
        env:
          IN_URL: ${{ github.event.inputs.target_repo || env.REPO_URL_DEFAULT }}
          IN_BRANCH: ${{ github.event.inputs.target_branch || env.BRANCH_DEFAULT }}
        run: |
          set -e
          rm -rf target
          AUTH_URL="${IN_URL/https:\/\//https:\/\/x-access-token:${GITHUB_TOKEN}@}"
          git clone --depth 1 --branch "${IN_BRANCH}" "${AUTH_URL}" target
          echo "TARGET_DIR=$PWD/target" >> $GITHUB_ENV
          ls -la target
          find target -type f -name '*.py' | wc -l

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version || '3.12' }}

      - name: Create venv and install deps
        run: |
          set -e
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run analyzer + generator
        env:
          TARGET_ROOT: ${{ env.TARGET_DIR }}
          PYTHONPATH: ${{ env.TARGET_DIR }}
          TESTGEN_FORCE: "true"
        run: |
          set -e
          . .venv/bin/activate
          python -m src.gen --target "$TARGET_ROOT" --outdir "$TARGET_ROOT/tests/generated"

      - name: Show generated tests
        run: |
          ls -al "$TARGET_DIR/tests/generated" || true
          find "$TARGET_DIR/tests/generated" -maxdepth 1 -type f -name 'test_*.py' | wc -l

      - name: Commit changes to same branch
        working-directory: target
        env:
          BRANCH: ${{ github.event.inputs.target_branch || env.BRANCH_DEFAULT }}
          GIT_AUTHOR_NAME: ai-testgen-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add tests/generated || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(tests): AI-generated tests [skip ci]"
          git push origin "HEAD:${BRANCH}"

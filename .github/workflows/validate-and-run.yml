name: Test Validation & Quality Analysis

on:
  # workflow_run:
  #   workflows: ["AI Test Generation"]
  #   types: [completed]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository to validate"
        required: true
        default: "https://github.com/DeviPrasad372002/flask-test-repo.git"
      coverage_threshold:
        description: "Minimum coverage threshold (%)"
        required: false
        default: "80"
  push:
    branches: [ test ]

defaults:
  run:
    shell: bash

concurrency:
  group: test-validation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      DATABASE_URL: "sqlite:///:memory:"
      DB_URL: "sqlite:///:memory:"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"   # <— prevent stray plugins from breaking collection

    steps:
      - name: Checkout this repo (workflows)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repository
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/flask-test-repo.git' }}"
          echo "Cloning ${REPO}"
          git clone --depth 1 "$REPO" target_repo
          echo "TARGET_ROOT=$PWD/target_repo" >> $GITHUB_ENV
          echo "PYTHONPATH=$PWD/target_repo:$PYTHONPATH" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev default-libmysqlclient-dev \
            libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev curl

      - name: Install tooling + project dependencies (generic)
        run: |
          set -e
          python -m pip install --upgrade pip wheel setuptools

          # Core testing/QA tools
          pip install \
            pytest pytest-cov pytest-html pytest-json-report pytest-xdist pytest-timeout pytest-mock \
            coverage WebTest requests httpx bandit flake8 mypy

          # Helper: replace psycopg2 -> psycopg2-binary (avoid native builds)
          replace_psycopg2() {
            sed -i 's/^\s*psycopg2\(\([^a-zA-Z0-9]\|$\)\)/psycopg2-binary\1/' "$1"
          }
          install_requirements() {
            local req="$1"
            [ -f "$req" ] || return 0
            cp "$req" /tmp/_req.txt
            replace_psycopg2 /tmp/_req.txt
            pip install -r /tmp/_req.txt || echo "Some packages from $req failed to install"
          }

          install_requirements "target_repo/requirements.txt"
          if compgen -G "target_repo/requirements/*.txt" >/dev/null; then
            for f in target_repo/requirements/*.txt; do install_requirements "$f"; done
          fi

          # Poetry/PDM/Pipenv (optional best-effort)
          if [ -f "target_repo/pyproject.toml" ] && grep -q "\[tool.poetry\]" target_repo/pyproject.toml; then
            pip install poetry || true
            (cd target_repo && poetry export -f requirements.txt --without-hashes -o /tmp/poetry.req) || true
            [ -s /tmp/poetry.req ] && replace_psycopg2 /tmp/poetry.req && pip install -r /tmp/poetry.req || true
          fi
          if [ -f "target_repo/pyproject.toml" ] && grep -q "\[tool.pdm\]" target_repo/pyproject.toml; then
            pip install pdm || true
            (cd target_repo && pdm export -o /tmp/pdm.req --without-hashes --dev) || true
            [ -s /tmp/pdm.req ] && replace_psycopg2 /tmp/pdm.req && pip install -r /tmp/pdm.req || true
          fi
          if [ -f "target_repo/Pipfile" ]; then
            pip install pipenv || true
            (cd target_repo && pipenv requirements > /tmp/pipenv.req) || true
            [ -s /tmp/pipenv.req ] && replace_psycopg2 /tmp/pipenv.req && pip install -r /tmp/pipenv.req || true
          fi

          # Editable install (best-effort)
          if [ -f "target_repo/setup.py" ] || [ -f "target_repo/setup.cfg" ]; then
            pip install -e target_repo || true
          fi

          # Ensure binary driver present
          pip install psycopg2-binary || true

      - name: Auto-reconcile legacy Flask stacks (pre-collection)
        run: |
          python - <<'PY'
          import sys, subprocess
          from packaging.version import Version
          try:
              from importlib.metadata import version, PackageNotFoundError
          except Exception:
              from importlib_metadata import version, PackageNotFoundError
          def v(pkg):
              try: return Version(version(pkg).split('+')[0])
              except PackageNotFoundError: return None
              except Exception: return None

          fsqa = v('Flask-SQLAlchemy') or v('flask_sqlalchemy')
          if fsqa and fsqa < Version("2.5"):
              # Old FSQA expects old Flask/Werkzeug APIs that were removed in 2.3
              pins = ["Flask<2.3", "Werkzeug<2.3", "itsdangerous<2.1", "Jinja2<3.1", "MarkupSafe<2.1"]
              print(f"Detected Flask-SQLAlchemy {fsqa}, applying compatibility pins: {pins}")
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--force-reinstall", *pins])
          PY

      - name: Create runtime compatibility shims
        run: |
          cd "$TARGET_ROOT"
          cat > sitecustomize.py << 'EOF'
          # Shim jinja2.Markup for old code that referenced it from jinja2
          try:
              import jinja2
              if not hasattr(jinja2, 'Markup'):
                  from markupsafe import Markup
                  jinja2.Markup = Markup
          except Exception:
              pass
          # Old collections ABC names for Python 3.10+
          try:
              import collections, collections.abc as abc
              for name in ['Mapping','MutableMapping','Sequence','Iterable']:
                  if not hasattr(collections, name) and hasattr(abc, name):
                      setattr(collections, name, getattr(abc, name))
          except Exception:
              pass
          EOF

      - name: Discover tests & coverage targets
        id: discover
        run: |
          set -e
          cd "$TARGET_ROOT"

          TEST_DIRS=()
          for d in tests test src/tests unit-tests; do
            [ -d "$d" ] && TEST_DIRS+=("$d")
          done
          TEST_DIR_ARGS="${TEST_DIRS[*]}"
          [ -z "$TEST_DIR_ARGS" ] && TEST_DIR_ARGS="."

          COV_ARGS=()
          while IFS= read -r pkg; do
            COV_ARGS+=("--cov=${pkg}")
          done < <(find . -maxdepth 2 -type f -name "__init__.py" \
                    | grep -E '^\./[^./]+/__init__\.py$' \
                    | sed -E 's#^\./([^/]+)/__init__\.py#\1#' \
                    | grep -vE '^(tests?|venv|env|.venv|.tox|build|dist)$' || true)
          [ ${#COV_ARGS[@]} -eq 0 ] && COV_ARGS+=(--cov=.)

          echo "test_dirs=$TEST_DIR_ARGS" >> $GITHUB_OUTPUT
          echo "cov_args=${COV_ARGS[*]}" >> $GITHUB_OUTPUT

      - name: Preflight — ensure clean collection (auto-fix if needed)
        run: |
          set +e
          cd "$TARGET_ROOT"
          TEST_DIRS="${{ steps.discover.outputs.test_dirs }}"
          echo "First collection attempt..."
          python -m pytest $TEST_DIRS --collect-only -q
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::warning::Collection failed (rc=$RC). Applying targeted fixes and retrying..."
            # Known failure: LocalStack.__ident_func__ (old Flask stack)
            pip install "Flask<2.3" "Werkzeug<2.3" "itsdangerous<2.1" "Jinja2<3.1" "MarkupSafe<2.1" || true
            # Retry collection
            set +e
            python -m pytest $TEST_DIRS --collect-only -q
            RC2=$?
            set -e
            if [ $RC2 -ne 0 ]; then
              echo "::error::Collection still failing after remediation. Please fix imports or adjust pins."
              exit $RC2
            fi
          fi
          echo "✅ Collection OK"

      - name: Create coverage config
        run: |
          cd "$TARGET_ROOT"
          cat > .coveragerc << 'EOF'
          [run]
          source = .
          omit =
              tests/*
              */tests/*
              */__pycache__/*
              */venv/*
              */env/*
              setup.py
              */site-packages/*
              sitecustomize.py
          [report]
          exclude_lines =
              pragma: no cover
              def __repr__
              raise AssertionError
              raise NotImplementedError
              if __name__ == .__main__.:
          EOF

      - name: Run tests (fail on collection errors)
        id: test-results
        env:
          PYTHONPATH: ${{ env.TARGET_ROOT }}
        run: |
          echo "Running tests..."
          mkdir -p reports/coverage reports/tests
          cd "$TARGET_ROOT"
          COV_ARGS="${{ steps.discover.outputs.cov_args }}"
          TEST_DIRS="${{ steps.discover.outputs.test_dirs }}"

          # Now run the full suite (no --continue-on-collection-errors)
          python -m pytest $TEST_DIRS \
            ${COV_ARGS} \
            --cov-report=html:../reports/coverage/html \
            --cov-report=xml:../reports/coverage/coverage.xml \
            --cov-report=json:../reports/coverage/coverage.json \
            --cov-report=term-missing \
            --html=../reports/tests/test-report.html \
            --json-report --json-report-file=../reports/tests/test-results.json \
            --tb=short \
            --timeout=300 \
            --maxfail=50 \
            --verbose \
            --junitxml=../reports/tests/junit.xml

          python - << 'EOF'
          import json, os
          from pathlib import Path
          results_file = Path('reports/tests/test-results.json')
          if results_file.exists():
              data = json.loads(results_file.read_text())
          else:
              data = {"summary": {"total": 0, "passed": 0, "failed": 0, "error": 0, "skipped": 0}}
          s = data.get("summary", {})
          total = int(s.get("total", 0) or 0)
          passed = int(s.get("passed", 0) or 0)
          failed = int(s.get("failed", 0) or 0)
          errors = int(s.get("error", 0) or 0)
          skipped = int(s.get("skipped", 0) or 0)
          pass_percentage = (passed / total * 100) if total > 0 else 0.0
          print("Test Execution Summary:")
          print(f"  Total: {total}\n  Passed: {passed}\n  Failed: {failed}\n  Errors: {errors}\n  Skipped: {skipped}\n  Pass Rate: {pass_percentage:.2f}%")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"tests-total={total}\n")
              f.write(f"tests-passed={passed}\n")
              f.write(f"tests-failed={failed + errors}\n")
              f.write(f"pass-percentage={pass_percentage:.2f}\n")
          EOF

      - name: Coverage summary
        id: coverage
        run: |
          python - << 'EOF'
          import os, json
          from pathlib import Path
          coverage_file = Path('reports/coverage/coverage.json')
          if coverage_file.exists():
              cov = json.loads(coverage_file.read_text())
              pct = float(cov.get("totals", {}).get("percent_covered", 0.0))
          else:
              pct = 0.0
          print(f"Overall Coverage: {pct:.2f}%")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"coverage-percentage={pct:.2f}\n")
          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "80"))
          if pct < threshold:
              print(f"Coverage {pct:.2f}% is below threshold {threshold}%")
          EOF

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-analysis-reports
          path: reports/
          retention-days: 30

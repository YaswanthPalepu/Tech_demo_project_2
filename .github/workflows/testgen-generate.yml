name: AI-TestGen — Generate Tests

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository URL to generate tests for"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"

concurrency:
  group: testgen-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
    env:
      # Azure OpenAI config
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"

      - name: Clone target repository
        run: |
          echo "Cloning ${{ steps.target.outputs.repo_url }}"
          git clone "${{ steps.target.outputs.repo_url }}" target-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore generation cache (skip if already generated for this snapshot)
        id: gen_cache
        uses: actions/cache@v4
        with:
          path: gen-cache
          key: ai-testgen-${{ hashFiles('target-repo/**', '!target-repo/tests/generated/**', '!.git/**') }}

      - name: Skip if cache hit
        if: steps.gen_cache.outputs.cache-hit == 'true'
        run: echo "✅ Tests already generated for this source snapshot (cache hit). Skipping."

      - name: Install target deps (only if not skipped)
        if: steps.gen_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          cd target-repo
          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt || true
          fi
          if [ -f "pyproject.toml" ]; then
            python -m pip install . || true
          fi

      # We only want generation here; don't let failures here block pipeline 2.
      - name: "Generate tests (Python: unit + integration + e2e)"
        if: steps.gen_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          # min-coverage=0 to avoid failing here; coverage enforced later
          python src/orchestrator.py \
            --target target-repo \
            --use-ai true \
            --min-coverage 0 \
            --max-files 50 || true

      - name: Mark cache HIT
        if: steps.gen_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p gen-cache
          echo "generated" > gen-cache/HIT

      - name: Write meta (repo URL used)
        run: |
          mkdir -p gen-meta
          echo "${{ steps.target.outputs.repo_url }}" > gen-meta/repo_url.txt

      - name: Upload generated tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            target-repo/tests/generated/**
          if-no-files-found: warn

      - name: Upload meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-meta
          path: gen-meta/**
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## Test Generation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gen_cache.outputs.cache-hit }}" = "true" ]; then
            echo "- Skipped: tests already generated for this snapshot ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Generated unit/integration/e2e tests ✨" >> $GITHUB_STEP_SUMMARY
            echo "- Artifacts: generated-tests, gen-meta" >> $GITHUB_STEP_SUMMARY
          fi

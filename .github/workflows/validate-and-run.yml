name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: ["test2"]

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write
    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set compatibility constraints
        shell: bash
        run: |
          printf "Django>=3.2,<4.3\ndjangorestframework>=3.12,<3.15\n" > /tmp/compat-constraints.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install runner tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" pytest pytest-cov pytest-timeout pytest-xdist coverage

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          CLEAN_URL="https://github.com/DeviPrasad372002/flask-test-repo.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"

      - name: Install project dependencies (requirements*.txt)
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          if compgen -G "requirements*.txt" >/dev/null; then
            grep -vE '(^-e|^git\+|^hg\+|^svn\+|^bzr\+|^file:)' requirements*.txt \
              | sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' \
              > /tmp/req.clean.txt
            [ -s /tmp/req.clean.txt ] && pip install -r /tmp/req.clean.txt || true
          fi

      - name: Detect frameworks (Flask/FastAPI) and Django settings (only if init works)
        id: detect
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, re, pathlib
          EXC={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}
          root=pathlib.Path('.').resolve()
          def files():
              for p in root.rglob('*.py'):
                  if any(part in EXC for part in p.parts): continue
                  yield p
          text=''
          for p in files():
              try: text += '\n' + p.read_text(encoding='utf-8', errors='ignore')
              except: pass

          needs_flask   = bool(re.search(r'(^|\n)\s*(from|import)\s+flask\b', text))
          needs_fastapi = bool(re.search(r'(^|\n)\s*(from|import)\s+fastapi\b', text) or re.search(r'(^|\n)\s*(from|import)\s+starlette\b', text))

          ds = ''
          django_ok = False
          try:
              import django
              cands=[]
              for p in files():
                  if p.name=='settings.py' and 'migrations' not in str(p.parent):
                      rel=p.relative_to(root)
                      mod='.'.join(rel.with_suffix('').parts)
                      cands.append((len(rel.parts), mod))
              if cands:
                  sys.path.insert(0, str(root))
                  for _,mod in sorted(cands):
                      try:
                          os.environ['DJANGO_SETTINGS_MODULE']=mod
                          django.setup()
                          ds = mod
                          django_ok = True
                          break
                      except Exception:
                          continue
          except Exception:
              django_ok = False

          print("Detect -> flask:", needs_flask, "fastapi:", needs_fastapi, "django:", django_ok, (ds or '(none)'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"needs_flask={'true' if needs_flask else 'false'}\n")
              f.write(f"needs_fastapi={'true' if needs_fastapi else 'false'}\n")
              f.write(f"is_django={'true' if django_ok else 'false'}\n")
              if django_ok: f.write(f"ds_module={ds}\n")
          PY

      - name: Install framework shims (only if detected)
        working-directory: target
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.needs_flask }}" = "true" ]; then
            pip install flask flask_sqlalchemy flask_migrate flask_cors flask_caching flask_jwt_extended flask_bcrypt flask_apispec marshmallow
          fi
          if [ "${{ steps.detect.outputs.needs_fastapi }}" = "true" ]; then
            pip install fastapi starlette pydantic
          fi

      - name: Infer & install missing imports from repo and tests
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, re, pathlib, subprocess, importlib.util, json
          root=pathlib.Path('.').resolve()
          EXC={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}

          aliases={
            "bs4":"beautifulsoup4","yaml":"PyYAML","cv2":"opencv-python","sklearn":"scikit-learn",
            "PIL":"Pillow","Crypto":"pycryptodome","MySQLdb":"mysqlclient","mysql":"mysqlclient",
            "psycopg2":"psycopg2-binary","httpx":"httpx","requests":"requests","uvicorn":"uvicorn",
            "fastapi":"fastapi","starlette":"starlette","pydantic":"pydantic","typing_extensions":"typing-extensions",
            "annotated_types":"annotated-types","sqlalchemy":"SQLAlchemy","flask":"flask","django":"Django",
            "click":"click","typer":"typer","jinja2":"Jinja2","ujson":"ujson","orjson":"orjson",
            "pymongo":"pymongo","redis":"redis","pytest":"pytest","jwt":"PyJWT","markupsafe":"MarkupSafe",
            "rest_framework":"djangorestframework","slugify":"python-slugify"
          }
          std = set(getattr(sys, "stdlib_module_names", set()))
          def is_local(top:str)->bool:
              if (root/(top+".py")).exists() or (root/top).is_dir(): return True
              return False
          mods=set()
          def scan(paths):
              for p in paths:
                  try: s=p.read_text(encoding='utf-8',errors='ignore')
                  except: continue
                  for m in re.findall(r'^\s*import\s+([A-Za-z_][\w\.]*)', s, flags=re.MULTILINE):
                      mods.add(m.split('.')[0])
                  for m in re.findall(r'^\s*from\s+([A-Za-z_][\w\.]*)\s+import\b', s, flags=re.MULTILINE):
                      mods.add(m.split('.')[0])
          files=[p for p in root.rglob('*.py') if not any(part in EXC for part in p.parts)]
          scan(files)
          need=[]
          for top in sorted(mods):
              if not top or top in std or is_local(top) or top.startswith('_'): continue
              if importlib.util.find_spec(top) is not None: continue
              need.append(aliases.get(top, top))
          if need:
              print("Installing:", ", ".join(need))
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-input", *need])
          else:
              print("No missing imports to install")
          PY

      - name: Enable pytest-django and set DJANGO_SETTINGS_MODULE
        if: steps.detect.outputs.is_django == 'true'
        working-directory: target
        shell: bash
        run: |
          pip install -c "$PIP_CONSTRAINT" pytest-django
          echo "DJANGO_SETTINGS_MODULE=${{ steps.detect.outputs.ds_module }}" >> $GITHUB_ENV
          echo "✅ Using Django settings: ${{ steps.detect.outputs.ds_module }}"

      - name: Prepare pytest.ini (print -ra)
        working-directory: target
        shell: bash
        run: |
          cat > pytest.ini <<'EOF'
          [pytest]
          addopts = -v -ra --tb=short
          python_files = test_*.py *_test.py *.test.py
          python_functions = test_*
          python_classes = Test*
          norecursedirs = .git .tox .env .venv venv env __pycache__ .pytest_cache build dist node_modules */site-packages/*
          EOF

      - name: Coverage config (prefer repo coverage.ini; fallback .coveragerc)
        shell: bash
        run: |
          if [ -f coverage.ini ]; then cp coverage.ini target/coverage.ini; fi
          cat > target/.coveragerc <<'EOF'
          [run]
          omit = */.venv/* */venv/* */env/* */site-packages/* */.tox/* */.pytest_cache/* */__pycache__/* */migrations/*
          EOF

      - name: Patch generated tests to avoid legacy skips & add jwt_optional shim
        working-directory: target
        shell: bash
        run: |
          if [ -d tests/generated ]; then
            # sanitize hard skips and private imports
            grep -Rl "_pytest.skip('generator: banned private imports" tests/generated | xargs -r sed -i '1,3d'
            grep -Rl "\b_pytest\b" tests/generated | xargs -r sed -i 's/\b_pytest\b/pytest/g'
            grep -Rl "pytest._code" tests/generated | xargs -r sed -i 's/pytest\._code/pytest/g'
            # ensure conftest with jwt_optional shim
            mkdir -p tests/generated
            cat >> tests/generated/conftest.py <<'PY'
          try:
              import flask_jwt_extended as _fje
              if not hasattr(_fje, "jwt_optional") and hasattr(_fje, "jwt_required"):
                  from flask_jwt_extended import jwt_required
                  def jwt_optional(fn=None, **kwargs):
                      dec = jwt_required(optional=True)
                      return dec(fn) if callable(fn) else dec
                  _fje.jwt_optional = jwt_optional
          except Exception:
              pass
          PY
          fi

      - name: Discover committed generated tests
        id: discover
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          root=pathlib.Path('.')
          files=[str(p) for p in (root/'tests'/'generated').rglob('test_*.py')]
          if files:
              out='/tmp/test_files.txt'
              open(out,'w').write('\n'.join(sorted(files)))
              print(f"✅ Found {len(files)} generated tests under tests/generated")
          else:
              print("❌ No generated tests found under tests/generated"); sys.exit(1)
          PY
          echo "test_files=/tmp/test_files.txt" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/target
          TARGET_ROOT: ${{ github.workspace }}/target
          FLASK_ENV: testing
          SECRET_KEY: test-secret
          DATABASE_URL: "sqlite:///:memory:"
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
        shell: bash
        run: |
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if [ "${{ steps.detect.outputs.is_django }}" = "true" ]; then
            PLUGINS="$PLUGINS -p pytest_django"
            export DJANGO_SETTINGS_MODULE="${{ steps.detect.outputs.ds_module }}"
          fi
          COVCFG_OPT=""
          if [ -f coverage.ini ]; then
            COVCFG_OPT="--cov-config=coverage.ini"
          elif [ -f .coveragerc ]; then
            COVCFG_OPT="--cov-config=.coveragerc"
          fi
          mapfile -t FILES < /tmp/test_files.txt
          pytest -v -ra --tb=short $PLUGINS $COVCFG_OPT \
            --cov=. \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --junitxml=reports/tests/junit.xml \
            --timeout=300 \
            "${FILES[@]}"

      - name: Parse metrics & gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          from xml.etree import ElementTree as ET

          cov_json = pathlib.Path('reports/tests/coverage.json')
          cov = 0.0
          if cov_json.exists():
              try:
                  cov = float(json.load(open(cov_json)).get('totals',{}).get('percent_covered',0.0))
              except Exception:
                  pass

          junit = pathlib.Path('reports/tests/junit.xml')
          pass_pct=fail_pct=0.0
          if junit.exists():
              root = ET.parse(junit).getroot()
              tests = int(root.attrib.get('tests', 0))
              failures = int(root.attrib.get('failures', 0))
              errors = int(root.attrib.get('errors', 0))
              skipped = int(root.attrib.get('skipped', root.attrib.get('disabled', 0)))
              if tests == 0:
                  for tc in root.iter('testcase'):
                      tests += 1
                      if tc.find('skipped') is not None: skipped += 1
                      elif tc.find('failure') is not None: failures += 1
                      elif tc.find('error') is not None: errors += 1
              run_total = max(0, tests - skipped)
              passed = max(0, run_total - failures - errors)
              pass_pct = (100.0 * passed / run_total) if run_total > 0 else 0.0
              fail_pct = (100.0 * (failures + errors) / run_total) if run_total > 0 else 0.0

          print(f"Pass% (excl skipped): {pass_pct:.2f}%")
          print(f"Fail% (excl skipped): {fail_pct:.2f}%")
          print(f"Coverage%: {cov:.2f}%")

          thr = float(os.environ.get('COVERAGE_THRESHOLD','70'))
          # Gate: fail if all tests skipped, or any failures/errors, or coverage below threshold
          ready = (pass_pct == 100.0) and (cov >= thr) and (pass_pct > 0.0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"pass_pct={pass_pct:.2f}\n")
              f.write(f"fail_pct={fail_pct:.2f}\n")
              f.write(f"ready={'true' if ready else 'false'}\n")
          sys.exit(0 if ready else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        shell: bash
        run: |
          echo "## CI Result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
            echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Tests failed, all skipped, or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**)." >> "$GITHUB_STEP_SUMMARY"
          fi

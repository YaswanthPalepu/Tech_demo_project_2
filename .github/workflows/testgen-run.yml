
name: AI-TestGen — Run & Deploy (AnyPy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate tests with orchestrator
        run: |
          python src/orchestrator.py --target . --use-ai true --min-coverage 80 --max-files 80 --only-generated true

      - name: Run all tests (including AI-generated)
        run: |
          pytest --cov=src --cov-report=xml

      - name: Check code coverage quality gate
        run: |
          # Parse coverage.xml for line-rate
          line_rate=$(xmllint --xpath 'string(//coverage/@line-rate)' coverage.xml)
          percent=$(awk "BEGIN {print $line_rate * 100}")
          echo "Code coverage is at ${percent}%"
          if (( $(echo "$percent < 80" | bc -l) )); then
            echo "Code coverage is below the 80% threshold. Failing the build."
            exit 1
          fi

      - name: Validate generated tests (Simulated)
        run: |
          echo "Simulating test validation against intentionally introduced bugs..."
          echo "Tests validated successfully."

      - name: Automated Deployment (Placeholder)
        if: success()
        run: |
          echo "All checks passed. Deploying the application..."
          # Your deployment commands would go here (e.g., to a cloud provider).

name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to analyze"
        required: true
        default: "https://github.com/DeviPrasad372002/flask-test-repo.git"
      force_gen:
        description: "Force generation even if no code changes detected"
        required: false
        default: "false"
      prompt_style:
        description: "TESTGEN_PROMPT_STYLE (ultra_bare recommended)"
        required: false
        default: "ultra_bare"
  push:
    branches: [ test ]

concurrency:
  group: test-gen-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AZURE_OPENAI_KEY:         ${{ secrets.AZURE_OPENAI_KEY         || secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT:    ${{ secrets.AZURE_OPENAI_ENDPOINT    || secrets.AZURE_OPENAI_API_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION || secrets.OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT:  ${{ secrets.AZURE_OPENAI_DEPLOYMENT  || secrets.OPENAI_DEPLOYMENT }}

      TESTGEN_PROMPT_STYLE: ${{ github.event.inputs.prompt_style || 'ultra_bare' }}

      # DB fallbacks for import-time engines (used only by RELAXED bootstrap; tests default to strict)
      DATABASE_URL: "sqlite:///:memory:"
      DB_URL: "sqlite:///:memory:"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"

      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

      TESTGEN_STRICT: "1"

    steps:
      - name: Checkout this repo (contains src/* and workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clone target repository into ./target
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/flask-test-repo.git' }}"
          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
          git clone --depth 1 "$REPO_URL" target

      - name: Derive OUTDIR, TARGET_ROOT and repo metadata
        id: meta
        run: |
          echo "TARGET_ROOT=target" >> $GITHUB_ENV
          REPO_SLUG="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s#[^A-Za-z0-9._-]#_#g')"
          REPO_PATH="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s/\.git$//')"
          OUTDIR="tests/generated/${REPO_SLUG}/current"
          mkdir -p "$OUTDIR"
          DEFAULT_BRANCH="$(git -C target remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"
          echo "REPO_SLUG=$REPO_SLUG"       >> $GITHUB_ENV
          echo "OUTDIR=$OUTDIR"             >> $GITHUB_ENV
          echo "REPO_PATH=$REPO_PATH"       >> $GITHUB_ENV
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV
          echo "repo_slug=$REPO_SLUG"       >> $GITHUB_OUTPUT
          echo "outdir=$OUTDIR"             >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH"       >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system build tools (for native wheels)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev default-libmysqlclient-dev \
            libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev curl

      # Install EXACTLY what the target repo declares
      - name: Install target repository dependencies (respect pins/locks; auto-fix psycopg2)
        run: |
          set -e
          cd target
          python -m pip install --upgrade pip wheel setuptools

          REQ_FILES=()

          if [ -f "Pipfile.lock" ] || [ -f "Pipfile" ]; then
            pip install pipenv || true
            pipenv requirements > /tmp/req.pipenv.txt || true
            [ -s /tmp/req.pipenv.txt ] && REQ_FILES+=("/tmp/req.pipenv.txt")
          fi

          if [ -f "pyproject.toml" ] && grep -q "\[tool.poetry\]" pyproject.toml; then
            pip install poetry || true
            poetry export -f requirements.txt --without-hashes -o /tmp/req.poetry.txt || true
            [ -s /tmp/req.poetry.txt ] && REQ_FILES+=("/tmp/req.poetry.txt")
          fi

          if [ -f "pyproject.toml" ] && grep -q "\[tool.pdm\]" pyproject.toml; then
            pip install pdm || true
            pdm export -o /tmp/req.pdm.txt --without-hashes --dev || true
            [ -s /tmp/req.pdm.txt ] && REQ_FILES+=("/tmp/req.pdm.txt")
          fi

          if ls requirements/*.txt >/dev/null 2>&1; then
            for f in requirements/*.txt; do REQ_FILES+=("$f"); done
          fi
          [ -f "requirements.txt" ] && REQ_FILES+=("requirements.txt")

          if [ "${#REQ_FILES[@]}" -eq 0 ]; then
            echo "No explicit requirement files found."
          else
            echo "Installing from requirement sources (with psycopg2 fix):"
            for rf in "${REQ_FILES[@]}"; do
              echo "Processing $rf"
              # Replace psycopg2 pin with psycopg2-binary
              sed -E 's/^psycopg2([^a-zA-Z0-9._-]|$)/psycopg2-binary\1/' "$rf" > /tmp/req.fixed.txt
              pip install -r /tmp/req.fixed.txt
            done
          fi

          if [ -f "setup.py" ] || [ -f "setup.cfg" ] || [ -f "pyproject.toml" ]; then
            pip install -e .
          fi


      - name: Freeze environment as constraints for any extra installs
        run: |
          pip freeze > /tmp/final.constraints.txt
          echo "PIP_CONSTRAINT=/tmp/final.constraints.txt" >> $GITHUB_ENV
          echo "TESTGEN_PIP_CONSTRAINTS=/tmp/final.constraints.txt" >> $GITHUB_ENV
          echo "Created constraints snapshot:"
          head -n 40 /tmp/final.constraints.txt || true

      - name: Install minimal tooling (constrained; won’t upgrade project deps)
        run: |
          # only-if-needed prevents unintentional upgrades; constraints forbid drift
          python -m pip install --upgrade-strategy only-if-needed -c /tmp/final.constraints.txt pytest pytest-cov "openai>=1.51.0"

      - name: Show key package versions (debug)
        run: |
          python - <<'PY'
          import importlib
          pkgs = ["flask","django","werkzeug","jinja2","markupsafe","itsdangerous","click",
                  "flask_sqlalchemy","flask_migrate","sqlalchemy","pytest","openai"]
          for n in pkgs:
              try:
                  m = importlib.import_module(n)
                  print(f"{n}=={getattr(m,'__version__','unknown')}")
              except Exception as e:
                  print(f"{n}: not installed ({e})")
          PY

      - name: Analyze target codebase -> /tmp/analysis.json
        run: |
          python -m src.analyzer --root target > /tmp/analysis.json

      - name: Generate tests (smart change detection; generator respects constraints)
        env:
          TARGET_ROOT: target
          FORCE: ${{ github.event.inputs.force_gen || 'false' }}
          TESTGEN_PIP_CONSTRAINTS: /tmp/final.constraints.txt
        run: |
          python - <<'PY'
          import os, json
          import src.generator as g
          analysis = json.load(open('/tmp/analysis.json'))
          outdir = os.environ['OUTDIR']
          if (os.environ.get('FORCE','false').lower()=='true'):
              os.environ['TESTGEN_FORCE'] = 'true'
          g.generate_all(analysis, outdir=outdir, focus_files=None)
          PY

      - name: List generated tests
        run: |
          echo "Listing ${OUTDIR}"
          ls -lah "${OUTDIR}" || true
          echo "Preview .py files:"
          find "${OUTDIR}" -type f -name 'test_*.py' | sed 's/^/ - /' || true

      - name: Upload generated tests as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-${{ steps.meta.outputs.repo_slug }}
          path: ${{ steps.meta.outputs.outdir }}

      - name: Copy generated tests into target repo
        run: |
          mkdir -p target/tests/generated
          cp -r "${OUTDIR}"/* target/tests/generated/ || true
          echo "Final tests copied into target repo:"
          find target/tests/generated -name "test_*.py" | head -20

      - name: Commit & push generated tests to target repo (if token present)
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 }}
        run: |
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$GH_PAT3" ]; then
            echo "GH_PAT3 not set — skipping push step."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GH_PAT3}@github.com/${REPO_PATH}.git"
          git add tests/generated || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(testgen): update generated tests [skip ci]" || true
          git pull --rebase origin "${DEFAULT_BRANCH}" || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

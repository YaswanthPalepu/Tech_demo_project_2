name: AI-TestGen — Run & Coverage (AnyPy)

on:
  workflow_run:
    workflows: ["AI-TestGen — Generate Tests (AnyPy)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository URL to run tests for (manual override)"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"


concurrency:
  group: anypy-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Download meta
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: gen-meta
          path: gen-meta

      - name: Download generated tests
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: generated-tests
          path: generated-tests

      - name: Resolve target repository URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repo_url=${{ github.event.inputs.repo_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo_url=$(cat gen-meta/repo_url.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone target repository
        run: git clone "${{ steps.target.outputs.repo_url }}" target-repo

      - name: Inject generated tests
        run: |
          mkdir -p target-repo/tests/generated
          if [ -d "generated-tests" ]; then
            cp -r generated-tests/* target-repo/tests/generated/ || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps (framework helpers)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov coverage pytest-django asgiref
          if [ -f "target-repo/requirements.txt" ]; then python -m pip install -r target-repo/requirements.txt || true; fi
          if [ -f "target-repo/pyproject.toml" ]; then python -m pip install ./target-repo || true; fi

      - name: Run ONLY generated tests with coverage
        working-directory: target-repo
        run: |
          mkdir -p ../artifacts/coverage ../artifacts/test-results
          python -m pytest -q tests/generated \
            --junitxml ../artifacts/test-results/junit.xml \
            --cov . --cov-report xml:../artifacts/coverage/coverage.xml

      - name: Summarize coverage & failures
        run: |
          python - << 'PY'
          import xml.etree.ElementTree as ET, pathlib
          cov = pathlib.Path("artifacts/coverage/coverage.xml")
          junit = pathlib.Path("artifacts/test-results/junit.xml")
          print("## Generated Tests — Run Summary")
          if cov.exists():
              r = ET.parse(cov).getroot()
              rate = float(r.attrib.get("line-rate","0"))*100
              print(f"- **Line coverage:** {rate:.1f}%")
          else:
              print("- **Line coverage:** n/a")
          if junit.exists():
              jr = ET.parse(junit).getroot()
              fails = 0
              for tc in jr.findall(".//testcase"):
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      fails += 1
              print(f"- **Failures:** {fails}")
          PY >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anypy-run-artifacts
          path: |
            artifacts/coverage/**
            artifacts/test-results/**

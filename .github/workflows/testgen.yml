name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to analyze"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Azure OpenAI creds (fallback to alternative names if you used them)
      AZURE_OPENAI_KEY:         ${{ secrets.AZURE_OPENAI_KEY         || secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT:    ${{ secrets.AZURE_OPENAI_ENDPOINT    || secrets.AZURE_OPENAI_API_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION || secrets.OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT:  ${{ secrets.AZURE_OPENAI_DEPLOYMENT  || secrets.OPENAI_DEPLOYMENT }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone target repository (without .git)
        run: |
          REPO="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          git clone --depth 1 "$REPO" target
          # Copy everything EXCEPT the .git dir (keep our authenticated remote)
          rsync -a --exclude ".git" target/ ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          # Ensure tools even if the target repo lacks them
          pip install "openai>=1.51.0" pytest pytest-cov httpx

      - name: Generate tests
        run: |
          python -m src.analyzer > /tmp/analysis.json
          python - <<'PY'
          import json, src.generator as g
          analysis = json.load(open('/tmp/analysis.json'))
          g.generate_all(analysis, outdir='tests/generated')
          PY

      - name: List generated tests
        run: ls -lah tests/generated || true

      - name: Quick validation run
        run: python -m src.validator

      - name: Package generated tests as zip
        run: |
          mkdir -p dist
          zip -r "dist/generated-tests-${{ github.run_id }}.zip" tests/generated /tmp/analysis.json || true

      - name: Upload generated tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-${{ github.run_id }}
          path: |
            tests/generated/**
            dist/generated-tests-${{ github.run_id }}.zip

      - name: Commit generated tests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tests/generated || true
          git commit -m "chore: auto-generate tests [skip ci]" || echo "no changes"
          git push

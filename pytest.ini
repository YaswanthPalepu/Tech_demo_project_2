[tool:pytest]
testpaths = tests/generated
addopts = 
    -v
    --tb=short
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    -p no:warnings
    -p no:django
    -p no:asyncio

python_files = test_*.py
python_functions = test_*

[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */.venv/*

[coverage:report]
show_missing = true

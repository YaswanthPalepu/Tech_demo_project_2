name: Validate Generated Tests (CI Gate)

on:
  workflow_run:
    workflows: ["AI Test Generation"]
    types: [completed]

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set compatibility constraints
        shell: bash
        run: |
          printf "Django>=3.2,<4.3\ndjangorestframework>=3.12,<3.15\n" > /tmp/compat-constraints.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install runner tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" pytest pytest-cov pytest-timeout pytest-xdist coverage

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          CLEAN_URL="https://github.com/DeviPrasad372002/flask-test-repo.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          git clone --depth=1 "$CLEAN_URL" target
          echo "✅ cloned into ./target"

      - name: Install project dependencies (safe/agnostic)
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          if compgen -G "requirements*.txt" >/dev/null; then
            grep -vE '(^-e|^git\+|^hg\+|^svn\+|^bzr\+|^file:)' requirements*.txt \
              | sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' \
              > /tmp/req.clean.txt
            [ -s /tmp/req.clean.txt ] && pip install -r /tmp/req.clean.txt || true
          fi

      - name: Detect framework(s)
        id: detect
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, re, pathlib
          EXC={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}
          root=pathlib.Path('.').resolve()
          def files():
              for p in root.rglob('*.py'):
                  if any(part in EXC for part in p.parts): continue
                  yield p
          text=''
          for p in files():
              try: text += '\n' + p.read_text(encoding='utf-8', errors='ignore')
              except: pass

          needs_flask   = bool(re.search(r'(^|\n)\s*(from|import)\s+flask\b', text))
          needs_fastapi = bool(re.search(r'(^|\n)\s*(from|import)\s+fastapi\b', text) or re.search(r'(^|\n)\s*(from|import)\s+starlette\b', text))

          # Robust Django settings probe (only mark true if setup succeeds)
          ds = ''
          ok = False
          try:
              import django
              # find candidate settings.py
              cands=[]
              for p in files():
                  if p.name=='settings.py' and 'migrations' not in str(p.parent):
                      rel=p.relative_to(root)
                      mod='.'.join(rel.with_suffix('').parts)
                      cands.append((len(rel.parts), mod))
              if cands:
                  sys.path.insert(0, str(root))
                  for _,mod in sorted(cands):
                      try:
                          os.environ['DJANGO_SETTINGS_MODULE']=mod
                          django.setup()
                          ds = mod
                          ok = True
                          break
                      except Exception:
                          continue
          except Exception:
              ok = False

          print("Detect -> flask:", needs_flask, "fastapi:", needs_fastapi, "django:", ok, (ds or '(none)'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"needs_flask={'true' if needs_flask else 'false'}\n")
              f.write(f"needs_fastapi={'true' if needs_fastapi else 'false'}\n")
              f.write(f"is_django={'true' if ok else 'false'}\n")
              if ok: f.write(f"ds_module={ds}\n")
          PY

      - name: Install framework shims (only if detected)
        working-directory: target
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.needs_flask }}" = "true" ]; then
            pip install flask
          fi
          if [ "${{ steps.detect.outputs.needs_fastapi }}" = "true" ]; then
            pip install fastapi starlette pydantic
          fi

      - name: Enable pytest-django and set DJANGO_SETTINGS_MODULE
        if: steps.detect.outputs.is_django == 'true'
        working-directory: target
        shell: bash
        run: |
          pip install -c "$PIP_CONSTRAINT" pytest-django
          echo "DJANGO_SETTINGS_MODULE=${{ steps.detect.outputs.ds_module }}" >> $GITHUB_ENV
          echo "✅ Using Django settings: ${{ steps.detect.outputs.ds_module }}"

      - name: Prepare pytest.ini
        working-directory: target
        shell: bash
        run: |
          cat > pytest.ini <<'EOF'
          [pytest]
          addopts = -v --tb=short
          python_files = test_*.py *_test.py *.test.py
          python_functions = test_*
          python_classes = Test*
          norecursedirs = .git .tox .env .venv venv env __pycache__ .pytest_cache build dist node_modules */site-packages/*
          EOF

      - name: Write .coveragerc
        working-directory: target
        shell: bash
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          omit = */.venv/* */venv/* */env/* */site-packages/* */.tox/* */.pytest_cache/* */__pycache__/* */migrations/*
          EOF

      - name: Run migrations if Django (safe)
        if: steps.detect.outputs.is_django == 'true'
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/target
          DJANGO_SETTINGS_MODULE: ${{ steps.detect.outputs.ds_module }}
        shell: bash
        run: |
          set -e
          echo "Running Django migrations for ${DJANGO_SETTINGS_MODULE}"
          python - <<'PY'
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', os.environ['DJANGO_SETTINGS_MODULE'])
          try:
              django.setup()
              from django.conf import settings
              engine = (getattr(settings,'DATABASES',{}).get('default',{}).get('ENGINE','') or '')
              if not engine or engine == 'django.db.backends.dummy':
                  print("⏭️  Skipping migrations: no real DB engine configured.")
              else:
                  from django.core.management import call_command
                  call_command('migrate', interactive=False, verbosity=0)
                  print("✅ migrate done")
          except Exception as e:
              print("⏭️  Skipping migrations probe failed:", e)
          PY

      - name: Discover test files (non-fatal)
        id: discover
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          EXC={'.git','.venv','venv','env','.tox','.pytest_cache','node_modules','site-packages','__pycache__'}
          root=pathlib.Path('.')
          tests=[]
          for p in root.rglob('*.py'):
            if any(part in EXC for part in p.parts):
              continue
            n=p.name
            if n.startswith('test_') or n.endswith('_test.py') or n.endswith('.test.py'):
              tests.append(str(p))
          if tests:
            out='/tmp/test_files.txt'
            open(out,'w').write('\n'.join(sorted(tests)))
            print(f"✅ Will run pytest on {len(tests)} files")
          else:
            print("ℹ️ No explicit list. Pytest will auto-discover (e.g., tests/generated/*.py).")
          PY

      - name: Run tests with coverage
        id: run
        working-directory: target
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}/target
          TARGET_ROOT: ${{ github.workspace }}/target
        shell: bash
        run: |
          mkdir -p reports/tests
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if [ "${{ steps.detect.outputs.is_django }}" = "true" ]; then
            PLUGINS="$PLUGINS -p pytest_django"
            export DJANGO_SETTINGS_MODULE="${{ steps.detect.outputs.ds_module }}"
          fi
          if [ -s /tmp/test_files.txt ]; then
            mapfile -t FILES < /tmp/test_files.txt
            pytest -v --tb=short $PLUGINS \
              --cov=. --cov-config=.coveragerc \
              --cov-report=xml:reports/tests/coverage.xml \
              --cov-report=json:reports/tests/coverage.json \
              --cov-report=term-missing \
              --timeout=300 \
              "${FILES[@]}"
          else
            pytest -v --tb=short $PLUGINS \
              --cov=. --cov-config=.coveragerc \
              --cov-report=xml:reports/tests/coverage.xml \
              --cov-report=json:reports/tests/coverage.json \
              --cov-report=term-missing \
              --timeout=300
          fi

      - name: Parse coverage & gate
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          p=pathlib.Path('reports/tests/coverage.json')
          cov=0.0
          if p.exists():
              try: cov=float(json.load(open(p)).get('totals',{}).get('percent_covered',0.0))
              except: pass
          thr=float(os.environ.get('COVERAGE_THRESHOLD','70'))
          tests_ok='${{ steps.run.outcome }}'=='success'
          ok=(cov>=thr) and tests_ok
          print(f"Coverage={cov:.2f}%, Thr={thr}, TestsOk={tests_ok}, Gate={'OK' if ok else 'FAIL'}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"coverage={cov:.2f}\nready={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        shell: bash
        run: |
          echo "## CI Result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
            echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**)." >> "$GITHUB_STEP_SUMMARY"
          fi

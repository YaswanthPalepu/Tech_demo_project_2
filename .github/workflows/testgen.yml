name: Generate AI Tests for External Repo

on:
  push:
    branches: [local]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo of the target codebase"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      target_branch:
        description: "Branch to write to"
        default: "local"
      python_version:
        description: "Python version"
        default: "3.12"

permissions:
  contents: write
  pull-requests: write

env:
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  GH_PAT: ${{ secrets.GH_PAT3 }}

jobs:
  generate:
    runs-on: self-hosted
    env:
      TARGET_REPO: ${{ github.event.inputs.target_repo || github.repository }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}
      PY_VER: ${{ github.event.inputs.python_version || '3.12' }}
    steps:
      - name: Checkout ai-testgen repo (this)
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.GH_PAT }}
          path: target

      - name: Allow git in self-hosted workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/target"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Create venv and install deps (no system pip)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip setuptools wheel
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi
          # Ensure test deps
          .venv/bin/pip install pytest pytest-cov

      - name: Run analyzer + generator against target
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          PYTHONPATH: ${{ github.workspace }}/target
          TESTGEN_FORCE: "true"
        run: |
          .venv/bin/python -m src.gen --target "$TARGET_ROOT" --outdir "$TARGET_ROOT/tests/generated"

      - name: Show generated tests
        run: |
          ls -al target/tests/generated || true

      - name: Commit changes to same branch
        working-directory: target
        env:
          GIT_AUTHOR_NAME: ai-testgen-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: ai-testgen-bot
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add tests/generated || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(tests): AI-generated tests [skip ci]"
          git push origin HEAD:${{ env.TARGET_BRANCH }}

name: External Repository CI Pipeline

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository URL to test"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      branch:
        description: "Branch to test"
        required: false
        default: "main"
  push:
    branches: ["test2"]

jobs:
  test-external-repo:
    runs-on: self-hosted
    env:
      COVERAGE_THRESHOLD: "70"

    steps:
      - name: Checkout CI pipeline code
        uses: actions/checkout@v4

      - name: Resolve inputs and normalize URL
        id: cfg
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        run: |
          # repo url
          if [ -n "${{ github.event.inputs.target_repo }}" ]; then
            REPO_URL="${{ github.event.inputs.target_repo }}"
          else
            REPO_URL="https://github.com/DeviPrasad372002/django-test-app.git"
          fi
          # branch
          BR="${{ github.event.inputs.branch }}"
          [ -z "$BR" ] && BR="main"
          # normalize https url
          CLEAN="$REPO_URL"
          [[ "$CLEAN" == git@* ]] && CLEAN="https://github.com/${CLEAN#git@github.com:}"
          [[ "$CLEAN" != https://* ]] && CLEAN="https://github.com/$CLEAN"
          [[ "$CLEAN" != *.git ]] && CLEAN="${CLEAN}.git"
          # auth for clone if token available
          CLONE_URL="$CLEAN"
          if [ -n "$GH_PAT" ]; then
            CLONE_URL="${CLEAN/https:\/\//https://x-access-token:${GH_PAT}@}"
          fi
          # slug for artifact names
          SLUG="$(basename -s .git "$CLEAN")"
          echo "repo_url=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "clone_url=$CLONE_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Using repo: $CLEAN on branch: $BR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core test tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install pytest pytest-cov pytest-timeout pytest-xdist coverage requests httpx pytest-django

      - name: Clone target repository
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.cfg.outputs.branch }}" \
            "${{ steps.cfg.outputs.clone_url }}" target-repo
          echo "✅ Cloned ${{ steps.cfg.outputs.repo_url }} -> ./target-repo"

      - name: Install target repo dependencies
        working-directory: target-repo
        shell: bash
        run: |
          set -e
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          for f in requirements-*.txt requirements_dev.txt dev-requirements.txt test-requirements.txt; do
            [ -f "$f" ] && pip install -r "$f" || true
          done
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Write pytest.ini (broad discovery)
        working-directory: target-repo
        shell: bash
        run: |
          cat > pytest.ini <<'INI'
          [pytest]
          python_files = test_*.py *_test.py *test*.py
          python_classes = Test* *Tests
          python_functions = test_* *_test test*
          markers =
              django_db: mark tests that access the Django DB
          addopts =
          INI
                    cat pytest.ini

      - name: Write .coveragerc
        working-directory: target-repo
        shell: bash
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          omit =
              */.venv/*
              */venv/*
              */env/*
              */site-packages/*
              */.tox/*
              */.pytest_cache/*
              */__pycache__/*
          EOF
                    cat .coveragerc

      - name: Auto Django conftest (safe)
        working-directory: target-repo
        shell: bash
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            cat > conftest.py <<'PY'
          import os, sys, pathlib
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          # Only set DJANGO_SETTINGS_MODULE. Do not call django.setup() here.
          for s in ROOT.rglob('settings.py'):
              if 'migration' not in str(s):
                  rel = s.relative_to(ROOT).with_suffix('')
                  os.environ.setdefault('DJANGO_SETTINGS_MODULE', '.'.join(rel.parts))
                  break
          PY
                      echo "✅ Wrote Django conftest.py"
                    else
                      echo "ℹ️ No Django settings.py detected; skipping conftest."
                    fi

      - name: Discover test roots
        id: discover
        working-directory: target-repo
        shell: bash
        run: |
          set -e
          mapfile -t DIRS < <(
            find . \
              \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
              -type d \( -iname "tests" -o -iname "test" \) -print | sort -u
          )
          if [ ${#DIRS[@]} -eq 0 ]; then
            mapfile -t DIRS < <(
              find . \
                \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
                -type f \( -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" \) \
                -printf '%h\n' | sort -u
            )
          fi
          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "❌ No tests found."
            exit 1
          fi
          printf '%s\n' "${DIRS[@]}" > /tmp/test_dirs.txt
          echo "Test roots:"; sed 's/^/ - /' /tmp/test_dirs.txt

      - name: Run tests with coverage
        id: run_tests
        working-directory: target-repo
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          set -e
          mkdir -p reports
          PLUGINS="-p pytest_cov -p pytest_timeout"
          if find . -name "settings.py" -type f | grep -q .; then
            PLUGINS="$PLUGINS -p pytest_django.plugin"
          fi
          mapfile -t TEST_DIRS < /tmp/test_dirs.txt
          echo "Running pytest in:"; printf ' - %s\n' "${TEST_DIRS[@]}"
          set +e
          pytest -v --tb=short --maxfail=50 \
            $PLUGINS \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            "${TEST_DIRS[@]}"
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Check coverage
        id: coverage_check
        working-directory: target-repo
        shell: bash
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET, os
          thr = float(os.environ.get("COVERAGE_THRESHOLD","70"))
          pct = 0.0
          try:
              root = ET.parse("reports/coverage.xml").getroot()
              pct = float(root.get("line-rate","0")) * 100.0
          except Exception:
              pct = 0.0
          print(f"Coverage: {pct:.2f}% (threshold {thr:.2f}%)")
          ok = pct >= thr
          # write outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"coverage_percent={pct:.2f}\n")
              f.write(f"coverage_met={'true' if ok else 'false'}\n")
          sys.exit(0 if ok else 1)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ steps.cfg.outputs.slug }}-${{ github.run_number }}
          path: target-repo/reports/
          retention-days: 7

      - name: Project ready for deployment
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "🎉 EXTERNAL REPOSITORY CI COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "📦 Target Repository: ${{ steps.cfg.outputs.repo_url }}"
          echo "🌿 Branch: ${{ steps.cfg.outputs.branch }}"
          echo "✅ All tests passed"
          echo "📊 Code coverage: ${{ steps.coverage_check.outputs.coverage_percent }}%"
          echo "🎯 Coverage threshold: $COVERAGE_THRESHOLD% met"
          echo "🔗 Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=========================================="

      - name: Notify failure
        if: failure()
        shell: bash
        run: |
          echo "❌ External Repository CI Pipeline Failed!"
          echo "Target Repository: ${{ steps.cfg.outputs.repo_url }}"
          echo "Coverage: ${{ steps.coverage_check.outputs.coverage_percent || '0' }}% (required: $COVERAGE_THRESHOLD%)"
          echo "Check artifacts for test results."
          echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Validate Generated Tests (CI Gate)

on:
  # workflow_run:
  #   workflows: ["AI Test Generation"]
  #   types: [completed]
  #   branches: ["test2"]
  push:
    branches:
      - test2

  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate (fallback if no handoff artifact)"
        required: false
        default: ""

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      TESTGEN_ENABLE_DJANGO_BOOTSTRAP: "1"
      PIP_CONSTRAINT: /tmp/compat-constraints.txt

    steps:
      - uses: actions/checkout@v4

      # Pull the handoff (Repo URL) from upstream generation run when triggered by workflow_run
      - name: Download handoff artifact (from upstream run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: handoff-meta
          run-id: ${{ github.event.workflow_run.id }}
          path: handoff
        continue-on-error: true

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          set -e
          HANDOFF="handoff/handoff.json"
          INPUT_URL="${{ github.event.inputs.repo_url }}"
          CURR_REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          if [ -f "$HANDOFF" ]; then
            REPO_URL=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("repo_url",""))' "$HANDOFF")
          fi
          if [ -z "${REPO_URL:-}" ]; then REPO_URL="$INPUT_URL"; fi
          if [ -z "$REPO_URL" ]; then REPO_URL="$CURR_REPO"; fi
          if [ -z "$REPO_URL" ] && git remote get-url origin >/dev/null 2>&1; then
            REPO_URL="$(git remote get-url origin)"
          fi
          if [ -z "$REPO_URL" ]; then
            echo "No repo_url available from handoff, inputs, or context."
            exit 1
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved repo_url: $REPO_URL"

      - name: Set compatibility constraints
        run: |
          cat > /tmp/compat-constraints.txt <<'EOF'
          Django>=3.2,<4.3
          djangorestframework>=3.12,<3.15
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" \
            pytest pytest-cov pytest-timeout pytest-html \
            pytest-django pytest-flask pytest-xdist \
            coverage httpx requests

      - name: Clone target repo (with generated tests)
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO_URL='${{ steps.target.outputs.repo_url }}'
          echo "Cloning: $REPO_URL"
          CLEAN_URL="$REPO_URL"
          [[ "$CLEAN_URL" == git@* ]] && CLEAN_URL="https://github.com/${CLEAN_URL#git@github.com:}"
          [[ "$CLEAN_URL" != https://* ]] && CLEAN_URL="https://github.com/$CLEAN_URL"
          [[ "$CLEAN_URL" != *.git ]] && CLEAN_URL="${CLEAN_URL}.git"
          if [ -n "$GH_PAT3" ]; then
            CLEAN_URL="${CLEAN_URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          git clone --depth=1 "$CLEAN_URL" target

      - name: Safe, repo-agnostic dependency install
        working-directory: target
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install -c "$PIP_CONSTRAINT" "typing-extensions>=4.8" "uvicorn>=0.23" "pydantic>=2" "starlette>=0.37" || true

          sanitize_and_install() {
            local req_file="$1"
            [ -f "$req_file" ] || return 0
            echo "Sanitizing $req_file"
            sed -E 's/^psycopg2([^a-zA-Z0-9]|$)/psycopg2-binary\1/i' "$req_file" \
              | grep -viE '^[[:space:]]*(django|djangorestframework)\b' \
              > /tmp/req.candidate.txt
            awk '
              /^[[:space:]]*$/ {next}
              /^[[:space:]]*#/ {next}
              /^[[:space:]]*-/ {next}
              /^[[:space:]]*--/ {next}
              /^\-e[[:space:]]/ {next}
              /^git\+|^hg\+|^svn\+|^bzr\+/ {next}
              /^file:/ {next}
              {print}
            ' /tmp/req.candidate.txt > /tmp/req.clean.txt

            : > /tmp/req.final.txt
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              if python - <<PY >/dev/null 2>&1
              import sys, subprocess, shlex
              pkg=sys.argv[1]
              cmd=f"python -m pip index versions {shlex.quote(pkg)}"
              sys.exit(subprocess.call(cmd, shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL))
              PY
              "$pkg"; then
                              echo "$pkg" >> /tmp/req.final.txt
                            else
                              echo "⏭️  Skip non-resolvable: $pkg"
              fi
            done < /tmp/req.clean.txt

            if [ -s /tmp/req.final.txt ]; then
              pip install -c "$PIP_CONSTRAINT" -r /tmp/req.final.txt || true
            fi
          }

          sanitize_and_install "requirements.txt"
          if compgen -G "requirements/*.txt" >/dev/null; then
            for f in requirements/*.txt; do sanitize_and_install "$f"; done
          fi

          if [ -f pyproject.toml ] && grep -q "\[tool.poetry\]" pyproject.toml; then
            pip install -c "$PIP_CONSTRAINT" poetry || true
            poetry export -f requirements.txt --without-hashes -o /tmp/poetry.lock.req || true
            [ -s /tmp/poetry.lock.req ] && sanitize_and_install /tmp/poetry.lock.req
          fi

          if [ -f pyproject.toml ] && grep -q "\[tool.pdm\]" pyproject.toml; then
            pip install -c "$PIP_CONSTRAINT" pdm || true
            pdm export -o /tmp/pdm.lock.req --without-hashes --dev || true
            [ -s /tmp/pdm.lock.req ] && sanitize_and_install /tmp/pdm.lock.req
          fi

          # If Django project, force a compatible pair
          if find . -name "settings.py" -type f | grep -q .; then
            pip install -c "$PIP_CONSTRAINT" "Django>=3.2,<4.3" "djangorestframework>=3.12,<3.15"
          fi

      - name: Auto Django conftest (if Django project)
        working-directory: target
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            cat > conftest.py <<'EOF'
          import os, sys, pathlib, pytest
          ROOT = pathlib.Path(__file__).resolve().parent
          if str(ROOT) not in sys.path: sys.path.insert(0, str(ROOT))
          def setup_django():
              try:
                  import django
                  from django.conf import settings
                  if not settings.configured:
                      for s in ROOT.rglob('settings.py'):
                          if 'migration' not in str(s):
                              rel = s.relative_to(ROOT).with_suffix('')
                              os.environ['DJANGO_SETTINGS_MODULE']='.'.join(rel.parts)
                              break
                      django.setup()
              except Exception as e:
                  print(f"⚠️ Django setup warning: {e}")
          setup_django()
          def pytest_configure(config):
              config.addinivalue_line("markers", "generated: AI-generated tests")
          EOF
          fi

      - name: Discover tests
        id: collect
        working-directory: target
        run: |
          python - <<'PY'
          import pathlib, ast, json, sys
          def excluded(p):
              ex={'venv','.venv','env','.env','site-packages','node_modules','.git','.pytest_cache','__pycache__','build','dist','.tox'}
              return any(x in pathlib.Path(p).parts for x in ex)
          root=pathlib.Path('.')
          files=set()
          for pat in ('test_*.py','*_test.py'):
              for f in root.rglob(pat):
                  s=str(f)
                  if not excluded(s):
                      try:
                          ast.parse(f.read_text(encoding='utf-8', errors='ignore'))
                          files.add(s)
                      except SyntaxError:
                          pass
          targets=sorted(files)
          if not targets:
              print("No tests discovered"); sys.exit(1)
          pathlib.Path("reports/tests").mkdir(parents=True, exist_ok=True)
          open('/tmp/test_targets.txt','w').write(' '.join(f'"{t}"' for t in targets))
          print(f"Collected {len(targets)} test files")
          print(json.dumps(targets[:25], indent=2))
          PY

      - name: Run tests with coverage (CI gate)
        id: run
        working-directory: target
        env:
            PYTEST_DISABLE_PLUGIN_AUTOLOAD: ""
        run: |
          mkdir -p reports/tests
          test_targets=$(cat /tmp/test_targets.txt || echo '.')
          echo "Targets: $test_targets"
          PLUGINS="-p pytest_cov -p pytest_html -p pytest_timeout"
          set +e
          pytest $PLUGINS -v --tb=short --maxfail=50 \
            --cov=. \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --cov-report=term-missing \
            --html=reports/tests/test-report.html --self-contained-html \
            --timeout=300 \
            $test_targets
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Parse coverage & set gate
        id: gate
        if: always()
        working-directory: target
        run: |
          python - <<'PY'
          import json, pathlib, os, sys
          covp = pathlib.Path("reports/tests/coverage.json")
          coverage = 0.0
          if covp.exists():
              try:
                  coverage = float(json.load(open(covp)).get("totals",{}).get("percent_covered",0.0))
              except Exception:
                  pass
          thr = float(os.environ.get("COVERAGE_THRESHOLD","70"))
          ok = (coverage >= thr) and ('${{ steps.run.outputs.pytest_exit_code }}' == '0')
          print(f"Coverage: {coverage:.2f}% (threshold {thr}%), tests_ok=${{ steps.run.outputs.pytest_exit_code == '0' }} => {'OK' if ok else 'NOT OK'}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"coverage={coverage:.2f}\n")
              f.write(f"ready={( 'true' if ok else 'false')}\n")
          sys.exit(0 if ok else 1)
          PY

      # --- SonarCloud integration (runs in repo root of 'target') ---
      - name: Write sonar-project.properties
        if: always()
        working-directory: target
        run: |
          cat > sonar-project.properties <<EOF
          sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          sonar.organization=${{ secrets.SONAR_ORG }}
          sonar.sources=.
          sonar.tests=tests
          sonar.test.inclusions=tests/**/*.py
          sonar.exclusions=**/venv/**,**/.venv/**,**/site-packages/**,**/migrations/**,**/.pytest_cache/**,**/__pycache__/**
          sonar.coverage.exclusions=tests/**
          sonar.python.version=3.10
          sonar.python.coverage.reportPaths=reports/tests/coverage.xml
          EOF
          echo "Created sonar-project.properties:"
          cat sonar-project.properties

      - name: Set up Java for SonarCloud
        if: always()
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: SonarCloud Scan (wait for Quality Gate)
        if: always()
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: target
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/reports/tests/
          retention-days: 14

      - name: Mark readiness (job summary)
        if: always()
        run: |
          echo "## CI Result" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.gate.outputs.ready }}" == "true" ]]; then
            echo "✅ All tests passed. Coverage **${{ steps.gate.outputs.coverage }}%** ≥ threshold. **Ready to deploy to Kubernetes.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or coverage below threshold (**${{ steps.gate.outputs.coverage }}%**). **Do NOT deploy.**" >> $GITHUB_STEP_SUMMARY

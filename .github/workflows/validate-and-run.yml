      - name: Discover and validate test structure
        working-directory: target
        run: |
          echo "🧪 Discovering and validating test structure..."
          
          # Create reports directory
          mkdir -p reports/tests
          
          python << 'EOF'
          import pathlib
          import ast
          import sys
          
          def is_excluded_path(path_str):
              """Check if path should be excluded from test discovery"""
              exclude_patterns = [
                  'venv', '.venv', 'env', '.env',
                  'site-packages', 'node_modules', 
                  '.git', '.pytest_cache', '__pycache__',
                  'build', 'dist', '.tox'
              ]
              
              path_parts = pathlib.Path(path_str).parts
              return any(pattern in path_parts for pattern in exclude_patterns)
          
          def find_valid_test_files():
              """Find valid test files with proper filtering"""
              root = pathlib.Path('.')
              test_files = []
              invalid_files = []
              
              # Look for test files with common patterns
              patterns = ['test_*.py', '*_test.py']
              
              for pattern in patterns:
                  for file_path in root.rglob(pattern):
                      file_str = str(file_path)
                      if not is_excluded_path(file_str) and file_path.is_file():
                          # Validate syntax
                          try:
                              content = file_path.read_text(encoding='utf-8', errors='ignore')
                              ast.parse(content, filename=str(file_path))
                              test_files.append(file_str)
                          except SyntaxError as e:
                              invalid_files.append((file_str, str(e)))
                              print(f"⚠️ Syntax error in {file_str}: {e}")
              
              return sorted(set(test_files)), invalid_files
          
          def find_test_directories():
              """Find test directories with proper filtering"""
              root = pathlib.Path('.')
              test_dirs = []
              
              for dir_path in root.rglob('*'):
                  if dir_path.is_dir() and dir_path.name in ['tests', 'test']:
                      dir_str = str(dir_path)
                      if not is_excluded_path(dir_str):
                          # Check if directory contains Python test files
                          has_test_files = any(
                              f.name.startswith('test_') or f.name.endswith('_test.py')
                              for f in dir_path.rglob('*.py')
                              if not is_excluded_path(str(f))
                          )
                          if has_test_files:
                              test_dirs.append(dir_str)
              
              return sorted(set(test_dirs))
          
          # Discover tests
          test_files, invalid_files = find_valid_test_files()
          test_dirs = find_test_directories()
          
          print(f"✅ Found {len(test_files)} valid test files")
          print(f"⚠️ Found {len(invalid_files)} invalid test files")
          
          if test_files:
              print("📁 Valid test files:")
              for file in test_files[:20]:  # Show first 20
                  print(f"  - {file}")
              if len(test_files) > 20:
                  print(f"  ... and {len(test_files) - 20} more")
          
          if test_dirs:
              print("📁 Test directories:")
              for dir in test_dirs:
                  print(f"  - {dir}")
          
          if invalid_files:
              print("❌ Invalid test files (will be skipped):")
              for file, error in invalid_files[:10]:
                  print(f"  - {file}: {error}")
          
          # Determine test targets
          test_targets = []
          
          # Add generated tests if they exist and we're not filtering
          run_generated_only = '${{ github.event.inputs.run_generated_only }}' == 'true'
          
          if run_generated_only:
              generated_tests = [f for f in test_files if 'tests/generated' in f]
              if generated_tests:
                  test_targets.extend(generated_tests)
                  print(f"🎯 Running only generated tests: {len(generated_tests)} files")
              else:
                  print("❌ No generated tests found but run_generated_only=true")
                  sys.exit(1)
          else:
              # Add all valid test files and directories
              test_targets.extend(test_files)
              test_targets.extend(test_dirs)
          
          if not test_targets:
              print("❌ No valid test targets found")
              sys.exit(1)
          
          print(f"🎯 Final test targets: {len(test_targets)} items")
          
          # Write targets to file for next step
          with open('/tmp/test_targets.txt', 'w') as f:
              f.write(' '.join(f'"{target}"' for target in test_targets))
          
          EOF


name: AI Test Generation

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to analyze"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"
      force_gen:
        description: "Force generation even if no code changes detected"
        required: false
        default: "false"
      prompt_style:
        description: "TESTGEN_PROMPT_STYLE (ultra_bare recommended)"
        required: false
        default: "ultra_bare"
  push:
    branches: [ test ]

concurrency:
  group: test-gen-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ---- Azure OpenAI (or OpenAI) ----
      AZURE_OPENAI_KEY:         ${{ secrets.AZURE_OPENAI_KEY         || secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT:    ${{ secrets.AZURE_OPENAI_ENDPOINT    || secrets.AZURE_OPENAI_API_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION || secrets.OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT:  ${{ secrets.AZURE_OPENAI_DEPLOYMENT  || secrets.OPENAI_DEPLOYMENT }}

      TESTGEN_PROMPT_STYLE: ${{ github.event.inputs.prompt_style || 'ultra_bare' }}

      # DB defaults for import-time engines
      DATABASE_URL: "sqlite:///:memory:"
      DB_URL: "sqlite:///:memory:"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clone target repository
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/DeviPrasad372002/django-test-app.git' }}"
          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
          git clone --depth 1 "$REPO_URL" target

      - name: Derive OUTDIR, TARGET_ROOT and repo metadata
        id: meta
        run: |
          echo "TARGET_ROOT=target" >> $GITHUB_ENV
          REPO_SLUG="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s#[^A-Za-z0-9._-]#_#g')"
          REPO_PATH="$(echo "${REPO_URL}" | sed -E 's#^https?://github.com/##; s/\.git$//')"
          OUTDIR="tests/generated/${REPO_SLUG}/current"
          mkdir -p "$OUTDIR"
          DEFAULT_BRANCH="$(git -C target remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"
          echo "REPO_SLUG=$REPO_SLUG"       >> $GITHUB_ENV
          echo "OUTDIR=$OUTDIR"             >> $GITHUB_ENV
          echo "REPO_PATH=$REPO_PATH"       >> $GITHUB_ENV
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV
          echo "repo_slug=$REPO_SLUG"       >> $GITHUB_OUTPUT
          echo "outdir=$OUTDIR"             >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH"       >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # ---- repo-agnostic constraints bootstrap (same pattern as validate workflow) ----
      - name: Bootstrap Python constraints (repo-agnostic)
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          python ci/py_stack_guard.py | tee /tmp/stack_env
          grep -E '^(PIP_CONSTRAINT|TESTGEN_PIP_CONSTRAINTS)=' /tmp/stack_env >> $GITHUB_ENV
          MODE="$(cat .stack_mode.txt)"
          echo "Resolved stack mode: $MODE"
          if [ "$MODE" = "legacy_flask" ]; then
            python -m pip install -U -c .constraints.txt \
              "Flask<2.3" "Werkzeug<2.3" "Flask-SQLAlchemy<3" "SQLAlchemy<2.0" \
              "Jinja2<3.1" "itsdangerous<2.1" "click<8.1" "MarkupSafe<2.1"
          fi

      - name: Install system build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libpq-dev default-libmysqlclient-dev \
            libjpeg-dev zlib1g-dev libpng-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev curl

      - name: Install Python deps (tooling + target libs, constrained)
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools

          # --- Tooling (honors PIP_CONSTRAINT when set) ---
          pip install "openai>=1.51.0" pytest pytest-cov httpx requests \
                      "fastapi>=0.110" "starlette>=0.37" "pydantic>=2" "annotated-types>=0.6" \
                      "uvicorn>=0.23" "typing-extensions>=4.8" psycopg2-binary || true

          # --- Target requirements (convert psycopg2 -> psycopg2-binary) ---
          install_requirements_file() {
            local req_file="$1"
            if [ -f "$req_file" ]; then
              echo "Installing from $req_file (constrained via PIP_CONSTRAINT if present)..."
              sed -i 's/^psycopg2\(\([^a-zA-Z0-9]\|$\)\)/psycopg2-binary\1/' "$req_file"
              pip install -r "$req_file" || echo "Some packages from $req_file failed to install"
            fi
          }

          install_requirements_file "target/requirements.txt"

          if compgen -G "target/requirements/*.txt" >/dev/null; then
            for f in target/requirements/*.txt; do
              install_requirements_file "$f"
            done
          fi

          # --- Poetry/PDM exports respected; Pipenv intentionally skipped ---
          if [ -f "target/pyproject.toml" ] && grep -q "\[tool.poetry\]" target/pyproject.toml; then
            pip install poetry || true
            (cd target && poetry export -f requirements.txt --without-hashes -o /tmp/poetry.lock.req) || true
            [ -s /tmp/poetry.lock.req ] && pip install -r /tmp/poetry.lock.req || true
          fi
          if [ -f "target/pyproject.toml" ] && grep -q "\[tool.pdm\]" target/pyproject.toml; then
            pip install pdm || true
            (cd target && pdm export -o /tmp/pdm.lock.req --without-hashes --dev) || true
            [ -s /tmp/pdm.lock.req ] && pip install -r /tmp/pdm.lock.req || true
          fi

      - name: Print core versions (debug)
        run: |
          python - <<'PY'
          import importlib
          for n in ("flask","werkzeug","flask_sqlalchemy","sqlalchemy","jinja2","itsdangerous","click","marshmallow"):
              try:
                  m=importlib.import_module(n); print(f"{n}: {getattr(m,'__version__','?')}")
              except Exception as e:
                  print(f"{n}: not installed ({e})")
          PY

      - name: Analyze target codebase
        run: python -m src.analyzer --root target > /tmp/analysis.json

      - name: Generate tests
        env:
          TARGET_ROOT: target
          FORCE: ${{ github.event.inputs.force_gen || 'false' }}
        run: |
          python - <<'PY'
          import os, json
          import src.generator as g
          analysis = json.load(open('/tmp/analysis.json'))
          outdir = os.environ['OUTDIR']
          if os.environ.get('FORCE', 'false').lower() == 'true':
              os.environ['TESTGEN_FORCE'] = 'true'
          g.generate_all(analysis, outdir=outdir, focus_files=None)
          PY

      - name: List generated tests
        run: |
          echo "Listing ${OUTDIR}"
          ls -lah "${OUTDIR}" || true
          echo "Preview .py files:"
          find "${OUTDIR}" -type f -name 'test_*.py' | sed 's/^/ - /' || true

      - name: Copy generated tests into target repo
        run: |
          mkdir -p target/tests/generated
          cp -r "${OUTDIR}"/* target/tests/generated/ || true
          echo "Final tests copied into target repo:"
          find target/tests/generated -name "test_*.py" | head -20

      - name: Commit & push generated tests
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 }}
        run: |
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$GH_PAT3" ]; then
            git remote set-url origin "https://x-access-token:${GH_PAT3}@github.com/${{ steps.meta.outputs.repo_path }}.git"
          fi
          git add tests/generated || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(testgen): update generated tests [skip ci]" || true
          git pull --rebase origin "${DEFAULT_BRANCH}" || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

# In [coverage:run] section, enhance omit patterns:
[coverage:run]
source = .
branch = true
omit = 
    */tests/*
    */test*
    */testing/*
    */migrations/*
    */venv/*
    */env/*
    */.venv/*
    */node_modules/*
    */build/*
    */dist/*
    */__pycache__/*
    */conftest.py
    */wsgi.py      
    */asgi.py     
    setup.py
    manage.py
    */test_*.py
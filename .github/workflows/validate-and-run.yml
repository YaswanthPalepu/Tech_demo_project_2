name: Validate Generated Tests (CI Gate)

on:
  push:
    branches: ["test2"]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repo to validate"
        required: false
        default: "https://github.com/DeviPrasad372002/django-test-app.git"

concurrency:
  group: validate-tests-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    env:
      PYTHONUTF8: "1"
      COVERAGE_THRESHOLD: "70"
      PASS_THRESHOLD: "80"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target repository URL
        id: target
        shell: bash
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          [ -z "$REPO_URL" ] && REPO_URL="https://github.com/DeviPrasad372002/django-test-app.git"
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Using repo: $REPO_URL"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core tooling
        shell: bash
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          pip install pytest pytest-cov pytest-timeout junitparser

      - name: Clone target repo
        env:
          GH_PAT3: ${{ secrets.GH_PAT3 || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO_URL='${{ steps.target.outputs.repo_url }}'
          URL="$REPO_URL"
          [[ "$URL" == git@* ]] && URL="https://github.com/${URL#git@github.com:}"
          [[ "$URL" != https://* ]] && URL="https://github.com/$URL"
          [[ "$URL" != *.git ]] && URL="${URL}.git"
          if [ -n "$GH_PAT3" ]; then
            URL="${URL/https:\/\//https://x-access-token:${GH_PAT3}@}"
          fi
          rm -rf target
          git clone --depth=1 "$URL" target
          echo "Cloned into ./target"

      - name: Copy tests from this repo into target (if present)
        shell: bash
        run: |
          if [ -d tests/generated ]; then
            mkdir -p target/tests/generated
            rsync -a tests/generated/ target/tests/generated/
            echo "Copied $(find target/tests/generated -type f -name 'test*.py' | wc -l) tests"
          else
            echo "No tests/generated here; will use tests in target"
          fi

      - name: Install target dependencies (manager-agnostic)
        working-directory: target
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip<25" wheel setuptools
          found=0
          for f in requirements-dev.txt requirements_test.txt requirements-tests.txt requirements.txt; do
            if [ -f "$f" ]; then
              echo "pip install -r $f"
              pip install -r "$f" || true
              found=1
            fi
          done
          pip install ".[test]" ".[tests]" ".[dev]" 2>/dev/null || true
          if [ -f pyproject.toml ]; then
            echo "pip install . (pyproject)"
            pip install . || true
            found=1
          fi
          if [ -f setup.cfg ] || [ -f setup.py ]; then
            echo "pip install -e . (setuptools)"
            pip install -e . || true
            found=1
          fi
          if grep -qi 'django' requirements*.txt 2>/dev/null || grep -qi 'django' pyproject.toml 2>/dev/null; then
            pip install pytest-django || true
          fi
          # Common native deps that often unblock builds
          pip install psycopg2-binary mysqlclient pillow lxml 2>/dev/null || true

      - name: Write pytest.ini (broad discovery + safe markers)
        working-directory: target
        shell: bash
        run: |
          if [ ! -f pytest.ini ] && [ ! -f tox.ini ] && ! grep -q "\[tool.pytest.ini_options\]" pyproject.toml 2>/dev/null; then
            cat > pytest.ini <<'INI'
          [pytest]
          python_files = test_*.py *_test.py *test*.py
          python_classes = Test* *Tests
          python_functions = test_* *_test test*
          markers =
              django_db: Django DB access
          addopts =
          INI
          fi
          cat pytest.ini 2>/dev/null || true

      - name: Write .coveragerc (omit venv/vendor)
        working-directory: target
        shell: bash
        run: |
          if [ ! -f .coveragerc ]; then
            cat > .coveragerc <<'EOF'
            [run]
            omit =
                */.venv/*
                */venv/*
                */env/*
                */site-packages/*
                */.tox/*
                */.pytest_cache/*
                */__pycache__/*
            EOF
          fi
          cat .coveragerc

      - name: Auto Django conftest (only if project uses Django)
        working-directory: target
        shell: bash
        run: |
          if find . -name "settings.py" -type f | grep -q .; then
            cat > conftest.py <<'PY'
            import os, sys, pathlib
            ROOT = pathlib.Path(__file__).resolve().parent
            if str(ROOT) not in sys.path:
                sys.path.insert(0, str(ROOT))

            def setup_django():
                try:
                    import django
                    from django.conf import settings
                    if not settings.configured:
                        candidates = []
                        for s in ROOT.rglob('settings.py'):
                            if 'migration' in str(s):
                                continue
                            if any(p in s.parts for p in ('.venv','venv','env','site-packages','.tox')):
                                continue
                            candidates.append(s)
                        candidates.sort(key=lambda p: len(p.parts))
                        if candidates:
                            rel = candidates[0].relative_to(ROOT).with_suffix('')
                            os.environ['DJANGO_SETTINGS_MODULE'] = '.'.join(rel.parts)
                        django.setup()
                except Exception as e:
                    print(f"Django setup warning: {e}")

            setup_django()
            PY
            echo "Wrote Django conftest.py"
          else
            echo "No Django settings detected; skipping conftest."
          fi

      - name: Discover test roots
        id: discover
        working-directory: target
        shell: bash
        run: |
          set -e
          mapfile -t ROOTS < <( \
            find . \
              \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
              -type d \( -iname "tests" -o -iname "test" \) -print | sort -u \
          )
          if [ ${#ROOTS[@]} -eq 0 ]; then
            mapfile -t ROOTS < <( \
              find . \
                \( -path "*/.git*" -o -path "*/.venv*" -o -path "*/venv*" -o -path "*/env*" -o -path "*/site-packages*" -o -path "*/.tox*" -o -path "*/__pycache__*" \) -prune -o \
                -type f \( -name "test_*.py" -o -name "*_test.py" -o -name "*test*.py" \) \
                -printf '%h\n' | sort -u \
            )
          fi
          if [ ${#ROOTS[@]} -eq 0 ]; then
            echo "No tests found."
            exit 1
          fi
          printf '%s\n' "${ROOTS[@]}" > /tmp/test_dirs.txt
          echo "Test roots:"; sed 's/^/ - /' /tmp/test_dirs.txt

      - name: Run tests with coverage
        id: run
        working-directory: target
        shell: bash
        continue-on-error: true
        run: |
          set -e
          mkdir -p reports/tests
          mapfile -t TEST_DIRS < /tmp/test_dirs.txt
          set +e
          pytest -v --tb=short --maxfail=50 \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=xml:reports/tests/coverage.xml \
            --cov-report=json:reports/tests/coverage.json \
            --junitxml=reports/tests/report.junit.xml \
            --timeout=300 \
            "${TEST_DIRS[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Compute pass% and coverage gates
        id: gate
        if: always()
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          import os, json, xml.etree.ElementTree as ET, pathlib, sys
          thr_pass = float(os.environ.get("PASS_THRESHOLD","80"))
          thr_cov  = float(os.environ.get("COVERAGE_THRESHOLD","70"))

          xmlp = pathlib.Path("reports/tests/report.junit.xml")
          tot=sk=fl=er=0
          if xmlp.exists():
              root = ET.parse(xmlp).getroot()
              suites = [root] if root.tag=="testsuite" else root.findall("testsuite")
              for s in suites:
                  tot += int(s.attrib.get("tests",0))
                  sk  += int(s.attrib.get("skipped",0))
                  fl  += int(s.attrib.get("failures",0))
                  er  += int(s.attrib.get("errors",0))
          eff = max(tot - sk, 0)
          passed = max(eff - fl - er, 0)
          pct = (passed/eff*100.0) if eff>0 else 0.0

          cov = 0.0
          covj = pathlib.Path("reports/tests/coverage.json")
          if covj.exists():
              try:
                  cov = float(json.load(open(covj)).get("totals", {}).get("percent_covered", 0.0))
              except Exception:
                  cov = 0.0

          cov_ok  = (cov >= thr_cov)
          pass_ok = (pct >= thr_pass) and (fl==0 and er==0)
          ready = pass_ok and cov_ok

          print(f"Total={tot} Skipped={sk} Failures={fl} Errors={er}")
          print(f"Pass%={pct:.2f} (thr {thr_pass}%)  Coverage={cov:.2f}% (thr {thr_cov}%)")
          print("READY TO DEPLOY" if ready else "NOT READY TO DEPLOY")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pass_pct={pct:.2f}\n")
              f.write(f"coverage={cov:.2f}\n")
              f.write(f"status={'READY TO DEPLOY' if ready else 'NOT READY TO DEPLOY'}\n")

          sys.exit(0 if ready else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            target/reports/tests/coverage.xml
            target/reports/tests/coverage.json
            target/reports/tests/report.junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI Result"
            echo "**Status:** ${{ steps.gate.outputs.status }}"
            echo "**Coverage:** ${{ steps.gate.outputs.coverage }}% (thr ${COVERAGE_THRESHOLD}%)"
            echo "**Pass %:** ${{ steps.gate.outputs.pass_pct }}% (thr ${PASS_THRESHOLD}%)"
          } >> "$GITHUB_STEP_SUMMARY"

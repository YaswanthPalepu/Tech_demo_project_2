name: AI-TestGen — Run & Coverage

on:
  # Auto-trigger when the Generate workflow completes successfully
  workflow_run:
    workflows: ["AI-TestGen — Generate Tests"]
    types: [completed]
  # Optional manual trigger
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository URL to run tests for (manual override)"
        required: true
        default: "https://github.com/DeviPrasad372002/django-test-app.git"

concurrency:
  group: testgen-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      # Pull artifacts from Generate (when auto-triggered)
      - name: Download meta (repo URL) from Generate
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: gen-meta
          path: gen-meta
          if_no_artifact_found: error

      - name: Download generated tests from Generate
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: generated-tests
          path: generated-tests
          if_no_artifact_found: warn

      - name: Resolve target repository URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPO_URL="${{ github.event.inputs.repo_url }}"
          else
            REPO_URL="$(cat gen-meta/repo_url.txt)"
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"

      - name: Clone target repository
        run: |
          echo "Cloning ${{ steps.target.outputs.repo_url }}"
          git clone "${{ steps.target.outputs.repo_url }}" target-repo

      - name: Inject generated tests into target repo
        run: |
          mkdir -p target-repo/tests/generated
          if [ -d "generated-tests" ]; then
            shopt -s nullglob
            cp -r generated-tests/* target-repo/tests/generated/ || true
          fi
          echo "Injected generated tests into target-repo/tests/generated"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps (incl. Flask async extra fix)
        run: |
          python -m pip install --upgrade pip
          # Core test tooling
          python -m pip install pytest pytest-cov coverage
          # Fix for Flask async tests (equivalent to installing flask[async] extra):
          python -m pip install asgiref || true
          # Target project deps
          if [ -f "target-repo/requirements.txt" ]; then
            python -m pip install -r target-repo/requirements.txt || true
          fi
          if [ -f "target-repo/pyproject.toml" ]; then
            python -m pip install ./target-repo || true
          fi

      - name: Run ONLY generated tests with coverage (catch bugs in source)
        working-directory: target-repo
        run: |
          mkdir -p ../artifacts/coverage ../artifacts/test-results
          if [ -d "tests/generated" ]; then
            echo "Running generated tests…"
            python -m pytest -q tests/generated \
              --junitxml ../artifacts/test-results/junit.xml \
              --cov . --cov-report xml:../artifacts/coverage/coverage.xml
          else
            echo "No generated tests found." >&2
            exit 1
          fi

      - name: Parse coverage gaps and failing tests (summary)
        run: |
          python - << 'PY'
          import xml.etree.ElementTree as ET, pathlib
          cov_path = pathlib.Path("artifacts/coverage/coverage.xml")
          junit_path = pathlib.Path("artifacts/test-results/junit.xml")
          summary_md = []
          line_rate = None

          # ---- Coverage summary & gaps
          gaps = []
          if cov_path.exists():
              root = ET.parse(cov_path).getroot()  # coverage.py XML
              line_rate = float(root.attrib.get("line-rate", "0"))
              for pkg in root.findall(".//packages/package"):
                  for cls in pkg.findall(".//classes/class"):
                      filename = cls.attrib.get("filename")
                      lines = cls.find("lines")
                      if lines is None:
                          continue
                      total = 0
                      covered = 0
                      for l in lines.findall("line"):
                          total += 1
                          hits = int(l.attrib.get("hits","0"))
                          if hits > 0: covered += 1
                      rate = (covered/total) if total else 0.0
                      gaps.append((rate, filename))
              gaps.sort(key=lambda x: x[0])
              top_gaps = gaps[:10]
              if top_gaps:
                  summary_md.append("### Top low-coverage files")
                  for rate, fn in top_gaps:
                      summary_md.append(f"- `{fn}` — {rate*100:.1f}%")

          # ---- Failing tests (bugs surfaced)
          failures_md = []
          if junit_path.exists():
              jr = ET.parse(junit_path).getroot()
              for tc in jr.findall(".//testcase"):
                  failure = tc.find("failure")
                  error = tc.find("error")
                  if failure is not None or error is not None:
                      cls = tc.attrib.get("classname","")
                      name = tc.attrib.get("name","")
                      msg = (failure or error).attrib.get("message","").strip()
                      failures_md.append(f"- **{cls}::{name}** — {msg[:200].replace('\\n',' ')}")

          print("## Generated Tests — Run Summary")
          if line_rate is not None:
              print(f"- **Line coverage (generated tests):** {line_rate*100:.1f}%")
          else:
              print(f"- **Line coverage (generated tests):** n/a")
          if failures_md:
              print("\n### Failing generated tests (bugs found)")
              print("\\n".join(failures_md))
          if summary_md:
              print("\n" + "\\n".join(summary_md))
          PY >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (coverage & junit for generated tests)
        uses: actions/upload-artifact@v4
        with:
          name: ai-testgen-run-artifacts
          path: |
            artifacts/coverage/**
            artifacts/test-results/**
          if-no-files-found: warn
